[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, PUT, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, If-Match"
    Access-Control-Expose-Headers = "ETag"

# Vendored PDF-Libraries: KEIN langes/immutable Caching, sonst kann ein einmal
# ausgelieferter 404 (oder eine alte Version) dauerhaft im Browser/CDN hängen
# bleiben. must-revalidate erzwingt, dass nach jedem Deploy die aktuelle Datei
# geholt wird. (.js liefert Netlify ohnehin als text/javascript aus.)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
