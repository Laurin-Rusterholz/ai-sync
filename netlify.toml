[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, PUT, OPTIONS"
    # If-None-Match erlaubt bedingte Abrufe (304) — Clients wie journal-mobile
    # sparen sich bei unveraendertem Stand den kompletten Datenkoerper.
    Access-Control-Allow-Headers = "Content-Type, Authorization, If-Match, If-None-Match"
    Access-Control-Expose-Headers = "ETag"

# Die Hauptapp ist eine einzige grosse HTML-Datei, die bei jedem Deploy neu
# gebaut wird. Sie darf nirgends zwischengespeichert werden: die beiden Edge
# Functions schreiben sie um und entfernen dabei den ETag, sodass eine
# zwischengespeicherte Fassung nicht mehr revalidiert werden koennte — ein Fix
# wuerde dann trotz Deploy nicht ankommen. Welcher Stand ausgeliefert wird,
# zeigt der Header x-quantus-build.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Icons und Embleme aendern sich praktisch nie — einen Tag im Browser-Cache
# halten spart bei jedem App-Start unnoetige Requests.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/emblem.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/apple-touch-icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vendored PDF-Libraries: KEIN langes/immutable Caching, sonst kann ein einmal
# ausgelieferter 404 (oder eine alte Version) dauerhaft im Browser/CDN hängen
# bleiben. must-revalidate erzwingt, dass nach jedem Deploy die aktuelle Datei
# geholt wird. (.js liefert Netlify ohnehin als text/javascript aus.)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Quantus-Hub: English-C1-App sichtbar in App-Uebersicht und Seitenleiste.
# Die sehr grosse Single-File-Hauptapp bleibt unveraendert; die Edge Function
# ergaenzt App-Registry und Router beim Ausliefern.
[[edge_functions]]
  function = "quantus-app-registry"
  path = "/"

[[edge_functions]]
  function = "quantus-app-registry"
  path = "/index.html"
