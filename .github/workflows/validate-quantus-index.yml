name: Validate Quantus index

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/quantus-english-c1-entry.js"
      - "public/quantus-career-model-entry.js"
      - "netlify/edge-functions/quantus-app-registry.js"
      - "tests/quantus-index-parser-repair.test.mjs"
      - "tests/quantus-english-c1-entry.test.mjs"
      - "tests/quantus-career-model-entry.test.mjs"
      - "tests/gmail-network-retry.test.mjs"
      - "tests/flowertech-projects.test.mjs"
      - "public/flowertech.js"
      - "tests/career-model-learning.test.mjs"
      - "tests/career-model-ideas.test.mjs"
      - "tests/persistence.test.mjs"
      - "public/bm.html"
      - "public/docstudio.html"
      - "public/quantus-bundles/**"
      - "public/career-model.css"
      - "tests/quantus-browser-module.test.mjs"
      - "tests/neko-proxy-detect.test.sh"
      - "netlify.toml"
      - "netlify/edge-functions/**"
      - "neko/**"
      - "scripts/deploy-neko-hostinger.sh"
      - "docs/quantus-browser-setup.md"
      - "package.json"
      - ".github/workflows/validate-quantus-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell-Syntax des VPS-Deploy-Skripts
        run: bash -n scripts/deploy-neko-hostinger.sh
      - name: Run Quantus regression tests
        run: npm test
