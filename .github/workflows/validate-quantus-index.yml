name: Validate Quantus index

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/quantus-english-c1-entry.js"
      - "public/quantus-career-model-entry.js"
      - "netlify/edge-functions/quantus-app-registry.js"
      - "tests/quantus-index-parser-repair.test.mjs"
      - "tests/quantus-english-c1-entry.test.mjs"
      - "tests/quantus-career-model-entry.test.mjs"
      - "tests/gmail-network-retry.test.mjs"
      - "tests/flowertech-projects.test.mjs"
      # Die FlowerTech-Prüfungen sichern den Kundenablauf ab — ohne sie im
      # Filter lief die Suite bei einer Änderung an genau diesen Dateien nicht.
      - "tests/flowertech-*.test.mjs"
      - "public/flowertech-workflow-core.js"
      - "netlify/functions/flowertech-*.mjs"
      - "netlify/lib/flowertech-core.mjs"
      - "netlify/lib/firebase-admin.mjs"
      - "netlify/lib/assistant-*.mjs"
      - "netlify/lib/quantus-v3-*.mjs"
      - "netlify/lib/quantus-v4-*.mjs"
      - "public/quantus-v3-*.mjs"
      - "prompts/quantus-v3/**"
      - "prompts/quantus-v4/**"
      - "tests/quantus-v4-*.test.mjs"
      - ".dockerignore"
      - "scripts/check-quantus-runtime-image.mjs"
      - "runtime/quantus-v3/**"
      - "infra/quantus-v3/**"
      - "tests/tagesbriefing-v3-*.test.mjs"
      - "netlify/lib/date-invite-core.mjs"
      - "netlify/functions/date-invite.mjs"
      - "public/flowertech.js"
      - "tests/career-model-learning.test.mjs"
      - "tests/career-model-ideas.test.mjs"
      - "tests/persistence.test.mjs"
      - "tests/quantus-v3-*.test.mjs"
      - "tests/f25-restore-core-contract.test.mjs"
      - "scripts/restore-core.mjs"
      - "public/bm.html"
      - "public/docstudio.html"
      - "public/quantus-bundles/**"
      - "public/career-model.css"
      - "tests/quantus-browser-module.test.mjs"
      - "tests/quantus-browser-layout-runtime.test.mjs"
      - "tests/flowertech-projekt-cockpit.test.mjs"
      - "tests/neko-proxy-detect.test.sh"
      - "tests/neko-smoke-failure-modes.test.sh"
      - "netlify.toml"
      - "netlify/edge-functions/**"
      - "neko/**"
      - "scripts/deploy-neko-hostinger.sh"
      - "docs/quantus-browser-setup.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-quantus-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell-Syntax des VPS-Deploy-Skripts
        run: bash -n scripts/deploy-neko-hostinger.sh
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run Quantus regression tests
        run: npm test
      - name: Run runtime and v4 leadership regressions
        run: node --test tests/quantus-v3-e2-*.test.mjs tests/quantus-v4-*.test.mjs tests/quantus-v3-cost-policy-port-freshness.test.mjs

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build runtime image from locked dependencies
        run: docker build -f runtime/quantus-v3/Dockerfile -t quantus-runtime-check .
      - name: Verify imports, reviewed prompts and unconfigured startup without network
        run: >-
          docker run --rm --network none
          --mount type=bind,source="${{ github.workspace }}/scripts/check-quantus-runtime-image.mjs",target=/check.mjs,readonly
          quantus-runtime-check node /check.mjs

  runtime-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - name: Validate and exercise infrastructure with an offline Google mock
        working-directory: infra/quantus-v3
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test -var-file=tests/runtime.auto.tfvars.json
