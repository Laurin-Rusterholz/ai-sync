# Quantus Browser — nginx-Server-Block.
#
# Diese Variante nutzen, wenn auf dem VPS bereits nginx als Reverse Proxy
# laeuft (typisch, wenn n8n darueber veroeffentlicht wird). Dann wird KEIN
# Caddy installiert; neko bekommt nur einen zusaetzlichen Server-Block.
#
# Ziel:   /etc/nginx/sites-available/neko.conf
#         ln -s /etc/nginx/sites-available/neko.conf /etc/nginx/sites-enabled/
# TLS:    certbot --nginx -d neko.laurin-rusterholz.ch
#         (Let's Encrypt, kostenlos; certbot ergaenzt den 443-Block selbst)
# Danach: nginx -t && systemctl reload nginx
#
# Der Block unten ist der HTTP-Ausgangszustand VOR certbot. certbot ergaenzt
# listen 443 ssl, die Zertifikatspfade und die Weiterleitung von 80 auf 443.

server {
    listen 80;
    listen [::]:80;
    server_name neko.laurin-rusterholz.ch;

    # Grosse Uploads in den Remote-Browser nicht abschneiden.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # WebSocket: ohne diese drei Zeilen kommt kein Bild und keine Steuerung.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Der Stream ist langlebig — keine kurzen Proxy-Timeouts.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
