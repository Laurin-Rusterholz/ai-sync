# Quantus Browser — neko (Chromium-Remote-Browser) auf dem Hostinger-KVM-1-VPS
#
# Chromium ist BEREITS im Image enthalten (ghcr.io/m1k1o/neko/chromium).
# Auf dem Ubuntu-Host wird KEIN Chromium per apt installiert — Host-
# Voraussetzungen sind nur Docker + Compose und ein Reverse Proxy.
#
# Deploy/Update:  bash scripts/deploy-neko-hostinger.sh
# Manuell:        cd /opt/quantus-neko && docker compose up -d
# Status:         cd /opt/quantus-neko && docker compose ps
# Logs:           cd /opt/quantus-neko && docker compose logs -f neko
#
# Secrets kommen ausschliesslich aus /opt/quantus-neko/.env (nicht im Git,
# Vorlage: .env.example). Im Quantus-Frontend steht KEIN Passwort.
services:
  neko:
    # Version bewusst gepinnt (kein :latest) — Updates laufen kontrolliert
    # ueber NEKO_IMAGE_TAG in der .env, siehe docs/quantus-browser-setup.md.
    image: ghcr.io/m1k1o/neko/chromium:${NEKO_IMAGE_TAG:-3.1.5}
    container_name: quantus-neko
    restart: unless-stopped

    # Chromium braucht laut neko-Doku mindestens 2 GB /dev/shm, sonst stuerzen
    # Renderer-Prozesse ab. Der Wert wird durch mem_limit mit abgesichert.
    shm_size: "2gb"
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp:unconfined

    ports:
      # HTTP nur lokal — nach aussen geht ausschliesslich der Reverse Proxy.
      - "127.0.0.1:${NEKO_HTTP_PORT:-8080}:8080"
      # WebRTC: ein einziger gemultiplexter UDP-Port statt eines grossen
      # Portbereichs. Auf KVM 1 spart das ~100 docker-proxy-Prozesse.
      - "${NEKO_WEBRTC_PORT:-59000}:${NEKO_WEBRTC_PORT:-59000}/udp"
      # TCP-Fallback auf demselben Port, falls UDP im Netz des Clients dicht ist.
      - "${NEKO_WEBRTC_PORT:-59000}:${NEKO_WEBRTC_PORT:-59000}/tcp"

    environment:
      # ── Server ────────────────────────────────────────────────────────────
      NEKO_SERVER_BIND: "0.0.0.0:8080"
      # Hinter dem Reverse Proxy: X-Forwarded-* vertrauen (Client-IP im Log).
      NEKO_SERVER_PROXY: "true"

      # ── WebRTC ────────────────────────────────────────────────────────────
      NEKO_WEBRTC_UDPMUX: "${NEKO_WEBRTC_PORT:-59000}"
      NEKO_WEBRTC_TCPMUX: "${NEKO_WEBRTC_PORT:-59000}"
      # Oeffentliche VPS-IP (kein Geheimnis) fuer NAT 1:1.
      NEKO_WEBRTC_NAT1TO1: "${NEKO_PUBLIC_IP}"
      NEKO_WEBRTC_ICELITE: "true"

      # ── Anmeldung ─────────────────────────────────────────────────────────
      # multiuser: ein User- und ein Admin-Passwort, beide nur serverseitig.
      NEKO_MEMBER_PROVIDER: "multiuser"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_USER_PASSWORD:?NEKO_USER_PASSWORD fehlt in .env}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:?NEKO_ADMIN_PASSWORD fehlt in .env}"

      # ── Sitzung ───────────────────────────────────────────────────────────
      # Cookie-Auth ist AUS — Kompatibilitaet, nicht Geschmack: Das Image 3.1.5
      # liefert den v2-Client aus, der ueber die Legacy-API spricht. Deren
      # Login liest den Token aus dem Antwort-Body; bei aktivierter Cookie-Auth
      # laesst neko ihn dort weg und JEDER Login scheitert mit "token not found
      # - make sure you are not using Cookie auth on the server" (Beleg:
      # server/internal/http/legacy/session.go im neko-Repo). Ohne Cookies
      # funktioniert der Login im Cross-Site-iframe wie im neuen Tab; der
      # Client merkt sich die Anmeldung selbst im localStorage seiner Origin.
      NEKO_SESSION_COOKIE_ENABLED: "false"
      # Die Legacy-Bruecke ausdruecklich anfordern statt sie vom Image-Default
      # abhaengen zu lassen: der mitgelieferte Client spricht ausschliesslich
      # die v2-Endpunkte (/ws, /file, /stats). Faellt `legacy` in einer
      # kuenftigen Version auf "false", waere die Anmeldung wieder tot — hier
      # steht deshalb explizit, worauf sich dieses Setup verlaesst.
      NEKO_LEGACY: "true"
      # Sitzungen auf Platte: serverseitige Sitzungen ueberleben Neustarts.
      NEKO_SESSION_FILE: "/home/neko/.neko/sessions.json"
      # Nach Reconnect (Netzwechsel, Tab-Wechsel) nicht die alte Sitzung killen.
      NEKO_SESSION_MERCIFUL_RECONNECT: "true"
      # Wer verbindet, bekommt direkt die Steuerung — kein manuelles "Take".
      NEKO_SESSION_IMPLICIT_HOSTING: "true"

      # ── Desktop / Datentransfer ───────────────────────────────────────────
      NEKO_DESKTOP_SCREEN: "${NEKO_SCREEN:-1280x720@30}"
      NEKO_DESKTOP_UNMINIMIZE: "true"
      # Drag & Drop vom eigenen Rechner in den Remote-Browser.
      NEKO_DESKTOP_UPLOAD_DROP: "true"
      # Experimentell (laut neko-Doku fehleranfaellig): faengt den Chromium-
      # Dateidialog ab und fragt stattdessen im Browser-Tab nach der Datei.
      # Bei Problemen in der .env auf "false" setzen.
      NEKO_DESKTOP_FILE_CHOOSER_DIALOG: "${NEKO_FILE_CHOOSER:-true}"
      # Datei-Transfer-Plugin: Up-/Download auch fuer den Nicht-Admin-User.
      NEKO_FILETRANSFER_ENABLED: "true"
      NEKO_FILETRANSFER_DIR: "/home/neko/Downloads"
      NEKO_FILETRANSFER_USER_UPLOAD: "true"
      NEKO_FILETRANSFER_USER_DOWNLOAD: "true"

    volumes:
      # Chromium-Profil: Cookies/Logins, Verlauf, Lesezeichen, Tabs/Tab-Gruppen,
      # Einstellungen. Gehoert 1000:1000 (User `neko` im Container) — das
      # Deploy-Skript setzt Eigentuemer/Rechte bei jedem Lauf idempotent.
      # root:root fuehrte live zum Chromium-Crash-Loop (SIGTRAP), weil
      # --user-data-dir nicht beschreibbar war.
      - ./data/profile:/home/neko/.config/chromium
      # Downloads + Ziel des Datei-Transfer-Plugins.
      - ./data/downloads:/home/neko/Downloads
      # neko-Sitzungsdatei (Anmeldung ueberlebt Neustarts).
      - ./data/neko:/home/neko/.neko
      # Chromium-Policies: aktiviert Downloads, Dateidialoge, Lesezeichen und
      # persistente Cookies. Read-only gemountet.
      - ./chromium-policies.json:/etc/chromium/policies/managed/policies.json:ro

    # /health ist nicht garantiert; die Startseite ist es. Der Check kommt ohne
    # curl/wget aus (beides ist im Image nicht zugesichert).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # Konservative Grenzen fuer KVM 1 (1 vCPU / 4 GB): der Container darf den
    # Host — insbesondere den bestehenden n8n — nicht verdraengen.
    mem_limit: ${NEKO_MEM_LIMIT:-2600m}
    memswap_limit: ${NEKO_MEM_LIMIT:-2600m}
    cpu_shares: 512
    # pids_limit zaehlt Threads mit: Chromium belegt schon mit wenigen Tabs
    # mehrere hundert davon (Browser-, GPU-, Netzwerk- und Renderer-Prozesse).
    # Bei 512 schlaegt clone() fehl und Chromium reisst mit SIGTRAP ab. 2048
    # laesst Luft und schuetzt den Host weiterhin vor Prozess-Explosionen.
    pids_limit: 2048

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
