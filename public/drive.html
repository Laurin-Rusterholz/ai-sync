<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantus · Drive</title>
<link rel="icon" href="favicon.svg">
<script>
/* Dunkelmodus früh anwenden (kein FOUC) — folgt dem App-Theme quantus_themeMode
   (dark | light | auto). Gleiche Origin wie index.html → localStorage geteilt. */
(function(){
  function istDunkel(){
    try {
      var m = localStorage.getItem("quantus_themeMode") || "dark";
      if (m === "light") return false;
      if (m === "auto") return !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      return true; // "dark" (Default)
    } catch(e){ return false; }
  }
  window.__driveTheme = function(){ try { document.documentElement.classList.toggle("dark", istDunkel()); } catch(e){} };
  window.__driveTheme();
  // Auf Theme-Wechsel in der Haupt-App reagieren (storage feuert dokumentübergreifend, same-origin)
  try { window.addEventListener("storage", function(e){ if (!e || e.key === null || e.key === "quantus_themeMode") window.__driveTheme(); }); } catch(e){}
  try { if (window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener("change", function(){ window.__driveTheme(); }); } catch(e){}
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   QUANTUS DRIVE — Design „Modern Cool"
   Luftiges, kühles Neutral (near-white) + tiefe Slate-Sidebar
   Akzente: klares Teal (primär) · Coral (Achtung) · Amber/Grün (Status)
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* Sidebar — tiefe, kühle Slate */
  --schiefer:      #1b1e24;
  --schiefer-tief: #15171c;
  --schiefer-hell: #272c34;
  /* Inhalt — luftiges, kühles Hell */
  --leinen:        #f4f6f9;
  --leinen-hell:   #ffffff;
  --leinen-tief:   #eef1f5;
  --linie:         #e4e8ee;
  --linie-dunkel:  #2c313b;
  /* Text */
  --tinte:         #1d2330;
  --muted:         #616b7a;
  --muted-hell:    #98a1af;
  /* Akzente */
  --coral:         #ef6a4d;
  --coral-tief:    #d6512f;
  --teal:          #159a8f;
  --teal-tief:     #0f7f76;
  --teal-weich:    rgba(21,154,143,.12);
  --sand:          #d8b878;
  --gruen:         #4f9d5f;
  --auf-dunkel:    #e7e9ee;   /* Schrift auf immer-dunklen Flächen (Toast, Viewer, Log, Sidebar) */
  --radius:        12px;
  --radius-gross:  16px;
  --schatten:      0 1px 2px rgba(20,28,40,.05), 0 6px 20px rgba(20,28,40,.06);
  --schatten-tief: 0 2px 6px rgba(20,28,40,.08), 0 16px 44px rgba(20,28,40,.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--leinen);
  color: var(--tinte);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; cursor: pointer; }
input, select { font: inherit; }
::selection { background: var(--sand); color: var(--schiefer); }

#app { display:flex; height:100vh; overflow:hidden; }

/* ── Sidebar (Schiefer) ─────────────────────────────────────────────────── */
#sidebar {
  width: 268px; min-width: 268px;
  background: var(--schiefer);
  color: #e7e9ee;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.sb-brand {
  padding: 20px 18px 15px;
  font-size: 17px; font-weight: 700; letter-spacing: -.2px;
  border-bottom: 1px solid var(--linie-dunkel);
}
.sb-brand small { display:block; font-size:10.5px; font-weight:600; color:var(--muted-hell); letter-spacing:1.6px; text-transform:uppercase; margin-top:3px; }
.sb-upload { padding: 14px 14px 10px; }
.btn-upload {
  width:100%; padding:11px 12px; border:0; border-radius:var(--radius);
  background: var(--coral); color:#fff; font-weight:650; font-size:14px;
  box-shadow: 0 4px 14px rgba(239,106,77,.28);
  transition: background .15s, box-shadow .18s, transform .12s;
}
.btn-upload:hover { background: var(--coral-tief); box-shadow: 0 6px 18px rgba(239,106,77,.36); }
#nav { flex:1; overflow-y:auto; padding: 6px 8px 12px; }
.nav-item, .baum-zeile {
  display:flex; align-items:center; gap:9px;
  padding: 8px 10px; border-radius: 9px; cursor:pointer;
  color: #cfd4dd; font-size: 13.5px;
  user-select:none;
}
.nav-item:hover, .baum-zeile:hover { background: var(--schiefer-hell); color:#fff; }
.nav-item.aktiv, .baum-zeile.aktiv { background: linear-gradient(90deg, var(--teal-weich), transparent 92%), var(--schiefer-hell); color:#fff; box-shadow: inset 2.5px 0 0 var(--teal); }
.nav-item.aktiv .zahl { background:var(--teal); }
.nav-item .zahl { margin-left:auto; font-size:11px; background:rgba(255,255,255,.13); color:#fff; border-radius:20px; padding:1px 8px; font-weight:700; }
.nav-sep { margin: 14px 12px 6px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted-hell); font-weight:700; }
.baum-zeile { padding-left: calc(10px + var(--tiefe, 0) * 16px); }
.baum-pfeil { width:14px; text-align:center; font-size:10px; color:var(--muted-hell); flex:none; transition: transform .12s; }
.baum-pfeil.offen { transform: rotate(90deg); }
.baum-pfeil.leer { visibility:hidden; }
.baum-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.baum-zeile.typ-bereich .baum-name { font-weight: 650; }
.baum-zeile.typ-thema .baum-name { color: var(--muted-hell); font-size:13px; }
.sb-fuss {
  padding: 10px 14px; border-top: 1px solid var(--linie-dunkel);
  font-size: 11.5px; color: var(--muted-hell);
  display:flex; align-items:center; gap:7px;
}
.sb-fuss .punkt { width:8px; height:8px; border-radius:50%; background:var(--muted-hell); flex:none; }
.sb-fuss .punkt.online { background: var(--teal); }
.btn-neuer-ordner {
  margin: 4px 14px 12px; padding: 7px 10px;
  background:transparent; color:var(--muted-hell);
  border:1px dashed var(--linie-dunkel); border-radius:8px; font-size:12.5px;
}
.btn-neuer-ordner:hover { color:var(--auf-dunkel); border-color:var(--muted-hell); }
.btn-login {
  margin: 4px 14px 12px; padding: 9px 12px;
  background: var(--teal); color: #fff; border: 0; border-radius: 8px;
  font-weight: 700; font-size: 13px;
}
.btn-login:hover { background: var(--teal-tief); }

/* ── Hauptbereich (Leinen) ──────────────────────────────────────────────── */
#haupt { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
#kopf {
  padding: 15px 26px; display:flex; align-items:center; gap:16px;
  border-bottom: 1px solid var(--linie); background: rgba(255,255,255,.72);
  backdrop-filter: saturate(1.4) blur(8px); -webkit-backdrop-filter: saturate(1.4) blur(8px);
}
#brotkrumen { font-size: 15px; font-weight: 650; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.1px; }
#brotkrumen .trenner { color: var(--muted-hell); margin: 0 8px; font-weight:400; }
#brotkrumen .krume { color: var(--muted); }
#brotkrumen .krume:last-child { color: var(--tinte); }
#sucheInput {
  width: 320px; padding: 9px 15px 9px 15px;
  border: 1px solid var(--linie); border-radius: 22px;
  background: var(--leinen); color: var(--tinte); outline: none;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
#sucheInput::placeholder { color: var(--muted-hell); }
#sucheInput:focus { border-color: var(--teal); background:var(--leinen-hell); box-shadow: 0 0 0 3.5px rgba(21,154,143,.14); }
#liste { flex:1; overflow-y:auto; padding: 22px 26px 44px; }
#haupt.drop-aktiv::after {
  content: "Dateien hier ablegen"; position:absolute; inset:10px;
  border: 3px dashed var(--teal); border-radius: 14px;
  background: rgba(62,142,135,.08); color: var(--teal-tief);
  display:flex; align-items:center; justify-content:center;
  font-size: 20px; font-weight: 700; pointer-events:none; z-index: 5;
}

/* Upload-Fortschritt */
.upload-karte {
  background:var(--leinen-hell); border:1px solid var(--linie); border-radius:var(--radius);
  padding: 12px 16px; margin-bottom: 12px; box-shadow: var(--schatten);
}
.upload-karte .uk-kopf { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
.upload-karte .uk-phase { color: var(--muted); }
.uk-balken { height:6px; border-radius:3px; background: var(--leinen-tief); overflow:hidden; }
.uk-balken > div { height:100%; background: var(--teal); border-radius:3px; transition: width .2s; }

/* Dokument-Tabelle */
table.docs { width:100%; border-collapse: separate; border-spacing:0; background:var(--leinen-hell); border:1px solid var(--linie); border-radius: var(--radius-gross); overflow:hidden; box-shadow: var(--schatten); }
table.docs th {
  text-align:left; font-size: 11px; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted); font-weight: 700; padding: 12px 16px;
  background: var(--leinen); border-bottom: 1px solid var(--linie);
  position: sticky; top: 0; z-index: 2;
}
table.docs td { padding: 13px 16px; border-bottom: 1px solid var(--leinen-tief); vertical-align: middle; }
table.docs tr.doc-zeile { cursor: pointer; }
table.docs tr.doc-zeile:hover td { background: var(--leinen); }
table.docs tbody tr:last-child td { border-bottom: 0; }
.doc-name { font-weight: 600; display:flex; align-items:center; gap:11px; min-width:0; }
.doc-name .icon {
  flex:none; font-size:17px; width:34px; height:34px; border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center;
  background: var(--leinen); border:1px solid var(--linie);
}
.doc-zeile:hover .doc-name .icon { background:var(--leinen-hell); border-color:var(--linie); }
.doc-name .txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 340px; }
.doc-name .orig { display:block; font-size:11.5px; color:var(--muted); font-weight:400; margin-top:1px; }
.zelle-muted { color: var(--muted); font-size: 13px; white-space:nowrap; }
.tag {
  display:inline-block; background: var(--teal-weich); color: var(--teal-tief);
  border-radius: 20px; padding: 2px 10px; font-size: 11.5px; margin: 1px 3px 1px 0; font-weight:500;
}
.dup-hinweis { color: var(--coral-tief); font-size: 12px; font-weight:600; white-space:nowrap; }
.doc-info { border:0; background:transparent; cursor:pointer; font-size:13px; opacity:.45; margin-left:4px; padding:1px 3px; border-radius:5px; flex:none; }
.doc-zeile:hover .doc-info { opacity:1; }
.doc-info:hover { background: var(--leinen-tief); }

/* Status-Badges */
.badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size: 11.5px; font-weight: 650; letter-spacing:.1px;
  border-radius: 20px; padding: 3px 11px; white-space:nowrap;
}
.badge .pkt { width:7px; height:7px; border-radius:50%; background: currentColor; flex:none; }
.b-eingang            { background:var(--leinen-tief); color:#5b6472; }
.b-wird_klassifiziert { background:rgba(21,154,143,.13); color:var(--teal-tief); }
.b-wird_klassifiziert .pkt { animation: pulsieren 1.1s ease-in-out infinite; }
.b-klassifiziert      { background:rgba(79,157,95,.15);  color:#3c7a4c; }
.b-review_noetig      { background:rgba(239,106,77,.15); color:var(--coral-tief); }
.b-abgelegt           { background:rgba(216,184,120,.24); color:#8a6d34; }
.b-papierkorb         { background:var(--leinen-tief); color:var(--muted-hell); }
@keyframes pulsieren { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.75);} }

.leer-zustand { text-align:center; color: var(--muted); padding: 84px 20px; }
.leer-zustand .gross { font-size: 46px; margin-bottom: 12px; opacity:.85; }

/* ── Detail-Drawer ──────────────────────────────────────────────────────── */
#drawer {
  position: fixed; top:0; right:0; bottom:0; width: min(560px, 92vw);
  background: var(--leinen-hell); border-left: 1px solid var(--linie);
  box-shadow: -8px 0 30px rgba(43,48,54,.18);
  transform: translateX(105%); transition: transform .18s ease-out;
  display:flex; flex-direction:column; z-index: 40;
}
#drawer.offen { transform: translateX(0); }
.dr-kopf { padding: 16px 20px; border-bottom:1px solid var(--linie); display:flex; align-items:flex-start; gap:12px; }
.dr-kopf h2 { font-size: 16px; line-height:1.35; flex:1; word-break:break-word; }
.dr-schliessen { border:0; background:transparent; font-size:20px; color:var(--muted); padding:2px 6px; border-radius:6px; }
.dr-schliessen:hover { background: var(--leinen-tief); color: var(--tinte); }
.dr-inhalt { flex:1; overflow-y:auto; padding: 16px 20px 30px; }
.dr-meta { display:grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; margin-bottom: 16px; }
.dr-meta dt { color: var(--muted); }
.dr-meta dd { word-break: break-word; }
.vorschlag-karte {
  background:var(--leinen-hell); border:1px solid var(--linie); border-left: 4px solid var(--teal);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
}
.vorschlag-karte.review { border-left-color: var(--coral); }
.vk-titel { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 9px; }
.vk-ziel { font-weight: 650; font-size: 14.5px; margin-bottom: 4px; }
.vk-ziel .trenner { color: var(--muted-hell); margin: 0 6px; font-weight:400; }
.vk-zeile { font-size: 13px; margin: 5px 0; color: var(--tinte); }
.vk-zeile b { font-weight: 650; }
.konfidenz-balken { height: 7px; border-radius: 4px; background: var(--leinen-tief); overflow:hidden; margin: 4px 0 2px; }
.konfidenz-balken > div { height:100%; border-radius:4px; }
.fehler-box { background: rgba(217,108,87,.1); border:1px solid rgba(217,108,87,.35); color: var(--coral-tief); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
.dr-aktionen { display:flex; flex-wrap:wrap; gap: 9px; margin-bottom: 18px; }
.btn {
  padding: 9px 16px; border-radius: 9px; border: 1px solid var(--linie);
  background: var(--leinen-hell); color: var(--tinte); font-weight: 600; font-size: 13.5px;
}
.btn:hover { background: var(--leinen-tief); border-color:#d7dce3; }
.btn.primaer { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 3px 12px rgba(21,154,143,.24); }
.btn.primaer:hover { background: var(--teal-tief); }
.btn.gefahr { color: var(--coral-tief); border-color: rgba(217,108,87,.5); }
.btn.gefahr:hover { background: rgba(217,108,87,.1); }
#vorschau { margin-top: 8px; }
#vorschau iframe { width:100%; height: 460px; border:1px solid var(--linie); border-radius: var(--radius); background:#fff; }
#vorschau img { max-width:100%; border:1px solid var(--linie); border-radius: var(--radius); }
.textauszug { background:var(--leinen-hell); border:1px solid var(--linie); border-radius: var(--radius); padding: 12px 14px; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; max-height: 180px; overflow-y:auto; }

/* ── Modal ──────────────────────────────────────────────────────────────── */
#modalHintergrund {
  position: fixed; inset:0; background: rgba(43,48,54,.45);
  display:none; align-items:center; justify-content:center; z-index: 60; padding: 20px;
}
#modalHintergrund.offen { display:flex; }
#modalBox {
  background: var(--leinen-hell); border:1px solid var(--linie); border-radius: var(--radius-gross); box-shadow: var(--schatten-tief);
  width: min(460px, 100%); padding: 22px 24px;
}
#modalBox h3 { font-size: 16px; margin-bottom: 14px; }
#modalBox label { display:block; font-size: 12.5px; color: var(--muted); font-weight:600; margin: 12px 0 4px; }
#modalBox input[type=text], #modalBox select {
  width:100%; padding: 9px 12px; border:1px solid var(--linie); border-radius: 9px; background:var(--leinen); color:var(--tinte); outline:none;
}
#modalBox input[type=text]:focus, #modalBox select:focus { border-color: var(--teal); }
.modal-aktionen { display:flex; justify-content:flex-end; gap: 9px; margin-top: 18px; }
#modalBox label.inline { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--tinte); font-weight:500; }
.bf-log {
  margin-top: 12px; background: var(--schiefer); color: var(--auf-dunkel);
  border-radius: 8px; padding: 10px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.55; height: 190px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all; display: none;
}
.bf-log.aktiv { display: block; }
.bf-log .warn { color: var(--sand); }
.bf-log .fehler { color: var(--coral); }

/* ── Toast ──────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--schiefer); color: var(--auf-dunkel);
  padding: 10px 20px; border-radius: 24px; font-size: 13.5px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 100; max-width: 86vw;
}
#toast.sichtbar { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Dokument-Viewer (Bild-Lightbox, Word-/Text-Ansicht) ────────────────── */
#viewerOverlay {
  position: fixed; inset: 0; background: rgba(43,48,54,.88);
  display: none; flex-direction: column; z-index: 70;
}
#viewerOverlay.offen { display: flex; }
.vw-kopf {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; color: var(--auf-dunkel); flex: none;
}
.vw-kopf .vw-titel { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vw-kopf a.btn, .vw-kopf button.btn { background: var(--schiefer-hell); border-color: var(--linie-dunkel); color: var(--auf-dunkel); text-decoration: none; }
.vw-kopf a.btn:hover, .vw-kopf button.btn:hover { background: var(--schiefer-tief); }
.vw-inhalt { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 0 18px 24px; }
.vw-inhalt img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; border-radius: 8px; box-shadow: 0 12px 44px rgba(0,0,0,.45); margin: auto; }
.vw-papier {
  background: #fff; color: #222; border-radius: 8px; box-shadow: 0 12px 44px rgba(0,0,0,.45);
  width: min(860px, 100%); padding: 44px 52px; line-height: 1.7; font-size: 15px;
}
.vw-papier h1 { font-size: 24px; margin: 22px 0 10px; }
.vw-papier h2 { font-size: 20px; margin: 18px 0 8px; }
.vw-papier h3 { font-size: 17px; margin: 14px 0 7px; }
.vw-papier p { margin: 8px 0; }
.vw-papier table { border-collapse: collapse; width: 100%; margin: 12px 0; }
.vw-papier td, .vw-papier th { border: 1px solid #d5d0c4; padding: 7px 11px; text-align: left; }
.vw-papier ul, .vw-papier ol { margin: 8px 0; padding-left: 26px; }
.vw-papier img { max-width: 100%; box-shadow: none; margin: 8px 0; }
.vw-papier pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.vw-laden { color: var(--auf-dunkel); text-align: center; margin: auto; font-size: 15px; }
.vw-laden .gross { font-size: 40px; margin-bottom: 10px; }

/* ── Ansichts-Umschalter (Liste ⇄ Kacheln) ─────────────────────────────────── */
.ansicht-toggle { display:flex; gap:2px; background:var(--leinen); border:1px solid var(--linie); border-radius:10px; padding:3px; flex:none; }
.ansicht-toggle button { border:0; background:transparent; color:var(--muted); padding:5px 10px; border-radius:7px; font-size:14px; line-height:1; display:inline-flex; align-items:center; gap:5px; }
.ansicht-toggle button:hover { color:var(--tinte); }
.ansicht-toggle button.aktiv { background:var(--leinen-hell); color:var(--teal-tief); box-shadow:0 1px 3px rgba(20,28,40,.10); }

/* ── Kachel-Ansicht ────────────────────────────────────────────────────────── */
.karten { display:grid; grid-template-columns:repeat(auto-fill,minmax(224px,1fr)); gap:14px; }
.karte {
  background:var(--leinen-hell); border:1px solid var(--linie); border-radius:var(--radius-gross);
  padding:15px 16px; cursor:pointer; display:flex; flex-direction:column; gap:9px; min-height:172px;
  box-shadow:var(--schatten); transition:border-color .13s, box-shadow .18s, transform .1s;
}
.karte:hover { border-color:var(--teal); box-shadow:var(--schatten-tief); transform:translateY(-2px); }
.karte-kopf { display:flex; align-items:flex-start; justify-content:space-between; }
.karte-icon { font-size:24px; width:46px; height:46px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:var(--leinen); border:1px solid var(--linie); }

<!-- Firebase compat-SDK v10.8.0 — identisch zur Hauptapp (index.html), plus Auth für anonyme Anmeldung -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
(function () {
"use strict";

// ═══════════════════════════════════════════════════════════════════════════
// KONFIGURATION — Werte identisch zu public/index.html (~Zeile 5168)
// ═══════════════════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC6xVo-wmXC4JjG7qMQnOExIjU-UDvBluE",
  authDomain: "jupidu-36804.firebaseapp.com",
  databaseURL: "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jupidu-36804",
  storageBucket: "jupidu-36804.firebasestorage.app",
  messagingSenderId: "11390726952",
  appId: "1:11390726952:web:aba2f101b6c5ca2bc5561d",
  measurementId: "G-LT97CCT5DF"
};
// RTDB-Instanz explizit (europe-west1) — wie in index.html, kein databaseURL in der Config nötig.
const RTDB_DB_URL = "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app";

const P_FOLDERS = "driveFolders";
const P_DOCS    = "driveDocs";
const P_INBOX   = "driveInbox";

// Taxonomie — dient NUR zur Erst-Initialisierung des Ordnerbaums (falls leer).
// Danach lebt der Baum frei erweiterbar in der RTDB.
const TAXONOMIE = [
  { name: "Organisationen",    unter: ["EBS","Jupidu","Operation Libero","Reformplattform","SP AR","SP Herisau","Synode","YES"] },
  { name: "Projekte",          unter: ["Persönliche Projekte","Projekte in Organisationen","Monetarisierung"] },
  { name: "Wissen & Recherche",unter: ["Recherchen laufend","Recherchen abgeschlossen","Factsheets","Artikel"], themen: ["Cybersicherheit CH","Sudan-Konflikt"] },
  { name: "Bildung & Beruf",   unter: ["Schule","Writing","Versicherungen","Lernen EBMP/VWL"] },
  { name: "Persönlich",        unter: ["Steuern","Lohnabrechnungen","Fotobücher","Private Dokumente"] },
  { name: "Vorlagen",          unter: [] },
  { name: "System/Meta",       unter: [] },
  { name: "Eingang",           unter: [] }
];

const TEXT_ENDUNGEN = ["txt","md","csv","json","html","xml","vtt","srt"];

// ═══════════════════════════════════════════════════════════════════════════
// FIREBASE-SETUP + ANONYME ANMELDUNG
// ═══════════════════════════════════════════════════════════════════════════
let db = null, storage = null, auth = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth    = firebase.auth();
  storage = firebase.storage();
  db      = firebase.app().database(RTDB_DB_URL);
} catch (e) {
  console.error("Firebase Init fehlgeschlagen:", e);
}

const S = {
  bereit: false,            // Auth abgeschlossen + Listener aktiv
  ordner: {},               // driveFolders
  docs: {},                 // driveDocs
  inbox: {},                // driveInbox (für Duplikat-/Fehlerhinweis vor Klassifizierung)
  ansicht: { art: "eingang", folderId: null },   // art: eingang | alle | papierkorb | ordner
  suche: "",
  offen: {},                // Baum-Aufklappzustand
  drawerDocId: null,
  vorschauOffen: false,
  viewMode: (function(){ try { return localStorage.getItem("drive-view") === "grid" ? "grid" : "list"; } catch(e){ return "list"; } })(),
  uploads: {}               // laufende Uploads {tempId: {name, prozent, phase}}
};

function boot() {
  if (!auth) { toast("Firebase SDK nicht geladen — Adblocker prüfen"); return; }
  // Rückkehr aus einem signInWithRedirect-Fallback abschliessen (falls Popup blockiert war)
  try { auth.getRedirectResult().catch(function () {}); } catch (e) {}
  auth.onAuthStateChanged(function (user) {
    const punkt    = document.getElementById("authPunkt");
    const text     = document.getElementById("authText");
    const bfBtn    = document.getElementById("backfillBtn");
    const rsBtn    = document.getElementById("rescanBtn");
    const loginBtn = document.getElementById("loginBtn");
    if (user) {
      punkt.classList.add("online");
      text.textContent = "Verbunden: " + (user.email || user.displayName || "Google");
      if (bfBtn) bfBtn.style.display = "";      // Scan-/Einreihen-Buttons nur sichtbar, wenn eingeloggt
      if (rsBtn) rsBtn.style.display = "";
      if (loginBtn) loginBtn.style.display = "none";
      if (!S.bereit) { S.bereit = true; listenerStarten(); taxonomieSeedFallsLeer(); }
    } else {
      punkt.classList.remove("online");
      text.textContent = "Nicht angemeldet";
      if (bfBtn) bfBtn.style.display = "none";
      if (rsBtn) rsBtn.style.display = "none";
      if (loginBtn) loginBtn.style.display = "";
      render(); // Hinweis in der Liste aktualisieren
    }
  });
}

// Google-Login (statt Anonymous Auth — der Google-Provider muss in der
// Firebase-Konsole aktiviert sein). Die Session wird lokal persistiert:
// Anmeldung ist pro Browser nur einmal nötig; onAuthStateChanged stellt sie
// bei jedem Laden still wieder her.
function loginFehlerText(e) {
  const code = (e && e.code) || "";
  const msg = (e && e.message) || "";
  if (code.indexOf("api-key") >= 0 || msg.indexOf("api-key") >= 0 || msg.indexOf("API key not valid") >= 0)
    return "API-Key lehnt Firebase Auth ab: In der Google-Cloud-Konsole (APIs & Dienste → Anmeldedaten → Browser-Key) die „Identity Toolkit API“ bei den API-Einschränkungen erlauben — und in Firebase unter Authentication einmal „Get started“ klicken.";
  if (code === "auth/operation-not-allowed")
    return "Google-Provider ist in Firebase nicht aktiviert (Authentication → Sign-in method → Google).";
  if (code === "auth/unauthorized-domain")
    return "Diese Domain fehlt in Firebase unter Authentication → Settings → Autorisierte Domains.";
  if (code === "auth/operation-not-supported-in-this-environment")
    return "Anmeldung in dieser Einbettung nicht möglich — bitte drive.html direkt in einem eigenen Tab öffnen und dort anmelden.";
  if (code === "auth/network-request-failed")
    return "Netzwerkfehler — Verbindung/Adblocker prüfen.";
  return "Fehler: " + (code || msg || "unbekannt");
}

async function googleAnmelden() {
  if (!auth) return;
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    if (e && e.code === "auth/popup-blocked") {
      // Redirect-Fallback nur top-level — im eingebetteten Iframe verweigert
      // Google die Darstellung (X-Frame-Options).
      if (window.self === window.top) {
        try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      } else {
        e = { code: "auth/operation-not-supported-in-this-environment", message: "Popup blockiert (Iframe)" };
      }
    }
    if (e && e.code === "auth/popup-closed-by-user") return; // bewusst abgebrochen
    console.error("Google-Anmeldung fehlgeschlagen:", e);
    const grund = loginFehlerText(e);
    const text = document.getElementById("authText");
    if (text) text.textContent = "Login-Fehler: " + ((e && e.code) || "?");
    toast(grund);
    // Im eingebetteten Modus zusätzlich den Ausweg anbieten
    if (window.self !== window.top && e && e.code !== "auth/operation-not-allowed") {
      try { window.open("drive.html", "_blank", "noopener"); } catch (e3) {}
    }
  }
}

function listenerStarten() {
  // autoAblage() nach beiden Updates: Docs können vor dem Ordnerbaum eintreffen
  // (und umgekehrt) — die Funktion prüft selbst, ob beides bereit ist.
  db.ref(P_FOLDERS).on("value", function (snap) { S.ordner = snap.val() || {}; render(); autoAblage(); });
  db.ref(P_DOCS).on("value",    function (snap) { S.docs   = snap.val() || {}; render(); autoAblage(); });
  db.ref(P_INBOX).on("value",   function (snap) { S.inbox  = snap.val() || {}; render(); });
}

// Ordnerbaum aus der Taxonomie anlegen — NUR wenn driveFolders komplett leer ist.
async function taxonomieSeedFallsLeer() {
  try {
    const snap = await db.ref(P_FOLDERS).once("value");
    if (snap.exists() && snap.val() && Object.keys(snap.val()).length) return;
    const jetzt = new Date().toISOString();
    const alle = {};
    TAXONOMIE.forEach(function (b) {
      const bid = db.ref(P_FOLDERS).push().key;
      alle[bid] = { name: b.name, bereich: b.name, parentId: null, typ: "bereich", erstellt: jetzt };
      (b.unter || []).forEach(function (u) {
        const uid = db.ref(P_FOLDERS).push().key;
        alle[uid] = { name: u, bereich: b.name, parentId: bid, typ: "unterordner", erstellt: jetzt };
      });
      (b.themen || []).forEach(function (t) {
        const tid = db.ref(P_FOLDERS).push().key;
        alle[tid] = { name: t, bereich: b.name, parentId: bid, typ: "thema", erstellt: jetzt };
      });
    });
    await db.ref(P_FOLDERS).set(alle);
    toast("Ordnerbaum aus Taxonomie initialisiert");
  } catch (e) {
    console.warn("Taxonomie-Seed übersprungen:", e && e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// HILFSFUNKTIONEN
// ═══════════════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("sichtbar");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove("sichtbar"); }, 3500);
}
function fmtGroesse(b) {
  b = Number(b) || 0;
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}
function fmtDatum(iso) {
  if (!iso) return "–";
  try { return new Date(iso).toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  catch (e) { return String(iso).slice(0, 10); }
}
function dateiIcon(mime, name) {
  const n = String(name || "").toLowerCase();
  if ((mime || "").startsWith("image/")) return "🖼️";
  if ((mime || "") === "application/pdf" || n.endsWith(".pdf")) return "📕";
  if (n.endsWith(".docx") || n.endsWith(".doc")) return "📘";
  if (n.endsWith(".xlsx") || n.endsWith(".csv")) return "📗";
  if (TEXT_ENDUNGEN.some(function (e) { return n.endsWith("." + e); })) return "📄";
  return "📎";
}
function endung(name) { return (String(name || "").split(".").pop() || "").toLowerCase(); }
function lc(s) { return String(s == null ? "" : s).trim().toLowerCase(); }

// ── Typabhängiges Öffnen ──
// PDF → PDF-Editor der Hauptapp (eingebettet: postMessage; standalone: Deep-Link
// index.html?openpdf=… in neuem Tab) · Bild → Lightbox · DOCX → Word-Ansicht
// (mammoth, Fallback Download) · .doc/.odt → Download · Textformate →
// Text-Ansicht · Rest → Drawer wie bisher.
function dateiKategorie(d) {
  const n = lc(d && d.dateiname), m = String((d && d.mimeType) || "");
  if (m === "application/pdf" || n.endsWith(".pdf")) return "pdf";
  if (m.startsWith("image/") || /\.(png|jpe?g|gif|webp|svg|heic|bmp|avif)$/.test(n)) return "bild";
  if (n.endsWith(".docx") || m.indexOf("wordprocessingml") >= 0) return "docx";
  if (/\.(doc|odt)$/.test(n) || m === "application/msword") return "word-alt";
  if (TEXT_ENDUNGEN.indexOf(endung(d && d.dateiname)) >= 0 || m.startsWith("text/")) return "text";
  return "sonst";
}
function istEingebettet() { try { return window.self !== window.top; } catch (e) { return true; } }
function pdfImEditorOeffnen(d) {
  try {
    window.parent.postMessage({ type: "quantus-open-pdf", url: d.downloadUrl, name: d.titel_final || d.dateiname || "Dokument.pdf", storagePath: d.storagePath || null }, location.origin);
    toast("Öffne im PDF-Editor …");
    return true;
  } catch (e) { return false; }
}
// Standalone (drive.html direkt im Browser): Hauptapp in neuem Tab starten —
// sie öffnet das PDF über den URL-Parameter ?openpdf=… im vollen Editor.
function pdfExternOeffnen(d) {
  const url = "index.html?openpdf=" + encodeURIComponent(d.downloadUrl) +
    "&pdfname=" + encodeURIComponent(d.titel_final || d.dateiname || "Dokument.pdf") +
    (d.storagePath ? "&pdfpath=" + encodeURIComponent(d.storagePath) : "");
  window.open(url, "_blank", "noopener");
}
function pdfOeffnen(d) {
  if (!d || !d.downloadUrl) return false;
  if (istEingebettet() && pdfImEditorOeffnen(d)) return true;
  pdfExternOeffnen(d);
  return true;
}
function dateiHerunterladen(d) {
  const a = document.createElement("a");
  a.href = d.downloadUrl; a.target = "_blank"; a.rel = "noopener"; a.download = d.dateiname || "";
  document.body.appendChild(a); a.click(); a.remove();
}
function docOeffnen(docId) {
  const d = S.docs[docId]; if (!d) return;
  const kat = dateiKategorie(d);
  if (d.downloadUrl) {
    if (kat === "pdf") { pdfOeffnen(d); return; }
    if (kat === "bild") { bildAnzeigen(d); return; }
    if (kat === "docx") { wordAnzeigen(d); return; }
    if (kat === "word-alt") {
      dateiHerunterladen(d);
      toast("Word-Dokument wird heruntergeladen …");
      S.drawerDocId = docId; S.vorschauOffen = false; renderDrawer(); return;
    }
    if (kat === "text") { textAnzeigen(d); return; }
  }
  S.drawerDocId = docId; S.vorschauOffen = false; renderDrawer();
}

// mammoth-HTML entschärfen: DOCX-Inhalte sind nicht vertrauenswürdig — mammoth
// escapt Text, übernimmt aber Hyperlink-Ziele unverändert (javascript:-Links!).
// Konservativ: Event-Handler weg, href nur http/https/mailto/#, img nur data:/https:.
function saubereDocxHtml(html) {
  const doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html");
  const wurzel = doc.body.firstChild;
  wurzel.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(function (el) { el.remove(); });
  wurzel.querySelectorAll("*").forEach(function (el) {
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      const n = a.name.toLowerCase();
      const v = String(a.value || "").trim().toLowerCase();
      if (n.indexOf("on") === 0) { el.removeAttribute(a.name); return; }
      if (n === "href" && !(v.indexOf("http:") === 0 || v.indexOf("https:") === 0 || v.indexOf("mailto:") === 0 || v.indexOf("#") === 0)) { el.removeAttribute(a.name); return; }
      if (n === "href") { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener"); }
      if (n === "src" && !(v.indexOf("data:image/") === 0 || v.indexOf("https:") === 0)) el.removeAttribute(a.name);
    });
  });
  return wurzel.innerHTML;
}

// ── Viewer-Overlay (Bild-Lightbox, Word-/Text-Ansicht) ──
// Token verhindert die Race, dass eine langsam ladende Word-/Text-Ansicht ein
// danach geöffnetes anderes Dokument überschreibt.
let _viewerToken = 0;
function viewerOeffnen(titel, downloadUrl, inhaltHtml) {
  _viewerToken++;
  document.getElementById("vwTitel").textContent = titel;
  document.getElementById("vwDownload").href = downloadUrl || "#";
  document.getElementById("vwInhalt").innerHTML = inhaltHtml;
  document.getElementById("viewerOverlay").classList.add("offen");
  return _viewerToken;
}
function viewerSchliessen() {
  _viewerToken++;
  document.getElementById("viewerOverlay").classList.remove("offen");
  document.getElementById("vwInhalt").innerHTML = "";
}
function bildAnzeigen(d) {

async function sha256Hex(arrayBuffer) {
  const digest = await crypto.subtle.digest("SHA-256", arrayBuffer);
  return Array.from(new Uint8Array(digest)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}

// ── Ordner-Helfer ──
function kinder(parentId) {
  return Object.keys(S.ordner)
    .filter(function (id) { return (S.ordner[id].parentId || null) === (parentId || null); })
    .sort(function (a, b) { return S.ordner[a].name.localeCompare(S.ordner[b].name, "de"); });
}
function ordnerPfad(id) {
  const teile = []; let cur = id, schutz = 0;
  while (cur && S.ordner[cur] && schutz++ < 20) { teile.unshift(S.ordner[cur].name); cur = S.ordner[cur].parentId; }
  return teile;
}
function ordnerWurzel(id) {
  let cur = id, schutz = 0;
  while (cur && S.ordner[cur] && S.ordner[cur].parentId && schutz++ < 20) cur = S.ordner[cur].parentId;
  return cur && S.ordner[cur] ? S.ordner[cur] : null;
}
// Namensvergleich für Ordner: case-insensitive und Umlaut-tolerant —
// „Persönlich" ≡ „Persoenlich", Akzente werden entfernt. So mappt der
// KI-Vorschlag zuverlässig auf bestehende driveFolders-Einträge.
function normName(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ").trim();
}
function findeOrdner(name, parentId) {
  const n = normName(name);
  return kinder(parentId).find(function (id) { return normName(S.ordner[id].name) === n; }) || null;
}
async function findeOderErstelleOrdner(name, parentId, typ, bereichName) {
  const vorhanden = findeOrdner(name, parentId);
  if (vorhanden) return vorhanden;
  const id = db.ref(P_FOLDERS).push().key;
  const eintrag = { name: String(name).trim(), bereich: bereichName || String(name).trim(), parentId: parentId || null, typ: typ, erstellt: new Date().toISOString() };
  await db.ref(P_FOLDERS + "/" + id).set(eintrag);
  S.ordner[id] = eintrag; // lokal sofort verfügbar (Listener zieht gleich nach)
  return id;
}

// Duplikat-Verdacht: clientseitiger Hash-Abgleich (Upload) ODER Rückmeldung aus Queue/Vorschlag
function istDuplikat(docId, doc) {
  if (doc && doc.vorschlag && doc.vorschlag.duplikat_verdacht === true) return true;
  const q = S.inbox[docId];
  return !!(q && q.duplikat_verdacht === true);
}

// TEXTEXTRAKTION — wiederverwendet aus index.html („ATTACHMENT TEXT EXTRACTION")
// PDF: gevendortes pdf.js (UMD v3, disableWorker) · DOCX: mammoth.js · Text: TextDecoder
// ═══════════════════════════════════════════════════════════════════════════
async function loadPDFLibrary() {
  if (window.pdfjsLib && window.pdfjsLib.getDocument) return true;
  // Reihenfolge wie in index.html: gevendorte UMD-Builds zuerst, dann CDN-Fallback.
  const quellen = [
    { js: "/vendor/pdf/pdf.min.js",   worker: "/vendor/pdf/pdf.worker.min.js" },
    { js: "/vendor/pdfjs/pdf.min.js", worker: "/vendor/pdfjs/pdf.worker.min.js" },
    { js: "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js",            worker: "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js" },
    { js: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js", worker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js" }
  ];
  for (const q of quellen) {
    try {
      await new Promise(function (resolve, reject) {
        const s = document.createElement("script");
        s.src = q.js;
        if (/^https?:/.test(q.js)) s.crossOrigin = "anonymous";
        s.onload = resolve; s.onerror = function () { reject(new Error("script onerror")); };
        document.head.appendChild(s);
      });
      if (window.pdfjsLib && window.pdfjsLib.getDocument) {
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = q.worker; } catch (e) {}
        return true;
      }
    } catch (e) { /* nächste Quelle */ }
  }
  return false;
}

async function loadMammothLibrary() {
  if (window.mammoth) return true;
  const urls = [
    "https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js",
    "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"
  ];
  for (const url of urls) {
    try {
      await new Promise(function (resolve, reject) {
        const s = document.createElement("script");
        s.src = url; s.crossOrigin = "anonymous";
        s.onload = resolve; s.onerror = reject;
        setTimeout(function () { reject(new Error("Timeout")); }, 15000);
        document.head.appendChild(s);
      });
      if (window.mammoth) return true;
    } catch (e) { /* nächste Quelle */ }
  }
  return false;
}

// ── OCR-Fallback für PDFs ohne Textebene (gescannte/bildbasierte PDFs) ──
// Tesseract.js wird lazy per CDN geladen — NUR wenn ein PDF keinen Text
// liefert; die App wird dadurch nicht grösser. Sprachen: Deutsch + Englisch.
async function loadTesseractLibrary() {
  if (window.Tesseract) return true;
  const urls = [
    "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js",
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
  ];
  for (const url of urls) {
    try {
      await new Promise(function (resolve, reject) {
        const s = document.createElement("script");
        s.src = url; s.crossOrigin = "anonymous";
        s.onload = resolve; s.onerror = reject;
        setTimeout(function () { reject(new Error("Timeout")); }, 20000);
        document.head.appendChild(s);
      });
      if (window.Tesseract) return true;
    } catch (e) { /* nächste Quelle */ }
  }
  return false;
}

// Erste Seiten eines PDFs rendern und per OCR lesen. Wirft nie — liefert ""
// wenn OCR nicht möglich ist (Engine nicht ladbar, Render-Fehler, …).
const OCR_MAX_SEITEN = 5;
async function pdfOcrText(arrayBuffer, dateiname) {
  try {
    toast("OCR läuft für " + (dateiname || "PDF") + " …");
    if (!(await loadPDFLibrary()) || !window.pdfjsLib) return "";
    if (!(await loadTesseractLibrary()) || !window.Tesseract) {
      toast("OCR nicht möglich — Tesseract.js nicht ladbar (Adblocker/Netz?)");
      return "";
    }
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)), disableWorker: true }).promise;
    const n = Math.min(pdf.numPages, OCR_MAX_SEITEN);
    let worker = null;
    try { if (window.Tesseract.createWorker) worker = await window.Tesseract.createWorker("deu+eng"); } catch (e) { worker = null; }
    const teile = [];
    try {
      for (let i = 1; i <= n; i++) {
        toast("OCR läuft für " + (dateiname || "PDF") + " … Seite " + i + "/" + n);
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 2 });
        const cv = document.createElement("canvas");
        cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
        const res = worker ? await worker.recognize(cv) : await window.Tesseract.recognize(cv, "deu+eng");
        teile.push(String((res && res.data && res.data.text) || ""));
      }
    } finally {
      if (worker) { try { await worker.terminate(); } catch (e) {} }
    }
    let text = teile.join("\n\n").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (text && pdf.numPages > n) text += "\n\n[OCR: nur die ersten " + n + " von " + pdf.numPages + " Seiten erkannt]";
    return text;
  } catch (e) {
    console.warn("[Drive] OCR fehlgeschlagen:", dateiname, e && e.message);
    return "";
  }
}

async function extrahiereText(file, arrayBuffer) {
  const name = lc(file.name);
  const typ = file.type || "";
  try {
    // ─── PDF ───
    if (name.endsWith(".pdf") || typ === "application/pdf") {
      const ok = await loadPDFLibrary();
      if (!ok || !window.pdfjsLib) throw new Error("PDF.js nicht verfügbar");
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)), disableWorker: true }).promise;
      const seiten = [];
      const maxSeiten = Math.min(pdf.numPages, 80); // Limit für Performance (wie index.html)
      for (let i = 1; i <= maxSeiten; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        seiten.push(tc.items.map(function (it) { return it.str; }).join(" "));
      }
      let text = seiten.join("\n\n");
      if (pdf.numPages > maxSeiten) text += "\n\n[... " + (pdf.numPages - maxSeiten) + " weitere Seiten nicht extrahiert ...]";
      text = text.replace(/[ \t]+/g, " ").trim();
      // Keine/kaum Textebene → gescanntes PDF: OCR-Fallback (Tesseract, lazy)
      if (text.replace(/\s+/g, "").length < 20) {
        const ocr = await pdfOcrText(arrayBuffer, file.name);
        if (ocr && ocr.length > text.length) return "[OCR] " + ocr;
      }
      return text;
    }
    // ─── Word .docx (mammoth) ───
    if (name.endsWith(".docx") || typ === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") {
      const ok = await loadMammothLibrary();
      if (!ok || !window.mammoth) throw new Error("mammoth.js nicht verfügbar (Adblocker?)");
      const res = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer.slice(0) });
      return String((res && res.value) || "").trim();
    }
    // ─── Reine Textformate ───
    if (TEXT_ENDUNGEN.indexOf(endung(file.name)) >= 0 || typ.startsWith("text/")) {
      let text = new TextDecoder("utf-8").decode(arrayBuffer);
      if (name.endsWith(".html") || name.endsWith(".xml")) {
        text = text.replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ");
      }
      return text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    }
  } catch (e) {
    console.warn("[Drive] Textextraktion fehlgeschlagen:", file.name, e && e.message);
  }
  return ""; // Bilder & unbekannte Formate: kein Text
}

// ═══════════════════════════════════════════════════════════════════════════
// UPLOAD-PIPELINE
// Storage-Upload → Text extrahieren → SHA-256 + Duplikat-Check →
// driveDocs (status "eingang") → driveInbox (status "pending", für n8n)
// ═══════════════════════════════════════════════════════════════════════════
async function dateienHochladen(fileList) {
  if (!S.bereit) { toast("Noch nicht verbunden — bitte kurz warten"); return; }
  const dateien = Array.from(fileList || []);
  for (const f of dateien) dateiHochladen(f); // parallel, je eigene Fortschrittskarte
}

async function dateiHochladen(file) {
  const tempId = "u_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
  S.uploads[tempId] = { name: file.name, prozent: 0, phase: "Lädt hoch …" };
  renderListe();
  try {
    const docId = db.ref(P_DOCS).push().key;
    const storagePath = "drive/" + docId + "/" + file.name;

    // a) Storage-Upload → downloadUrl
    const ref = storage.ref(storagePath);
    const task = ref.put(file, {
      contentType: file.type || "application/octet-stream",
      customMetadata: { uploadDate: new Date().toISOString() }
    });
    const downloadUrl = await new Promise(function (resolve, reject) {
      task.on("state_changed",
        function (snap) { S.uploads[tempId].prozent = Math.round((snap.bytesTransferred / snap.totalBytes) * 100); renderListe(); },
        reject,
        async function () { try { resolve(await task.snapshot.ref.getDownloadURL()); } catch (e) { reject(e); } }
      );
    });

    // b) Text extrahieren (clientseitig, wie in der Hauptapp)
    S.uploads[tempId].phase = "Extrahiere Text …"; S.uploads[tempId].prozent = 100; renderListe();
    const arrayBuffer = await file.arrayBuffer();
    const text = await extrahiereText(file, arrayBuffer);

    // c) SHA-256 + Duplikat-Verdacht gegen bestehende driveDocs-Hashes
    const hash = await sha256Hex(arrayBuffer);
    const duplikat = Object.keys(S.docs).some(function (id) { return S.docs[id] && S.docs[id].hash === hash; });

    // d) driveDocs — Status "eingang"
    const jetzt = new Date().toISOString();
    await db.ref(P_DOCS + "/" + docId).set({
      dateiname: file.name,
      titel_final: "",
      storagePath: storagePath,
      downloadUrl: downloadUrl,
      mimeType: file.type || "application/octet-stream",
      groesse: file.size,
      hash: hash,
      status: "eingang",
      folderId: null,
      vorschlag: null,
      textauszug: text.slice(0, 12000),
      erstellt: jetzt,
      aktualisiert: jetzt
    });

    // e) driveInbox — Queue-Eintrag für n8n (Muster entityInbox: Status-Feld, kein Löschen)
    await db.ref(P_INBOX + "/" + docId).set({
      docId: docId,
      dateiname: file.name,
      mimeType: file.type || "application/octet-stream",
      text: text.slice(0, 6000),
      hash: hash,
      duplikat_verdacht: duplikat,
      status: "pending",
      erstellt: jetzt
    });

    delete S.uploads[tempId];
    toast("„" + file.name + "“ hochgeladen — Klassifizierung angestossen");
    render();
  } catch (e) {
    console.error("[Drive] Upload fehlgeschlagen:", e);
    delete S.uploads[tempId];
    toast("Upload fehlgeschlagen: " + (e && e.message ? e.message : "Unbekannter Fehler"));
    render();
  }
}

// VORSCHLAG ÜBERNEHMEN / AUTO-ABLAGE / ÄNDERN / PAPIERKORB

// Kern-Zuordnung: KI-Vorschlag (vorschlag.bereich/unterordner/thema) auf echte
// driveFolders-IDs mappen (Namensvergleich case-insensitive + Umlaut-tolerant;
// fehlende Ebenen werden als driveFolders-Eintrag angelegt) und das Dokument
// ablegen. Das Ordner-Link-Feld auf dem Doc ist `folderId` — genau darüber
// filtert die Ordner-Ansicht (S.ansicht.art === "ordner", inkl. Eltern-Kette).
// Zusätzlich werden `bereich` und `titel_final` gesetzt.
async function vorschlagAblegen(docId, doc) {
  const v = (doc && doc.vorschlag) || {};
  // Bereich muss ein echter Wurzel-Ordner sein, sonst Fallback "Eingang"
  const bereichName = v.bereich && findeOrdner(v.bereich, null) ? v.bereich : "Eingang";
  const bereichId = await findeOderErstelleOrdner(bereichName, null, "bereich", bereichName);
  let zielId = bereichId;
  if (v.unterordner) zielId = await findeOderErstelleOrdner(v.unterordner, bereichId, "unterordner", bereichName);
  if (v.thema)       zielId = await findeOderErstelleOrdner(v.thema, zielId, "thema", bereichName);
  await db.ref(P_DOCS + "/" + docId).update({
    folderId: zielId,
    bereich: (S.ordner[bereichId] && S.ordner[bereichId].name) || bereichName,
    titel_final: v.titel_vorschlag || doc.titel_final || doc.dateiname,
    status: "abgelegt",
    aktualisiert: new Date().toISOString()
  });
  return zielId;
}

async function vorschlagUebernehmen(docId) {
  const doc = S.docs[docId];
  if (!doc || !doc.vorschlag) { toast("Kein Vorschlag vorhanden"); return; }
  try {
    const zielId = await vorschlagAblegen(docId, doc);
    toast("Abgelegt unter: " + ordnerPfad(zielId).join(" › "));
  } catch (e) {
    toast("Übernehmen fehlgeschlagen: " + (e && e.message));
  }
}

// ── Auto-Ablage: sicher klassifizierte Dokumente (confidence ≥ 0.85) landen
//    automatisch im Zielordner. Darunter bleibt es bei manueller Bestätigung
//    („Übernehmen"); review_noetig bleibt ohnehin manuell. Läuft nach jedem
//    Docs-/Ordner-Update über die RTDB-Listener; idempotent, weil abgelegte
//    Dokumente ein folderId tragen und nicht mehr matchen. ──
const AUTO_ABLAGE_CONFIDENCE = 0.85;
let _autoAblageLaeuft = false;
async function autoAblage() {
  if (_autoAblageLaeuft || !S.bereit) return;
  if (!Object.keys(S.ordner).length) return; // Ordnerbaum noch nicht geladen
  const ids = Object.keys(S.docs).filter(function (id) {
    const d = S.docs[id];
    return d && d.status === "klassifiziert" && !d.folderId && d.vorschlag &&
      Number(d.vorschlag.confidence) >= AUTO_ABLAGE_CONFIDENCE;
  });
  if (!ids.length) return;
  _autoAblageLaeuft = true;
  let n = 0;
  try {
    for (const id of ids) {
      try { await vorschlagAblegen(id, S.docs[id]); n++; }
      catch (e) { console.warn("[Drive] Auto-Ablage fehlgeschlagen:", id, e && e.message); }
    }
    if (n) toast(n + " Dokument(e) automatisch abgelegt (Confidence ≥ " + Math.round(AUTO_ABLAGE_CONFIDENCE * 100) + " %)");
  } finally {
    _autoAblageLaeuft = false;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// NACH-EINREIHEN — bestehende driveDocs mit Status "eingang" erneut in die
// Klassifizierungs-Queue stellen (driveInbox, Status "pending"). Deckt
// Einträge ab, die der Storage-Backfill überspringt (z. B. App-Uploads mit
// Hash, deren Inbox-Eintrag fehlt oder auf "error" steht).
// ═══════════════════════════════════════════════════════════════════════════

// Einen bestehenden driveDocs-Eintrag zur Klassifizierung einreihen:
// Datei laden → Text frisch extrahieren → Hash bilden (falls er fehlt) →
// driveDocs anreichern → driveInbox mit Status "pending" schreiben
// (identisches Feldschema wie beim Upload; n8n-Poll greift es beim
// nächsten Lauf auf).
async function driveEnqueueForClassification(docId, doc) {
  doc = doc || S.docs[docId];
  if (!doc) throw new Error("Unbekanntes Dokument: " + docId);
  let url = doc.downloadUrl || null;
  if (!url && doc.storagePath) {
    try { url = await storage.ref(doc.storagePath).getDownloadURL(); } catch (e) {}
  }
  let text = String(doc.textauszug || "");
  let hash = String(doc.hash || "");
  if (url) {
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const ab = await resp.arrayBuffer();
        const frisch = await extrahiereText({ name: doc.dateiname, type: doc.mimeType || "" }, ab);
        if (frisch) text = frisch;
        if (!hash) hash = await sha256Hex(ab);
      }
    } catch (e) { /* Metadaten reichen — n8n klassifiziert notfalls per Dateiname */ }
  }
  const duplikat = !!hash && Object.keys(S.docs).some(function (id) {
    return id !== docId && S.docs[id] && S.docs[id].hash === hash;
  });
  const jetzt = new Date().toISOString();
  await db.ref(P_DOCS + "/" + docId).update({
    textauszug: text.slice(0, 12000),
    hash: hash || null,
    downloadUrl: url || doc.downloadUrl || "",
    aktualisiert: jetzt
  });
  await db.ref(P_INBOX + "/" + docId).set({
    docId: docId,
    dateiname: doc.dateiname || "",
    mimeType: doc.mimeType || "application/octet-stream",
    text: text.slice(0, 6000),
    hash: hash,
    storagePath: doc.storagePath || "",
    duplikat_verdacht: duplikat,
    status: "pending",
    erstellt: jetzt
  });
  return true;
}
window.driveEnqueueForClassification = driveEnqueueForClassification; // auch extern aufrufbar

function rescanKandidaten() {
  return Object.keys(S.docs).filter(function (id) {
    const d = S.docs[id];
    if (!d) return false;
    // "eingang": noch nie erfolgreich klassifiziert. "review_noetig" ohne
    // Textauszug: gescannte PDFs — die OCR im Einreih-Pfad liefert jetzt Text,
    // danach klassifiziert n8n automatisch neu.
    const ohneText = String(d.textauszug || "").trim().length < 20;
    if (!(d.status === "eingang" || (d.status === "review_noetig" && ohneText))) return false;
    const q = S.inbox[id];
    if (q && (q.status === "pending" || q.status === "processing")) return false; // läuft bereits
    return true;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BACKFILL — bestehende Storage-Dateien scannen und in die Queue stellen
// Läuft komplett im Browser mit der anonymen Anmeldung (kein Admin-SDK).
// ═══════════════════════════════════════════════════════════════════════════
// NUR unkritische Ordner. belege/ und buchhaltung-sp-ar/ enthalten
// Finanzdaten und bleiben HART ausgeschlossen: Die Blockliste wird sowohl
// beim rekursiven Abstieg als auch nochmals pro Datei-Pfad geprüft.
const BACKFILL_PREFIXES = ["attachments/", "cloud-sync/", "drive/", "project-inbox/", "task-files/"];
const BACKFILL_BLOCKLISTE = ["belege/", "buchhaltung-sp-ar/"];
const BACKFILL_MAX_BYTES = 50 * 1024 * 1024; // Dateien > 50 MB überspringen

let _bfLaeuft = false, _bfStop = false;

function bfBlockiert(pfad) {
  const p = String(pfad || "");
  return BACKFILL_BLOCKLISTE.some(function (b) { return p === b || p.indexOf(b) === 0; });
}
async function sha256HexText(s) {
  return sha256Hex(new TextEncoder().encode(String(s)));
}
function bfLog(msg, klasse) {
  const el = document.getElementById("bfLog");
  if (!el) return;
  el.classList.add("aktiv");
  const zeile = document.createElement("div");
  if (klasse) zeile.className = klasse;
  zeile.textContent = msg;
  el.appendChild(zeile);
  el.scrollTop = el.scrollHeight;
}
function bfFortschritt(txt) {
  const el = document.getElementById("bfFortschritt");
  if (el) el.textContent = txt;
}

function backfillDialog() {
  modalOeffnen(
    "<h3>Bestehende Dateien scannen</h3>" +
    '<div style="font-size:12.5px;color:var(--muted);line-height:1.55">Durchsucht ' +
    BACKFILL_PREFIXES.map(function (p) { return "<code>" + esc(p) + "</code>"; }).join(", ") +
    " rekursiv und stellt neue Dateien in die Klassifizierungs-Queue (<code>driveInbox</code>). " +
    "Bereits erfasste Dateien werden übersprungen (idempotent). " +
    "<b>belege/ und buchhaltung-sp-ar/ sind hart ausgeschlossen (Finanzdaten).</b></div>" +
    '<label class="inline" style="margin-top:12px"><input type="checkbox" id="bfProbelauf"> Probelauf — nur auflisten, nichts schreiben</label>' +
    '<div id="bfFortschritt" style="font-size:12px;color:var(--muted);margin-top:10px"></div>' +
    '<div id="bfLog" class="bf-log"></div>' +
    '<div class="modal-aktionen">' +
    '<button class="btn" data-action="modal-schliessen">Schliessen</button>' +
    '<button class="btn gefahr" id="bfStopp" data-action="backfill-stopp" style="display:none">Stopp</button>' +
    '<button class="btn primaer" id="bfStart" data-action="backfill-start">Scan starten</button></div>',
    null
  );
}

// Rekursives Auflisten via Storage-SDK; Blockliste gilt auch beim Abstieg.
async function bfListeRekursiv(ref, sammel) {
  const res = await ref.listAll();
  res.items.forEach(function (it) { sammel.push(it); });
  for (const p of res.prefixes) {
    if (_bfStop) return;
    if (bfBlockiert(p.fullPath.replace(/\/?$/, "/"))) continue;
    await bfListeRekursiv(p, sammel);
  }
}

async function backfillStarten() {
  if (_bfLaeuft) return;
  if (!S.bereit || !auth || !auth.currentUser) { toast("Nicht angemeldet — Scan nicht möglich"); return; }
  _bfLaeuft = true; _bfStop = false;
  const probelauf = !!(document.getElementById("bfProbelauf") || {}).checked;
  const startBtn = document.getElementById("bfStart");
  const stoppBtn = document.getElementById("bfStopp");
  if (startBtn) startBtn.style.display = "none";
  if (stoppBtn) stoppBtn.style.display = "";
  let geschrieben = 0, uebersprungen = 0, fehlerZahl = 0;

  try {
    bfLog("Scanne Storage-Ordner …");
    const dateien = [];
    for (const prefix of BACKFILL_PREFIXES) {
      if (_bfStop) break;
      const vorher = dateien.length;
      try { await bfListeRekursiv(storage.ref(prefix), dateien); }
      catch (e) { fehlerZahl++; bfLog("Auflisten fehlgeschlagen: " + prefix + " — " + (e && e.message), "fehler"); }
      bfLog(prefix + " → " + (dateien.length - vorher) + " Dateien");
    }
    const n = dateien.length;
    bfLog("Gefunden: " + n + " Dateien." + (probelauf ? " PROBELAUF — es wird nichts geschrieben." : ""));

    // Bekannte Pfade/Hashes aus dem Live-Zustand (driveDocs) für Idempotenz + Duplikat-Verdacht
    const bekanntePfade = new Set(), bekannteHashes = new Set();
    Object.keys(S.docs).forEach(function (id) {
      const d = S.docs[id] || {};
      if (d.storagePath) bekanntePfade.add(d.storagePath);
      if (d.hash) bekannteHashes.add(d.hash);
    });

    for (let i = 0; i < n; i++) {
      if (_bfStop) { bfLog("Gestoppt.", "warn"); break; }
      const item = dateien[i];
      const pfad = item.fullPath;
      bfFortschritt((i + 1) + " von " + n + " — " + pfad);
      try {
        if (bfBlockiert(pfad)) { uebersprungen++; continue; } // doppelter Schutz (Finanzdaten)

        // Idempotenz: deterministische docId aus dem Storage-Pfad + Pfad-Abgleich.
        // AUSNAHME: Einträge aus dem App-Bestands-Sync (nur Metadaten, ohne Hash)
        // werden NICHT übersprungen, sondern mit Volltext + Hash ANGEREICHERT.
        const docId = "bf_" + (await sha256HexText(pfad));
        const vorhandener = S.docs[docId] || null;
        const nurMetadaten = !!(vorhandener && !vorhandener.hash);
        if ((vorhandener && !nurMetadaten) || (!vorhandener && bekanntePfade.has(pfad))) { uebersprungen++; continue; }

        const meta = await item.getMetadata();
        const groesse = Number(meta.size || 0);
        if (groesse > BACKFILL_MAX_BYTES) { uebersprungen++; bfLog("Übersprungen (>50 MB): " + pfad, "warn"); continue; }

        if (probelauf) { geschrieben++; bfLog("Würde anlegen: " + pfad); continue; }

        const url = await item.getDownloadURL();
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Download HTTP " + resp.status);
        const ab = await resp.arrayBuffer();
        const hash = await sha256Hex(ab);
        const dup = bekannteHashes.has(hash);
        // Bestehende Extraktions-Logik aus dem Upload-Pfad wiederverwenden
        // (PDF via pdf.js, DOCX via mammoth, JSON/Textformate direkt; Bilder → kein Text)
        const text = await extrahiereText({ name: item.name, type: meta.contentType || "" }, ab);
        const mimeType = meta.contentType || "application/octet-stream";
        const jetzt = new Date().toISOString();

        // Beim Anreichern eines Metadaten-Eintrags bleiben manuelle Ablage-
        // Entscheidungen (Ordner, Titel, Status) erhalten.
        await db.ref(P_DOCS + "/" + docId).set({
          dateiname: item.name,
          titel_final: nurMetadaten ? (vorhandener.titel_final || "") : "",
          storagePath: pfad,
          downloadUrl: url,
          mimeType: mimeType,
          groesse: groesse,
          hash: hash,
          status: nurMetadaten && vorhandener.status ? vorhandener.status : "eingang",
          folderId: nurMetadaten ? (vorhandener.folderId || null) : null,
          vorschlag: nurMetadaten ? (vorhandener.vorschlag || null) : null,
          textauszug: text.slice(0, 12000),
          quelle: nurMetadaten ? (vorhandener.quelle || null) : null,
          erstellt: (nurMetadaten && vorhandener.erstellt) || meta.timeCreated || jetzt,
          aktualisiert: jetzt
        });
        // Queue-Eintrag exakt im Format, das "Pending filtern" (n8n) erwartet
        await db.ref(P_INBOX + "/" + docId).set({
          docId: docId,
          dateiname: item.name,
          mimeType: mimeType,
          hash: hash,
          text: text.slice(0, 6000),
          storagePath: pfad,
          duplikat_verdacht: dup,
          status: "pending",
          erstellt: jetzt
        });

        bekanntePfade.add(pfad);
        bekannteHashes.add(hash);
        geschrieben++;
        bfLog("Neu: " + pfad + (text ? " (" + text.length + " Zeichen Text)" : " (kein Text)"));
      } catch (e) {
        fehlerZahl++;
        bfLog("Fehler: " + pfad + " — " + (e && e.message), "fehler");
      }
    }

    const fazit = "Fertig. Geschrieben: " + geschrieben + " · Übersprungen: " + uebersprungen +
      " · Fehler: " + fehlerZahl + (probelauf ? " (Probelauf)" : "");
    bfLog(fazit);
    bfFortschritt("");
    toast(fazit);
  } finally {
    _bfLaeuft = false;
    if (startBtn) startBtn.style.display = "";
    if (stoppBtn) stoppBtn.style.display = "none";
  }
}

const STATUS_LABEL = {
  eingang: "Eingang",
  wird_klassifiziert: "Wird klassifiziert",
  klassifiziert: "Klassifiziert",
  review_noetig: "Review nötig",

function badge(status) {
  const s = STATUS_LABEL[status] ? status : "eingang";
  return '<span class="badge b-' + s + '"><span class="pkt"></span>' + STATUS_LABEL[s] + "</span>";
}

function docsGefiltert() {
  const a = S.ansicht;
  const suche = lc(S.suche);
  return Object.keys(S.docs).filter(function (id) {
    const d = S.docs[id]; if (!d) return false;
    if (a.art === "papierkorb") { if (d.status !== "papierkorb") return false; }
    else if (d.status === "papierkorb") return false;
    if (a.art === "eingang" && d.folderId) return false;
    if (a.art === "ordner") {
      // Ordner-Ansicht zeigt Dokumente des Ordners UND aller Unterordner
      let cur = d.folderId, treffer = false, schutz = 0;
      while (cur && schutz++ < 20) { if (cur === a.folderId) { treffer = true; break; } cur = S.ordner[cur] ? S.ordner[cur].parentId : null; }
      if (!treffer) return false;
    }
    if (suche) {
      const v = d.vorschlag || {};
      const heuhaufen = [
        d.dateiname, d.titel_final, d.textauszug,
        v.bereich, v.unterordner, v.thema, v.titel_vorschlag,
        (v.tags || []).join(" "),
        ordnerPfad(d.folderId).join(" ")
      ].map(lc).join(" ");
      if (heuhaufen.indexOf(suche) < 0) return false;
    }
    return true;
  }).sort(function (x, y) { return String(S.docs[y].erstellt || "").localeCompare(String(S.docs[x].erstellt || "")); });
}

      const d = S.docs[id];
      const v = d.vorschlag || {};
      const wurzel = d.folderId ? ordnerWurzel(d.folderId) : null;
      const bereich = wurzel ? wurzel.name : (v.bereich || "–");
      const titel = d.titel_final || d.dateiname;
      const tags = (v.tags || []).slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      const dup = istDuplikat(id, d) ? '<span class="dup-hinweis" title="Möglicherweise bereits vorhanden (Hash/KI)">⚠︎ Duplikat?</span>' : "";
      html += '<div class="karte doc-zeile" data-action="doc-oeffnen" data-id="' + esc(id) + '">' +
        '<div class="karte-kopf"><span class="karte-icon">' + dateiIcon(d.mimeType, d.dateiname) + '</span>' +
        '<button class="doc-info" title="Details & Ablage" data-action="doc-details" data-id="' + esc(id) + '">ℹ️</button></div>' +
        '<div class="karte-titel">' + esc(titel) + '</div>' +
        (d.titel_final && d.titel_final !== d.dateiname ? '<div class="karte-orig">' + esc(d.dateiname) + '</div>' : "") +
        '<div style="margin-top:2px">' + badge(d.status) + " " + dup + '</div>' +
        (tags ? '<div class="karte-tags">' + tags + "</div>" : '<div class="karte-tags"></div>') +
        '<div class="karte-fuss"><span class="karte-bereich" title="' + esc(bereich) + '">🗂️ ' + esc(bereich) + '</span>' +
        '<span class="karte-meta">' + fmtDatum(d.erstellt) + " · " + fmtGroesse(d.groesse) + "</span></div>" +
        "</div>";
    });
    html += "</div>";
  } else if (ids.length) {
    html += '<table class="docs"><thead><tr><th>Name</th><th>Bereich</th><th>Themen-Tags</th><th>Status</th><th>Datum</th><th>Grösse</th></tr></thead><tbody>';
    ids.forEach(function (id) {
      const d = S.docs[id];
      const v = d.vorschlag || {};
      const wurzel = d.folderId ? ordnerWurzel(d.folderId) : null;
      const bereich = wurzel ? wurzel.name : (v.bereich || "–");
      const tags = (v.tags || []).slice(0, 4).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      const dup = istDuplikat(id, d) ? ' <span class="dup-hinweis" title="Möglicherweise bereits vorhanden (Hash/KI)">⚠︎ Duplikat?</span>' : "";
      html += '<tr class="doc-zeile" data-action="doc-oeffnen" data-id="' + esc(id) + '">' +
        '<td><div class="doc-name"><span class="icon">' + dateiIcon(d.mimeType, d.dateiname) + '</span><span class="txt">' + esc(d.titel_final || d.dateiname) +
        (d.titel_final && d.titel_final !== d.dateiname ? '<span class="orig">' + esc(d.dateiname) + "</span>" : "") + "</span>" + dup +
        '<button class="doc-info" title="Details & Ablage" data-action="doc-details" data-id="' + esc(id) + '">ℹ️</button>' + "</div></td>" +
        '<td class="zelle-muted">' + esc(bereich) + "</td>" +
        "<td>" + (tags || '<span class="zelle-muted">–</span>') + "</td>" +
        "<td>" + badge(d.status) + "</td>" +
        '<td class="zelle-muted">' + fmtDatum(d.erstellt) + "</td>" +
        '<td class="zelle-muted">' + fmtGroesse(d.groesse) + "</td></tr>";
    });
    html += "</tbody></table>";
  }
  document.getElementById("liste").innerHTML = html;
}

function renderDrawer() {
  const drawer = document.getElementById("drawer");
  const docId = S.drawerDocId;
  const d = docId ? S.docs[docId] : null;
  if (!d) { drawer.classList.remove("offen"); return; }
  drawer.classList.add("offen");
  document.getElementById("drTitel").textContent = d.titel_final || d.dateiname;

  const v = d.vorschlag;
  const q = S.inbox[docId];
  let html = "";

  // Herkunft: In der Haupt-App hochgeladene Anhänge (attachments/{kind}/{id}/…)
  // werden automatisch hier registriert — die Quelle wird im Drawer ausgewiesen.
  let quelleText = "";
  if (d.quelle === "app-upload" || String(d.storagePath || "").indexOf("attachments/") === 0) {
    const teile = String(d.storagePath || "").split("/");
    const artLabel = { task: "Aufgabe", project: "Projekt", meeting: "Meeting", message: "Nachricht", invoice: "Rechnung", readingList: "Leseliste", organization: "Organisation", person: "Person", note: "Notiz", goal: "Ziel", idea: "Idee" }[teile[1]] || teile[1] || "";
    quelleText = "App-Anhang" + (artLabel ? " (" + artLabel + ")" : "");
  }

  // Metadaten
  html += '<dl class="dr-meta">' +
    "<dt>Status</dt><dd>" + badge(d.status) + "</dd>" +
    "<dt>Originalname</dt><dd>" + esc(d.dateiname) + "</dd>" +
    (quelleText ? "<dt>Quelle</dt><dd>" + esc(quelleText) + "</dd>" : "") +
    "<dt>Abgelegt in</dt><dd>" + (d.folderId ? esc(ordnerPfad(d.folderId).join(" › ")) : '<span class="zelle-muted">— noch nicht abgelegt —</span>') + "</dd>" +
    "<dt>Grösse</dt><dd>" + fmtGroesse(d.groesse) + " · " + esc(d.mimeType || "?") + "</dd>" +
    "<dt>Hochgeladen</dt><dd>" + fmtDatum(d.erstellt) + "</dd>" +
    "<dt>SHA-256</dt><dd style=\"font-family:monospace;font-size:11px\">" + esc(String(d.hash || "").slice(0, 24)) + "…</dd>" +
    "</dl>";

  if (istDuplikat(docId, d)) {
    html += '<div class="fehler-box">⚠︎ <b>Duplikat-Verdacht:</b> Eine Datei mit identischem Inhalt (Hash) existiert bereits oder die KI vermutet eine Kopie.</div>';
  }
  if (d.fehler) {
    html += '<div class="fehler-box"><b>Fehler bei der Klassifizierung:</b> ' + esc(d.fehler) + "</div>";
  } else if (q && q.status === "error") {
    html += '<div class="fehler-box"><b>Klassifizierung fehlgeschlagen</b>' + (q.fehler ? ": " + esc(q.fehler) : "") + "</div>";
  }

  // KI-Vorschlag (klassifiziert / review_noetig)
  if (v && (d.status === "klassifiziert" || d.status === "review_noetig" || d.status === "abgelegt")) {
    const conf = Math.max(0, Math.min(1, Number(v.confidence) || 0));
    const confFarbe = conf >= 0.6 ? "var(--gruen)" : "var(--coral)";
    html += '<div class="vorschlag-karte' + (d.status === "review_noetig" ? " review" : "") + '">' +
      '<div class="vk-titel">🤖 KI-Ablagevorschlag</div>' +
      '<div class="vk-ziel">' + esc(v.bereich || "?") +
      (v.unterordner ? '<span class="trenner">›</span>' + esc(v.unterordner) : "") +
      (v.thema ? '<span class="trenner">›</span>' + esc(v.thema) : "") + "</div>" +
      (v.titel_vorschlag ? '<div class="vk-zeile"><b>Titel:</b> ' + esc(v.titel_vorschlag) + "</div>" : "") +
      ((v.tags || []).length ? '<div class="vk-zeile">' + v.tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" : "") +
      '<div class="vk-zeile"><b>Confidence:</b> ' + Math.round(conf * 100) + "%" +
      '<div class="konfidenz-balken"><div style="width:' + Math.round(conf * 100) + "%;background:" + confFarbe + '"></div></div></div>' +
      (v.begruendung ? '<div class="vk-zeile" style="color:var(--muted)">' + esc(v.begruendung) + "</div>" : "") +
      "</div>";
  }

  // Aktionen
  html += '<div class="dr-aktionen">';
  if (d.status === "papierkorb") {
    html += '<button class="btn primaer" data-action="wiederherstellen" data-id="' + esc(docId) + '">↩︎ Wiederherstellen</button>';
    html += '<button class="btn gefahr" data-action="endgueltig-loeschen" data-id="' + esc(docId) + '">Endgültig löschen …</button>';
  } else {
    if (v && d.status !== "abgelegt") {
      html += '<button class="btn primaer" data-action="uebernehmen" data-id="' + esc(docId) + '">✓ Übernehmen</button>';
    }
    const kat = dateiKategorie(d);
    if (kat === "pdf" && d.downloadUrl) {
      html += '<button class="btn primaer" data-action="pdf-editor" data-id="' + esc(docId) + '">📝 Im PDF-Editor öffnen</button>';
    } else if ((kat === "bild" || kat === "docx" || kat === "text") && d.downloadUrl) {
      html += '<button class="btn" data-action="datei-oeffnen" data-id="' + esc(docId) + '">📖 Öffnen</button>';
    }
    html += '<button class="btn" data-action="aendern" data-id="' + esc(docId) + '">' + (d.status === "abgelegt" ? "Verschieben / Umbenennen …" : "Ändern …") + "</button>";
    html += '<button class="btn" data-action="vorschau" data-id="' + esc(docId) + '">' + (S.vorschauOffen ? "Vorschau schliessen" : "👁 Vorschau") + "</button>";
    html += '<a class="btn" href="' + esc(d.downloadUrl || "#") + '" target="_blank" rel="noopener" style="text-decoration:none">⬇ Herunterladen</a>';
    html += '<button class="btn gefahr" data-action="papierkorb" data-id="' + esc(docId) + '">🗑 Papierkorb</button>';
  }
  html += "</div>";

  // Vorschau (PDF/Bild inline, sonst nur Download-Link oben)
  if (S.vorschauOffen && d.status !== "papierkorb") {
    const istPdf = (d.mimeType === "application/pdf") || endung(d.dateiname) === "pdf";
    const istBild = String(d.mimeType || "").startsWith("image/");
    if (istPdf)      html += '<div id="vorschau"><iframe src="' + esc(d.downloadUrl) + '" title="PDF-Vorschau"></iframe></div>';
    else if (istBild) html += '<div id="vorschau"><img src="' + esc(d.downloadUrl) + '" alt="Bild-Vorschau"></div>';
    else html += '<div id="vorschau"><div class="zelle-muted">Für diesen Dateityp gibt es keine Inline-Vorschau — bitte „Herunterladen" nutzen.</div></div>';
  }

  if (d.textauszug) {
    html += '<div class="vk-titel" style="margin-top:18px">Textauszug</div><div class="textauszug">' + esc(d.textauszug) + "</div>";
  }

  document.getElementById("drInhalt").innerHTML = html;
}

function drawerSchliessen() { S.drawerDocId = null; S.vorschauOffen = false; renderDrawer(); }

// ── Modal-Helfer ──
let _modalOk = null;
function modalOeffnen(html, okCallback) {
  _modalOk = okCallback || null;
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalHintergrund").classList.add("offen");
}
function modalSchliessen() {
  _modalOk = null;
  document.getElementById("modalHintergrund").classList.remove("offen");
}

// ═══════════════════════════════════════════════════════════════════════════
// EVENT-DELEGATION (data-action)
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const aktion = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  switch (aktion) {
    case "upload-klick":      document.getElementById("dateiInput").click(); break;
    case "ansicht":           S.ansicht = { art: el.getAttribute("data-art"), folderId: null }; render(); break;
    case "ansicht-modus":     S.viewMode = el.getAttribute("data-modus") === "grid" ? "grid" : "list"; try { localStorage.setItem("drive-view", S.viewMode); } catch(e){} renderListe(); break;
    case "ordner-klappen":    e.stopPropagation(); S.offen[id] = !S.offen[id]; renderNav(); break;
    case "ordner-waehlen":
      if (e.target.closest('[data-action="ordner-klappen"]')) break;
      S.ansicht = { art: "ordner", folderId: id }; S.offen[id] = true; render(); break;
    case "doc-oeffnen":       docOeffnen(id); break;
    case "doc-details":       S.drawerDocId = id; S.vorschauOffen = false; renderDrawer(); break;
    case "pdf-editor":        { const d = S.docs[id]; if (d) pdfOeffnen(d); break; }
    case "datei-oeffnen":     docOeffnen(id); break;
    case "viewer-schliessen": viewerSchliessen(); break;
    case "viewer-hintergrund":
      // Klick auf den dunklen Hintergrund schliesst — der Inhaltsbereich
      // (.vw-inhalt) füllt das Overlay, daher zählt auch er als Hintergrund.
      if (e.target === el || e.target.classList.contains("vw-inhalt")) viewerSchliessen();
      break;
    case "drawer-schliessen": drawerSchliessen(); break;
    case "neuer-ordner":      neuerOrdnerDialog(); break;
    case "login":             googleAnmelden(); break;
    case "backfill":          backfillDialog(); break;
    case "backfill-start":    backfillStarten(); break;
    case "backfill-stopp":    _bfStop = true; break;
    case "drive-rescan":       rescanDialog(); break;
    case "drive-rescan-start": rescanStarten(); break;
    case "drive-rescan-stopp": _rescanStop = true; break;
    case "uebernehmen":       vorschlagUebernehmen(id); break;
    case "aendern":           zielAendernDialog(id); break;
    case "vorschau":          S.vorschauOffen = !S.vorschauOffen; renderDrawer(); break;
    case "papierkorb":        inPapierkorb(id); break;
    case "wiederherstellen":  wiederherstellen(id); break;
    case "endgueltig-loeschen": endgueltigLoeschenDialog(id); break;
    case "modal-schliessen":  if (_bfLaeuft) _bfStop = true; if (_rescanLaeuft) _rescanStop = true; modalSchliessen(); break;
    case "modal-hintergrund": if (e.target === el) { if (_bfLaeuft) _bfStop = true; if (_rescanLaeuft) _rescanStop = true; modalSchliessen(); } break;
    case "modal-ok":
      (function () {
        const cb = _modalOk; modalSchliessen();
        if (cb) Promise.resolve(cb()).catch(function (err) { toast("Fehler: " + (err && err.message)); });
      })();
      break;
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") viewerSchliessen();
});

document.getElementById("dateiInput").addEventListener("change", function (e) {
  dateienHochladen(e.target.files);
  e.target.value = "";
});
document.getElementById("sucheInput").addEventListener("input", function (e) {
  S.suche = e.target.value; renderListe();
});

// Drag & Drop auf den Hauptbereich
(function () {
  const haupt = document.getElementById("haupt");
  let zaehler = 0;
  haupt.addEventListener("dragenter", function (e) { e.preventDefault(); zaehler++; haupt.classList.add("drop-aktiv"); });
  haupt.addEventListener("dragover",  function (e) { e.preventDefault(); });
  haupt.addEventListener("dragleave", function ()  { if (--zaehler <= 0) { zaehler = 0; haupt.classList.remove("drop-aktiv"); } });
  haupt.addEventListener("drop", function (e) {
    e.preventDefault(); zaehler = 0; haupt.classList.remove("drop-aktiv");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) dateienHochladen(e.dataTransfer.files);
  });
})();

render();
boot();
})();
</script>
</body>
</html>
