<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quantus</title>
  <meta name="quantus-build" content="gmail-block-filters+entity-inbox · 2026-07-07" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#86a895" />
  <meta name="theme-color" content="#262a2e" />
  <meta name="apple-mobile-web-app-title" content="Quantus" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Preconnects: DNS/TLS zu Font- und Firebase-CDNs früh aufbauen (weniger Blockierzeit beim ersten Laden) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="quantus-orb.js" defer></script>
  <script>
  /* Theme früh anwenden (kein FOUC) — „Schiefer" (dark, Default) / „Leinen" (light), an themeMode. */
  (function(){ try {
    var m = localStorage.getItem("quantus_themeMode") || "dark";
    var light = m==="light" || (m==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
    var de = document.documentElement; de.classList.toggle("theme-light", light); de.classList.toggle("theme-dark", !light);
  } catch(e){} })();
  window.applyThemeMode = function(mode){
    try {
      mode = mode || (window.APP && APP.state && APP.state.settings && APP.state.settings.ui && APP.state.settings.ui.themeMode) || "dark";
      try { localStorage.setItem("quantus_themeMode", mode); } catch(e){}
      var light = mode==="light" || (mode==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
      var de = document.documentElement; de.classList.toggle("theme-light", light); de.classList.toggle("theme-dark", !light);
    } catch(e){}
  };
  window.setThemePref = function(mode){
    try { if(window.APP && APP.state && APP.state.settings){ APP.state.settings.ui = APP.state.settings.ui || {}; APP.state.settings.ui.themeMode = mode; if(typeof window.scheduleSave==="function") window.scheduleSave(); } } catch(e){}
    window.applyThemeMode(mode);
  };
  /* Canvas-/JS-Farben theme-aware aus den CSS-Tokens lesen (für den Canvas-Refactor). */
  window.themeColor = function(token, fallback){ try { var v=getComputedStyle(document.documentElement).getPropertyValue(token); return (v&&v.trim())||fallback||"#86a895"; } catch(e){ return fallback||"#86a895"; } };
  try { if(window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener("change", function(){ try { if(window.APP && APP.state && APP.state.settings && APP.state.settings.ui && APP.state.settings.ui.themeMode==="auto") window.applyThemeMode("auto"); } catch(e){} }); } catch(e){}
  </script>
  <style>
    :root{
      /* ═══ Design-System „Schiefer" v2 (Dark, Default) — matt & erdig, aber mit Tiefe/Kontrast ═══ */
      --surface-base:#171c20;        /* Seite — tief & leicht kühl, lässt Akzente leuchten */
      --surface-raised:#212830;      /* Karten/Sidebar/Panels */
      --surface-overlay:#2d3640;     /* Modal/Dropdown/Toast */
      --border:#3b4550;
      --border2:#4f5a66;
      --hover:rgba(224,226,232,.08);   /* subtiles Hover-/Zebra-Overlay (theme-aware) */
      --text-primary:#eef0f2;
      --text-muted:#929aa4;
      --accent:#a78bfa;              /* Violett statt Grün (Marken-Akzent) */
      --accent-deep:#8b5cf6;         /* dunklere Akzentstufe für Gradient/Hover/Glow */
      --accent-soft:color-mix(in oklab, var(--accent) 24%, transparent); /* transluzent: dient zugleich als sanfte Tönung UND als sichtbarer Glow/Fokus-Ring */
      --on-accent:#160d29;
      --danger:#e5765a;
      --warning:#e3b048;
      --success:#45c198;
      --info:#6aa3de;
      /* ── Legacy-Aliase: bestehende var()-Nutzungen (3374×) auf die matte Palette mappen ── */
      --bg:var(--surface-base);
      --panel:var(--surface-raised);
      --panel2:var(--surface-overlay);
      --panel3:var(--border2);
      --muted:var(--text-muted);
      --text:var(--text-primary);
      --text2:#cccfd5;
      --accent2:var(--success);
      --accent3:var(--info);
      --warn:var(--warning);
      --danger:#e5765a;
      --ok:var(--success);
      --pink:#d885a6;
      --orange:var(--warning);
      --teal:var(--info);
      --neon:var(--accent);
      --neon-glow:var(--accent-soft);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.26);
      --shadow-lg: 0 8px 22px rgba(0,0,0,.36), 0 22px 56px rgba(0,0,0,.32);
      --radius: 14px;
      --radius-sm: 10px;
      --radius-lg: 20px;
      --mono: ui-monospace, SF Mono, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, Arial, sans-serif;
      /* einheitliche Schrift-Aliase für verstreute var(--head/--font/--hand)-Nutzungen */
      --head: var(--sans);
      --font: var(--sans);
      --hand: var(--sans);
      --transition: all 0.16s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    /* ═══ „Leinen" (Light) — umschaltbar über themeMode; Aliase erben automatisch ═══ */
    html.theme-light{
      --surface-base:#cdc6b6;
      --surface-raised:#e9e3d5;
      --surface-overlay:#f2ede1;
      --border:#bcb4a0;
      --border2:#a89d82;
      --hover:rgba(48,42,34,.08);
      --text-primary:#2a2620;
      --text-muted:#7a7463;
      --accent:#6b46c1;              /* Violett statt Grün (Marken-Akzent, Light) */
      --accent-deep:#553c9a;
      --accent-soft:color-mix(in oklab, var(--accent) 22%, transparent);
      --on-accent:#f7f4fc;
      --danger:#b34d2c;
      --warning:#977211;
      --success:#1f8a66;
      --info:#2c6499;
      --text2:#4d493f;
      --pink:#974e69;
      --shadow: 0 1px 2px rgba(52,46,38,.14), 0 6px 18px rgba(52,46,38,.10);
      --shadow-lg: 0 8px 22px rgba(52,46,38,.16), 0 22px 56px rgba(52,46,38,.13);
    }

    /* ═══════ Schiefer/Leinen — Chrome-Politur (durchgängig, additiv; kein Layout-Reflow) ═══════ */
    body{font-kerning:normal}
    h1,h2,h3{letter-spacing:-0.012em}
    ::selection{background:var(--accent-soft);color:var(--text)}
    html{scrollbar-color:var(--border2) transparent;scrollbar-width:thin}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

    /* ═══════ GLOBAL MODERNIZATION ═══════ */
    
    /* Stat cards — colored values, no glow */
    .stat-card.ok .value{color:var(--ok)}
    .stat-card.danger .value{color:var(--danger)}
    .stat-card.accent .value{color:var(--accent)}
    .stat-card.warn .value{color:var(--warn)}
    
    /* Badges → pill style */
    .badge{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:0.01em}
    .badge.ok{background:rgba(48,209,88,0.12);color:var(--ok)}
    .badge.danger{background:rgba(255,69,58,0.12);color:var(--danger)}
    .badge.accent{background:var(--accent-soft);color:var(--accent)}
    
    /* Pills → colorful */
    .pill{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
    .pill.danger{background:rgba(255,69,58,0.12);color:var(--danger);border-color:rgba(255,69,58,0.2)}
    .pill.warn{background:rgba(255,159,10,0.12);color:var(--warn);border-color:rgba(255,159,10,0.2)}
    .pill.ok{background:rgba(48,209,88,0.12);color:var(--ok);border-color:rgba(48,209,88,0.2)}
    .pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
    
    /* Progress bars — solid colors */
    .progress .bar.accent{background:var(--accent)}
    .progress .bar.ok{background:var(--ok)}
    .progress .bar.danger{background:var(--danger)}
    
    .task-card.overdue{border-left:3px solid var(--danger)}
    .task-card .task-priority.p1{background:var(--danger);color:var(--text)}
    .task-card .task-priority.p2{background:var(--warn);color:var(--bg)}
    .task-card .task-priority.p3{background:var(--accent);color:var(--text)}
    .task-card .task-priority.p4{background:var(--ok);color:var(--text)}
    .task-card .task-priority.p5{background:var(--border);color:var(--muted)}
    
    /* Chart bars — solid */
    .chart-bar{background:var(--accent)!important}
    
    /* Eisenhower matrix → colored quadrants */
    .matrix-quadrant.do{background:rgba(255,69,58,0.06);border-color:rgba(255,69,58,0.15)}
    .matrix-quadrant.schedule{background:var(--accent-soft);border-color:var(--accent-soft)}
    .matrix-quadrant.delegate{background:rgba(255,159,10,0.06);border-color:rgba(255,159,10,0.15)}
    .matrix-quadrant.eliminate{background:rgba(142,142,147,0.06);border-color:rgba(142,142,147,0.15)}
    
    /* Focus ring on inputs */
    .input:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
    
    /* Good button — green */
    .btn.good,.btn.sm.good{background:var(--ok)!important;color:var(--text)!important;border:none}
    
    /* File thumbnails */
    .file-thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border)}
    .file-thumb img{width:100%;height:100%;object-fit:cover}
    .file-thumb.word{background:var(--accent-soft);font-size:24px;border-color:var(--accent-soft)}
    .file-thumb.pdf{background:rgba(255,69,58,0.1);font-size:24px;border-color:rgba(255,69,58,0.2)}
    .file-item.has-thumb .file-thumb{width:56px;height:56px;border-radius:8px}
    .file-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
    .file-item:hover{background:var(--hover);border-radius:8px;margin:0 -8px;padding:10px 8px}
    .file-item:last-child{border-bottom:none}
    .file-name{font-size:14px;font-weight:500;cursor:pointer;color:var(--accent)}
    .file-name:hover{text-decoration:underline}
    .file-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .file-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
    .file-actions button{background:none;border:none;cursor:pointer;padding:4px;font-size:14px;border-radius:6px;transition:background 0.15s}
    .file-actions button:hover{background:var(--hover)}
    



    /* ═══════ COLORFUL TASKS ═══════ */
    
    /* Task cards — colored left border by category */
    .task-card{border-left:4px solid var(--border)}
    
    /* Tasks grid */
    .tasks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    
    /* Task mini cards in matrix → colorful */
    .task-mini-card{border-radius:10px;padding:8px 10px;background:var(--hover);border:1px solid var(--hover);transition:all 0.2s;cursor:pointer}
    .task-mini-card:hover{background:var(--hover);border-color:var(--border);transform:translateX(2px)}
    .task-mini-card.overdue{border-left:3px solid var(--danger)}
    .task-mini-title{font-size:13px;font-weight:500}
    .task-mini-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
    
    /* Kanban status columns */
    .kanban-col[data-status="doing"]{border-top:3px solid var(--accent)}
    .kanban-col[data-status="todo"]{border-top:3px solid var(--muted)}
    .kanban-col[data-status="waiting"]{border-top:3px solid var(--warn)}
    .kanban-col[data-status="review"]{border
