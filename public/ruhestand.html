<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060a">
<title>Quantus — Ruhestand</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Nicht-blockierend laden: media="print" hält den Parser nicht auf — Uhr &
     Animationen starten sofort, Inter wird nachgeladen und getauscht (swap).
     Sonst würde ein hängender Font-Request die ganze Standby-Seite einfrieren. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script src="quantus-orb.js" defer></script>
<style>
  /* ══════════════════════════════════════════════════════════════════════
     QUANTUS RUHESTAND — Neural-Standby (Ambient-Modus)
     Optik eines fortschrittlichen KI-Systems im Quantus-„Schiefer"-Look:
     matte Karten, Hairline-Borders, Inter, violetter Marken-Akzent.
     Zentrum: Sci-Fi-HUD mit atmendem Kern, Ringen, Radial-Spektrum.
     Rundherum: System-Log-Stream, Kernmetriken, Waveform, Status-Chips.
     Dauerbewegung: Warp-Sternenfeld, Sternschnuppen, Ring-Rotation.
     OLED-Schutz: alles Fixe driftet langsam (oledDrift/oledDriftT) —
     nichts steht dauerhaft auf denselben Pixeln.
     ══════════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#05060a;
    --surface:#212830;             /* Quantus surface-raised */
    --surface2:#2d3640;            /* Quantus surface-overlay */
    --border:#3b4550;
    --border2:#4f5a66;
    --accent:#a78bfa;              /* Quantus Marken-Violett */
    --accent-deep:#8b5cf6;
    --accent-dim:rgba(167,139,250,.32);
    --accent-soft:rgba(167,139,250,.22);
    --info:#6aa3de;
    --success:#45c198;
    --text:#eef0f2;
    --text2:#cccfd5;
    --muted:#929aa4;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.26);
    --sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    cursor:none;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  body.ui-visible{cursor:default}

  /* ── Sternenfeld (Canvas, ganzflächig) ── */
  #stars{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ── Feines Punktraster — technische Grundstimmung (driftet, OLED) ── */
  #grid{
    position:fixed;inset:-80px;pointer-events:none;opacity:.55;
    background-image:radial-gradient(rgba(146,154,164,.055) 1px,transparent 1px);
    background-size:46px 46px;
    animation:oledDriftT 240s ease-in-out infinite;
  }

  /* ── Nebel: weiche, driftende Farbflächen ── */
  .nebula{position:fixed;border-radius:50%;filter:blur(90px);opacity:.15;pointer-events:none}
  .nebula.a{width:58vmin;height:58vmin;left:11%;top:14%;background:radial-gradient(circle,#8b5cf6,transparent 70%);animation:nebDriftA 46s ease-in-out infinite alternate}
  .nebula.b{width:50vmin;height:50vmin;right:9%;bottom:10%;background:radial-gradient(circle,#3b5f8f,transparent 70%);animation:nebDriftB 58s ease-in-out infinite alternate}
  .nebula.c{width:36vmin;height:36vmin;right:24%;top:6%;background:radial-gradient(circle,#6d28d9,transparent 70%);animation:nebDriftC 38s ease-in-out infinite alternate}
  /* Zentrierter Ambient-Glow hinter dem HUD: gleicht aus, dass die Rand-Nebel
     nur die Peripherie aufhellen — sonst wirkt die Kreiszone dunkler als der
     Rest. Kein blur nötig (Gradient ist schon weich). */
  .nebula.d{
    width:92vmin;height:92vmin;left:50%;top:50%;margin:-46vmin 0 0 -46vmin;
    background:radial-gradient(circle,#8b5cf6,transparent 64%);
    filter:none;opacity:.1;
    animation:nebBreath 16s ease-in-out infinite alternate;
  }
  @keyframes nebBreath{from{transform:scale(.94)}to{transform:scale(1.1)}}
  @keyframes nebDriftA{from{transform:translate(0,0) scale(1)}to{transform:translate(9vw,6vh) scale(1.18)}}
  @keyframes nebDriftB{from{transform:translate(0,0) scale(1.12)}to{transform:translate(-7vw,-5vh) scale(.94)}}
  @keyframes nebDriftC{from{transform:translate(0,0)}to{transform:translate(-5vw,7vh) scale(1.22)}}

  /* ── OLED-Drift ── */
  @keyframes oledDrift{
    0%{transform:translate(0,0)}
    25%{transform:translate(1.2vw,-1.6vh)}
    50%{transform:translate(-1.4vw,-.6vh)}
    75%{transform:translate(.8vw,1.6vh)}
    100%{transform:translate(0,0)}
  }
  /* Für fixe Elemente außerhalb von #stage: animiert die separate
     translate-Property, damit transform (z.B. translateY(-50%)) heil bleibt. */
  @keyframes oledDriftT{
    0%{translate:0 0}
    25%{translate:1.2vw -1.6vh}
    50%{translate:-1.4vw -.6vh}
    75%{translate:.8vw 1.6vh}
    100%{translate:0 0}
  }

  /* ── HUD-Bühne ── */
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    animation:oledDrift 240s ease-in-out infinite;
  }
  #hudWrap{position:relative;width:min(76vmin,840px);height:min(76vmin,840px)}
  #hud{position:absolute;inset:0;width:100%;height:100%}

  /* ── Zentrum: Uhr & Status ── */
  #center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;
    padding:0 17%;  /* Texte bleiben in der freien Innenzone der Ringe */
  }
  #coreLabel{
    font-family:var(--mono);font-size:clamp(8px,1.15vmin,11px);
    letter-spacing:.42em;text-transform:uppercase;color:var(--muted);
    margin-bottom:2.2vmin;opacity:.85;
  }
  #coreLabel b{color:var(--accent);font-weight:600}
  /* ── Uhr oben (aus der Bildmitte gerückt) ── */
  #topClock{
    position:fixed;top:clamp(58px,9vh,124px);left:50%;
    transform:translateX(-50%);
    text-align:center;pointer-events:none;z-index:3;
    translate:0 0;animation:oledDriftT 240s ease-in-out infinite;
  }
  #clock{
    font-size:clamp(38px,8.6vmin,100px);
    font-weight:200;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color:var(--text);
    text-shadow:0 0 26px rgba(167,139,250,.32),0 0 90px rgba(139,92,246,.16);
  }
  #clock .sec{font-size:.42em;font-weight:300;color:var(--accent);opacity:.85}
  #dateLine{
    margin-top:1.2vmin;font-size:clamp(11px,1.8vmin,18px);
    font-weight:500;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;
  }
  #modeLine{
    margin-top:2.4vmin;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1vmin;
    font-family:var(--mono);font-size:clamp(9px,1.3vmin,12.5px);
    letter-spacing:.3em;text-transform:uppercase;color:var(--accent);
  }
  #modeLine .dot{
    width:.9vmin;height:.9vmin;min-width:5px;min-height:5px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 10px var(--accent);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
  #wave{width:44%;height:4.6vmin;max-height:44px;margin-top:2.6vmin;opacity:.9}

  /* ── Ecken-Klammern ── */
  .corner{position:fixed;width:52px;height:52px;border:1px solid var(--accent-dim);opacity:.6;animation:cornerGlow 5s ease-in-out infinite,oledDriftT 240s ease-in-out infinite}
  .corner.tl{top:24px;left:24px;border-right:none;border-bottom:none}
  .corner.tr{top:24px;right:24px;border-left:none;border-bottom:none}
  .corner.bl{bottom:24px;left:24px;border-right:none;border-top:none}
  .corner.br{bottom:24px;right:24px;border-left:none;border-top:none}
  @keyframes cornerGlow{0%,100%{opacity:.3}50%{opacity:.75}}

  /* ══ Quantus-Chrome: Karten, Chips, Panels (Designsystem der App) ══ */
  .qcard{
    background:color-mix(in oklab,var(--surface) 84%,transparent);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }

  /* ── Status-Chips oben (Marke links, Systemstatus rechts) ── */
  .chip{
    position:fixed;top:26px;display:flex;align-items:center;gap:10px;
    padding:9px 16px;font-size:12px;
    animation:oledDriftT 240s ease-in-out infinite;
  }
  #brandChip{left:3vw}
  #brandChip .logo{
    width:22px;height:22px;flex:none;
    background:url('emblem.svg') center/contain no-repeat;
    /* kein Glow: bei 22px würde er zu einer dunklen Scheibe verschmieren */
  }
  #brandChip .bc-name{font-weight:700;letter-spacing:-.01em}
  #brandChip .bc-sub{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
  #sysChip{right:3vw;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);gap:14px}
  #sysChip .on{display:flex;align-items:center;gap:7px;color:var(--success)}
  #sysChip .on i{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2.4s ease-in-out infinite}
  #sysChip .sep{width:1px;height:14px;background:var(--border)}
  #fsBtn{
    background:none;border:none;color:var(--muted);font-size:15px;line-height:1;
    cursor:pointer;padding:2px 2px;border-radius:6px;
    transition:color .15s ease,transform .15s ease;
  }
  #fsBtn:hover{color:var(--text);transform:scale(1.1)}
  #fsBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── Seiten-Panels: System-Log (links) & Kernmetriken (rechts) ── */
  .panel{
    position:fixed;top:50%;transform:translateY(-50%);
    width:262px;padding:16px 18px 18px;
    display:none;flex-direction:column;gap:12px;
    animation:oledDriftT 240s ease-in-out infinite;
  }
  #logPanel{left:3vw}
  #metricsPanel{right:3vw}
  .panel-head{
    display:flex;align-items:center;gap:8px;
    font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border);
  }
  .panel-head i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

  /* Log-Zeilen: neueste unten, ältere blenden aus */
  #logLines{display:flex;flex-direction:column;gap:7px;min-height:172px;justify-content:flex-end;overflow:hidden}
  .log-line{display:flex;gap:9px;font-family:var(--mono);font-size:10.5px;line-height:1.5;animation:logIn .4s ease both}
  .log-line .lt{color:var(--muted);opacity:.7;flex:none}
  .log-line .lm{color:var(--text2)}
  .log-line.hl .lm{color:var(--accent)}
  .log-line:nth-last-child(5){opacity:.62}
  .log-line:nth-last-child(6){opacity:.38}
  .log-line:nth-last-child(n+7){opacity:.18}
  @keyframes logIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* Metriken */
  .metric{display:flex;flex-direction:column;gap:6px}
  .m-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .m-top b{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .m-bar{height:3px;background:rgba(146,154,164,.15);border-radius:3px;overflow:hidden}
  .m-bar i{display:block;height:100%;width:8%;border-radius:3px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));transition:width 1.1s cubic-bezier(.25,.1,.25,1)}
  .metric.blue .m-bar i{background:linear-gradient(90deg,#3b5f8f,var(--info))}
  #spark{width:100%;height:44px;margin-top:2px}
  .m-meta{
    display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:2px;
    padding-top:12px;border-top:1px solid var(--border);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  }
  .m-meta span{color:var(--muted);opacity:.75}
  .m-meta b{display:block;color:var(--text2);font-weight:600;font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  @media (min-width:1180px){.panel{display:flex}}
  @media (max-width:640px){.chip{display:none}}

  /* ── Launch-Button: dezent, unten mittig — startet Quantus ── */
  #launchBtn{
    position:fixed;bottom:4.6vh;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    padding:10px 26px;border-radius:999px;
    background:color-mix(in oklab,var(--surface) 55%,transparent);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.3em;text-transform:uppercase;
    cursor:pointer;opacity:.5;
    translate:0 0;animation:oledDriftT 240s ease-in-out infinite;
    transition:opacity .25s ease,color .2s ease,border-color .2s ease,box-shadow .25s ease,background .2s ease;
  }
  #launchBtn .lb-tri{font-size:9px;color:var(--accent);opacity:.9}
  #launchBtn:hover,body.ui-visible #launchBtn{opacity:1}
  #launchBtn:hover{
    color:var(--text);border-color:var(--accent-dim);
    background:color-mix(in oklab,var(--surface) 80%,transparent);
    box-shadow:0 0 0 3px var(--accent-soft),0 8px 26px rgba(0,0,0,.45);
  }
  #launchBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;opacity:1}
  #launchBtn:active{transform:translateX(-50%) scale(.97)}

  /* ── Hint: erscheint nur bei Mausbewegung ── */
  #hint{
    position:fixed;bottom:1.6vh;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);opacity:0;transition:opacity .5s ease;pointer-events:none;
    white-space:nowrap;
  }
  body.ui-visible #hint{opacity:.7}
  #hint kbd{
    font-family:var(--mono);border:1px solid rgba(79,90,102,.55);border-radius:4px;
    padding:1px 6px;margin:0 3px;color:var(--text2);background:rgba(33,40,48,.55);
  }

  /* ── Boot-Overlay: Launch-Sequenz im Quantus-Modal-Look ── */
  #bootOverlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;
    background:rgba(5,6,10,.72);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #bootOverlay.open{display:flex}
  .boot-card{
    width:min(400px,86vw);padding:34px 36px;text-align:center;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.36),0 22px 56px rgba(0,0,0,.32);
    animation:bootPop .25s cubic-bezier(.2,.9,.3,1.15) both;
  }
  @keyframes bootPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .boot-card .logo{
    width:52px;height:52px;margin:0 auto 16px;
    background:url('emblem.svg') center/contain no-repeat;
    filter:drop-shadow(0 0 16px rgba(139,92,246,.55));
    animation:bootSpin 8s linear infinite;
  }
  @keyframes bootSpin{to{transform:rotate(360deg)}}
  .boot-card h2{font-size:19px;font-weight:700;letter-spacing:-.012em}
  .boot-card .boot-status{
    margin-top:6px;min-height:18px;font-size:12px;color:var(--muted);
    font-family:var(--mono);letter-spacing:.06em;
  }
  .boot-card .boot-bar{
    margin-top:18px;height:4px;border-radius:4px;overflow:hidden;
    background:rgba(146,154,164,.15);
  }
  .boot-card .boot-bar i{
    display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--accent-deep),var(--accent));
    box-shadow:0 0 12px rgba(167,139,250,.6);
    transition:width .3s ease;
  }

  /* ── Vignette (liegt im DOM VOR allen Randelementen) ── */
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(2,3,6,.55) 100%)}

  /* ── Sehr schmale Viewports ── */
  @media (max-width:520px){
    .corner{display:none}
    #hint{letter-spacing:.08em}
  }

  /* ── Reduzierte Bewegung: Deko beruhigen; der 240s-OLED-Drift bleibt
     bewusst aktiv (~1vw über Minuten, vestibulär unkritisch, schützt
     das Panel vor Burn-in). ── */
  @media (prefers-reduced-motion:reduce){
    .nebula,#modeLine .dot,#sysChip .on i{animation:none!important}
    .corner{animation:oledDriftT 240s ease-in-out infinite}
    .log-line{animation:none}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="nebula a"></div>
<div class="nebula b"></div>
<div class="nebula c"></div>
<div class="nebula d"></div>
<div id="grid"></div>

<div id="stage">
  <div id="hudWrap">
    <canvas id="hud"></canvas>
    <div id="center">
      <div id="coreLabel"><b>Quantus</b> · Neural Core</div>
      <div id="modeLine"><span class="dot"></span><span>Ruhestand · Standby aktiv</span></div>
      <canvas id="wave"></canvas>
    </div>
  </div>
</div>

<!-- Uhr & Datum: bewusst NICHT im Zentrum — sitzt oben, damit die Ringe
     (der „atmende" Neural-Core) die freie Bildmitte einnehmen und beim
     Sprechen von Polaris sichtbar reagieren können. -->
<div id="topClock">
  <div id="clock">--:--<span class="sec"></span></div>
  <div id="dateLine">—</div>
</div>

<div id="vignette"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="chip qcard" id="brandChip">
  <span class="logo"></span>
  <span><span class="bc-name">Quantus</span><br><span class="bc-sub">Neural Standby</span></span>
</div>
<div class="chip qcard" id="sysChip">
  <quantus-orb id="voiceOrb" title="Sprachsteuerung — in Vorbereitung" style="width:24px;height:24px;flex:none"></quantus-orb>
  <span class="sep"></span>
  <span class="on"><i></i>Online</span>
  <span class="sep"></span>
  <span>QNT-Core 05</span>
  <span class="sep"></span>
  <button id="fsBtn" title="Vollbild umschalten (F)">⛶</button>
</div>

<aside class="panel qcard" id="logPanel">
  <div class="panel-head"><i></i>System-Log</div>
  <div id="logLines"></div>
</aside>

<aside class="panel qcard" id="metricsPanel">
  <div class="panel-head"><i></i>Kernmetriken</div>
  <div class="metric">
    <div class="m-top"><span>Kernlast</span><b id="mLoad">—</b></div>
    <div class="m-bar"><i id="mLoadBar"></i></div>
  </div>
  <div class="metric blue">
    <div class="m-top"><span>Kontextspeicher</span><b id="mMem">—</b></div>
    <div class="m-bar"><i id="mMemBar"></i></div>
  </div>
  <div class="metric">
    <div class="m-top"><span>Sync-Latenz</span><b id="mLat">—</b></div>
    <div class="m-bar"><i id="mLatBar"></i></div>
  </div>
  <canvas id="spark"></canvas>
  <div class="m-meta">
    <span>Sitzung<b id="mUptime">00:00:00</b></span>
    <span>Status<b style="color:var(--success)">Nominal</b></span>
    <span>Tag<b id="mDay">—</b></span>
    <span>Woche<b id="mWeek">—</b></span>
  </div>
</aside>

<button id="launchBtn" title="Quantus starten">
  <span class="lb-tri">▶</span><span>Launch</span>
</button>
<div id="hint"><kbd>F</kbd> Vollbild · <kbd>ESC</kbd> Zurück · Launch startet Quantus</div>

<div id="bootOverlay" role="dialog" aria-label="Quantus wird gestartet">
  <div class="boot-card">
    <div class="logo"></div>
    <h2>Quantus</h2>
    <div class="boot-status" id="bootStatus">Initialisiere…</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
  </div>
</div>

<script>
(function(){
"use strict";

var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
var reducedMotion = motionQuery.matches;
var DPR = Math.min(window.devicePixelRatio || 1, 2);

/* Eingebettet im Quantus-Overlay (iframe)? Dann besitzt die Haupt-App das
   Vollbild (sie hat die Klick-Geste) und „zurück" heißt: Overlay schließen —
   ohne Neuladen der App. Standalone (direkter Aufruf) bleibt alles lokal. */
var EMBEDDED = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();
var parentFs = false;   // Vollbild-Zustand der Haupt-App (per postMessage gemeldet)
if (EMBEDDED){
  window.addEventListener("message", function(e){
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === "ruhestand:fs") parentFs = !!e.data.active;
  });
}
function isFullscreen(){
  return EMBEDDED ? parentFs : !!document.fullscreenElement;
}

/* ════════════════════════════════════════════════════════════
   0b) POLARIS-SPRACHREAKTION — die Ringe „atmen", wenn Polaris spricht
   ════════════════════════════════════════════════════════════
   Pegelquelle (0..1):
   • Eingebettet: die Haupt-App postet {type:'ruhestand:voice', level, speaking}
     im Takt von getOutputVolume() (echtes Polaris-Audio).
   • Standalone / Demo: Klick auf den Orb setzt orb.speaking → synthetischer Pegel.
   voice.level wird pro Frame weich nachgezogen; „ripples" sind nach außen
   laufende Kreise, die beim Sprechen entstehen. */
var voice = { level: 0, target: 0, speaking: false, realTs: 0 };
var ripples = [];          // { age, life, strength }
var rippleAccum = 0;
var synthPhase = 0;
var voiceOrbEl = document.getElementById("voiceOrb");

window.addEventListener("message", function(e){
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "ruhestand:voice"){
    var lv = Math.max(0, Math.min(1, +e.data.level || 0));
    voice.realTs = performance.now();
    voice.speaking = !!e.data.speaking && lv > 0.008;
    voice.target = voice.speaking ? Math.max(lv, 0.12) : 0;
    if (voiceOrbEl){ try { voiceOrbEl.speaking = voice.speaking; } catch(_){} }
  }
});

function updateVoice(dtSec){
  var realFresh = (performance.now() - voice.realTs) < 350;   // echter Pegel liegt an?
  var orbSpeaking = !!(voiceOrbEl && voiceOrbEl.speaking);
  if (!realFresh){
    if (orbSpeaking && !reducedMotion){
      // Kein echtes Audio: lebhaften Pegel synthetisieren (0.28..0.84)
      synthPhase += dtSec * 6.2;
      voice.speaking = true;
      voice.target = 0.28 + (Math.sin(synthPhase) * 0.5 + 0.5) * 0.42
                          + (Math.sin(synthPhase * 2.3 + 1.1) * 0.5 + 0.5) * 0.14;
    } else {
      voice.speaking = false; voice.target = 0;
    }
  }
  // weiches Nachziehen (schneller rauf, sanfter runter), frameratenormiert
  var k = (voice.target > voice.level ? 0.28 : 0.10) * Math.min(1, dtSec * 60);
  voice.level += (voice.target - voice.level) * k;
  if (voice.level < 0.001) voice.level = 0;

  // Ripples erzeugen, solange gesprochen wird
  if (voice.speaking && !reducedMotion){
    rippleAccum += dtSec * (0.7 + voice.level * 2.6);
    while (rippleAccum >= 1){
      rippleAccum -= 1;
      ripples.push({ age: 0, life: 1.7, strength: 0.4 + voice.level * 0.6 });
    }
  }
  for (var i = ripples.length - 1; i >= 0; i--){
    ripples[i].age += dtSec;
    if (ripples[i].age >= ripples[i].life) ripples.splice(i, 1);
  }
}

/* ════════════════════════════════════════════════════════════
   1) STERNENFELD — Warp-Effekt + Sternschnuppen
   ════════════════════════════════════════════════════════════ */
var starCanvas = document.getElementById("stars");
var sctx = starCanvas.getContext("2d");
var stars = [], meteors = [];
var W = 0, H = 0, CX = 0, CY = 0;
var STAR_SPEED = reducedMotion ? 0.0006 : 0.012;

function applyMotionPref(){
  reducedMotion = motionQuery.matches;
  STAR_SPEED = reducedMotion ? 0.0006 : 0.012;
}
if (motionQuery.addEventListener) motionQuery.addEventListener("change", applyMotionPref);
else if (motionQuery.addListener) motionQuery.addListener(applyMotionPref);

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  CX = W / 2; CY = H / 2;
  starCanvas.width = Math.round(W * DPR);
  starCanvas.height = Math.round(H * DPR);
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var target = Math.min(650, Math.round(W * H / 3800));
  while (stars.length < target) stars.push(newStar(true));
  stars.length = target;
  sizeHud();
  sizeWave();
  sizeSpark();
}

function newStar(anyDepth){
  return {
    x: (Math.random() * 2 - 1),
    y: (Math.random() * 2 - 1),
    z: anyDepth ? Math.random() * 0.95 + 0.05 : 1,
    hue: Math.random()
  };
}

function starColor(hue, alpha){
  if (hue < 0.60) return "rgba(238,240,242," + alpha + ")";
  if (hue < 0.85) return "rgba(167,139,250," + alpha + ")";
  return "rgba(106,163,222," + alpha + ")";
}

function drawStars(dtNorm){
  sctx.clearRect(0, 0, W, H);
  var span = Math.max(W, H);
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    var pz = s.z;
    s.z -= STAR_SPEED * dtNorm * (0.4 + 0.6 * (1 - s.z));
    if (s.z <= 0.02){ stars[i] = newStar(false); continue; }
    var k  = 0.5 / s.z, pk = 0.5 / pz;
    var x  = CX + s.x * k * span, y  = CY + s.y * k * span;
    var px = CX + s.x * pk * span, py = CY + s.y * pk * span;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20){ stars[i] = newStar(false); continue; }
    var depth = 1 - s.z;
    var alpha = Math.min(1, 0.15 + depth * 0.9);
    var size  = 0.4 + depth * 1.8;
    var dx = x - px, dy = y - py;
    var streak = Math.sqrt(dx * dx + dy * dy);
    if (streak > 1.2 && !reducedMotion){
      sctx.strokeStyle = starColor(s.hue, alpha * 0.9);
      sctx.lineWidth = size;
      sctx.lineCap = "round";
      sctx.beginPath(); sctx.moveTo(px, py); sctx.lineTo(x, y); sctx.stroke();
    } else {
      sctx.fillStyle = starColor(s.hue, alpha);
      sctx.beginPath(); sctx.arc(x, y, size, 0, 6.2832); sctx.fill();
    }
  }
  if (!reducedMotion) drawMeteors(dtNorm);
}

function drawMeteors(dtNorm){
  if (Math.random() < 0.0035 * dtNorm && meteors.length < 3){
    var fromLeft = Math.random() < 0.5;
    meteors.push({
      x: fromLeft ? -60 : W * Math.random(),
      y: fromLeft ? H * Math.random() * 0.5 : -60,
      vx: 7 + Math.random() * 7,
      vy: 3.5 + Math.random() * 3.5,
      life: 1
    });
  }
  for (var i = meteors.length - 1; i >= 0; i--){
    var m = meteors[i];
    m.x += m.vx * dtNorm; m.y += m.vy * dtNorm;
    m.life -= 0.008 * dtNorm;
    if (m.life <= 0 || m.x > W + 80 || m.y > H + 80){ meteors.splice(i, 1); continue; }
    var tail = 14;
    var grad = sctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail, m.y - m.vy * tail);
    grad.addColorStop(0, "rgba(238,240,242," + (0.9 * m.life) + ")");
    grad.addColorStop(0.3, "rgba(167,139,250," + (0.5 * m.life) + ")");
    grad.addColorStop(1, "rgba(167,139,250,0)");
    sctx.strokeStyle = grad;
    sctx.lineWidth = 1.6;
    sctx.lineCap = "round";
    sctx.beginPath();
    sctx.moveTo(m.x, m.y);
    sctx.lineTo(m.x - m.vx * tail, m.y - m.vy * tail);
    sctx.stroke();
  }
}

/* ════════════════════════════════════════════════════════════
   2) HUD — Ringe, Spektrum, Sweep, Orbits + atmender KI-Kern
   ════════════════════════════════════════════════════════════ */
var hudCanvas = document.getElementById("hud");
var hctx = hudCanvas.getContext("2d");
var HS = 0, HC = 0;
var spectrum = [];
var SPECTRUM_N = 96;
for (var si = 0; si < SPECTRUM_N; si++){
  spectrum.push({ phase: Math.random() * 6.2832, speed: 0.4 + Math.random() * 1.4, amp: 0.35 + Math.random() * 0.65 });
}
/* Kern-Partikel: kleine Punkte, die den Kern umkreisen */
var coreParticles = [];
for (var ci = 0; ci < 26; ci++){
  coreParticles.push({
    r: 0.16 + Math.random() * 0.16,        // Radius (Anteil von R)
    a: Math.random() * 6.2832,
    sp: (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.25),
    size: 0.5 + Math.random() * 1.2,
    hue: Math.random()
  });
}

function sizeHud(){
  var rect = hudCanvas.parentElement.getBoundingClientRect();
  HS = rect.width;
  HC = HS / 2;
  hudCanvas.width = Math.round(HS * DPR);
  hudCanvas.height = Math.round(HS * DPR);
  hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

var VIOLET      = "167,139,250";
var VIOLET_DEEP = "139,92,246";
var BLUE        = "106,163,222";
var TEXT_RGB    = "238,240,242";

function ring(r, width, rgb, alpha, glow){
  hctx.beginPath();
  hctx.arc(HC, HC, r, 0, 6.2832);
  hctx.strokeStyle = "rgba(" + rgb + "," + alpha + ")";
  hctx.lineWidth = width;
  hctx.shadowBlur = glow || 0;
  hctx.shadowColor = "rgba(" + rgb + ",.8)";
  hctx.stroke();
  hctx.shadowBlur = 0;
}

function arc(r, a0, a1, width, rgb, alpha, glow, cap){
  hctx.beginPath();
  hctx.arc(HC, HC, r, a0, a1);
  hctx.strokeStyle = "rgba(" + rgb + "," + alpha + ")";
  hctx.lineWidth = width;
  hctx.lineCap = cap || "butt";
  hctx.shadowBlur = glow || 0;
  hctx.shadowColor = "rgba(" + rgb + ",.85)";
  hctx.stroke();
  hctx.shadowBlur = 0;
  hctx.lineCap = "butt";
}

function ticks(r, n, len, width, rgb, alpha, rot, everyNthLonger){
  for (var i = 0; i < n; i++){
    var a = rot + (i / n) * 6.2832;
    var l = (everyNthLonger && i % everyNthLonger === 0) ? len * 1.9 : len;
    var c = Math.cos(a), s = Math.sin(a);
    hctx.beginPath();
    hctx.moveTo(HC + c * r, HC + s * r);
    hctx.lineTo(HC + c * (r - l), HC + s * (r - l));
    hctx.strokeStyle = "rgba(" + rgb + "," + alpha + ")";
    hctx.lineWidth = width;
    hctx.stroke();
  }
}

function dashedRing(r, dashCount, fill, width, rgb, alpha, rot){
  var step = 6.2832 / dashCount;
  for (var i = 0; i < dashCount; i++){
    var a0 = rot + i * step;
    arc(r, a0, a0 + step * fill, width, rgb, alpha, 0);
  }
}

function drawHud(t){
  hctx.clearRect(0, 0, HS, HS);
  var R = HC * 0.98;
  var vl = voice.level;                       // Sprach-Pegel 0..1
  // Sprechen beschleunigt die Rotation spürbar → die Ringe „bewegen sich"
  var slow = reducedMotion ? 0 : t * (1 + vl * 0.8);

  /* Atmender KI-Kern: weicher violetter Schein — dehnt sich beim Sprechen aus */
  var breath = reducedMotion ? 0.5 : (Math.sin(t * 0.55) * 0.5 + 0.5);
  var coreR = R * (0.30 + breath * 0.025 + vl * 0.10);
  var cg = hctx.createRadialGradient(HC, HC, 0, HC, HC, coreR);
  cg.addColorStop(0, "rgba(" + VIOLET_DEEP + "," + (0.10 + breath * 0.07 + vl * 0.16) + ")");
  cg.addColorStop(0.65, "rgba(" + VIOLET_DEEP + "," + (0.045 + breath * 0.03 + vl * 0.08) + ")");
  cg.addColorStop(1, "rgba(" + VIOLET_DEEP + ",0)");
  hctx.fillStyle = cg;
  hctx.beginPath(); hctx.arc(HC, HC, coreR, 0, 6.2832); hctx.fill();

  /* Kern-Partikel umkreisen das Zentrum */
  for (var p = 0; p < coreParticles.length; p++){
    var cp = coreParticles[p];
    var pa = cp.a + slow * cp.sp;
    var wobR = cp.r + Math.sin(slow * 0.7 + cp.a * 3) * 0.008;
    var pxc = HC + Math.cos(pa) * R * wobR;
    var pyc = HC + Math.sin(pa) * R * wobR * 0.94;   /* leicht elliptisch */
    var pal = 0.18 + (Math.sin(slow * 1.3 + cp.a * 5) * 0.5 + 0.5) * 0.4;
    hctx.beginPath(); hctx.arc(pxc, pyc, cp.size, 0, 6.2832);
    hctx.fillStyle = "rgba(" + (cp.hue < 0.7 ? VIOLET : BLUE) + "," + pal + ")";
    hctx.fill();
  }

  /* Basis-Kreise */
  ring(R * 0.99, 1, VIOLET, 0.10);
  ring(R * 0.80, 1, VIOLET, 0.08);
  ring(R * 0.485, 1, BLUE, 0.10);

  /* ── Sprachreaktion: nach außen laufende Ripples + heller pulsierende Ringe ── */
  for (var rp = 0; rp < ripples.length; rp++){
    var rr = ripples[rp];
    var f = rr.age / rr.life;                 // 0 → 1
    var rad = R * (0.42 + f * 0.56);
    var al = rr.strength * (1 - f) * 0.5;
    ring(rad, 1.4 + (1 - f) * 1.3, VIOLET, al, 8 * (1 - f));
  }
  if (vl > 0.01){
    ring(R * (0.485 + vl * 0.055), 1 + vl * 1.6, BLUE,   0.10 + vl * 0.5, 6 + vl * 16);
    ring(R * (0.80  + vl * 0.04),  1 + vl * 1.3, VIOLET, 0.08 + vl * 0.42, vl * 14);
    ring(R * (0.99  + vl * 0.02),  1 + vl * 1.0, VIOLET, 0.10 + vl * 0.3,  vl * 10);
  }

  /* Äußerer Tick-Ring — Uhrenskala */
  ticks(R * 0.985, 120, R * 0.018, 1, TEXT_RGB, 0.26, slow * 0.02, 10);

  /* Gestrichelter Ring außen */
  dashedRing(R * 0.93, 48, 0.55, 1.6, VIOLET, 0.32, slow * 0.06);

  /* Kräftige Segmentbögen — gegenläufig, mit Glow */
  var segs = [[0, 1.9], [2.4, 3.6], [4.1, 5.6]];
  for (var i = 0; i < segs.length; i++){
    arc(R * 0.87, segs[i][0] - slow * 0.10, segs[i][1] - slow * 0.10, R * 0.024, VIOLET, 0.5, 12);
  }
  var segs2 = [[0.6, 1.4], [2.9, 4.9]];
  for (i = 0; i < segs2.length; i++){
    arc(R * 0.755, segs2[i][0] + slow * 0.16, segs2[i][1] + slow * 0.16, R * 0.012, BLUE, 0.45, 7);
  }

  /* Mittlerer Tick-Ring — gegenläufig */
  ticks(R * 0.71, 90, R * 0.022, 1, VIOLET, 0.26, -slow * 0.05);

  /* Radial-Spektrum */
  var base = R * 0.545;
  for (i = 0; i < SPECTRUM_N; i++){
    var sp = spectrum[i];
    var a = (i / SPECTRUM_N) * 6.2832 + slow * 0.03;
    var wob = reducedMotion ? 0.5 :
      (Math.sin(t * sp.speed + sp.phase) * 0.5 + 0.5) *
      (Math.sin(t * 0.35 + i * 0.42) * 0.5 + 0.5);
    var len = R * 0.013 + wob * sp.amp * R * 0.08 * (1 + vl * 2.6);
    var c = Math.cos(a), s2 = Math.sin(a);
    hctx.beginPath();
    hctx.moveTo(HC + c * base, HC + s2 * base);
    hctx.lineTo(HC + c * (base + len), HC + s2 * (base + len));
    hctx.strokeStyle = "rgba(" + (i % 5 === 0 ? BLUE : VIOLET) + "," + (0.26 + wob * 0.42 + vl * 0.28) + ")";
    hctx.lineWidth = 1.4;
    hctx.stroke();
  }

  /* Gestrichelter Innenring */
  dashedRing(R * 0.52, 32, 0.45, 1.3, BLUE, 0.36, -slow * 0.14);

  /* Sekunden-Fortschrittsbogen */
  var now = new Date();
  var minuteFrac = (now.getSeconds() + now.getMilliseconds() / 1000) / 60;
  arc(R * 0.60, -1.5708, -1.5708 + minuteFrac * 6.2832, R * 0.011, VIOLET_DEEP, 0.8, 10, "round");

  /* Radar-Sweep */
  var sweep = slow * 0.5;
  for (i = 0; i < 14; i++){
    var fade = i / 14;
    arc(R * 0.44, sweep - 0.5 + fade * 0.5, sweep - 0.5 + fade * 0.5 + 0.045, R * 0.018, VIOLET, 0.05 + fade * 0.36, 0);
  }
  var hx = HC + Math.cos(sweep) * R * 0.44, hy = HC + Math.sin(sweep) * R * 0.44;
  hctx.beginPath(); hctx.arc(hx, hy, R * 0.011, 0, 6.2832);
  hctx.fillStyle = "rgba(" + TEXT_RGB + ",.95)";
  hctx.shadowBlur = 14; hctx.shadowColor = "rgba(" + VIOLET + ",1)";
  hctx.fill(); hctx.shadowBlur = 0;

  /* Orbit-Punkte */
  var orbits = [
    { r: 0.80, sp: 0.22, ph: 0.0, rgb: VIOLET },
    { r: 0.80, sp: 0.22, ph: 3.14, rgb: BLUE },
    { r: 0.99, sp: -0.09, ph: 1.2, rgb: VIOLET }
  ];
  for (i = 0; i < orbits.length; i++){
    var o = orbits[i];
    var oa = slow * o.sp + o.ph;
    var ox = HC + Math.cos(oa) * R * o.r, oy = HC + Math.sin(oa) * R * o.r;
    hctx.beginPath(); hctx.arc(ox, oy, R * 0.0075, 0, 6.2832);
    hctx.fillStyle = "rgba(" + o.rgb + ",.9)";
    hctx.shadowBlur = 9; hctx.shadowColor = "rgba(" + o.rgb + ",.9)";
    hctx.fill(); hctx.shadowBlur = 0;
  }

  /* Fadenkreuz-Andeutung */
  for (i = 0; i < 4; i++){
    var ca = i * 1.5708 + 0.7854;
    var c1 = Math.cos(ca), s1 = Math.sin(ca);
    hctx.beginPath();
    hctx.moveTo(HC + c1 * R * 1.0, HC + s1 * R * 1.0);
    hctx.lineTo(HC + c1 * R * 0.955, HC + s1 * R * 0.955);
    hctx.strokeStyle = "rgba(" + TEXT_RGB + ",.32)";
    hctx.lineWidth = 2;
    hctx.stroke();
  }
}

/* ════════════════════════════════════════════════════════════
   3) WAVEFORM — feine Signallinie unter der Uhr
   ════════════════════════════════════════════════════════════ */
var waveCanvas = document.getElementById("wave");
var wctx = waveCanvas.getContext("2d");
var WW = 0, WH = 0;

function sizeWave(){
  var rect = waveCanvas.getBoundingClientRect();
  WW = Math.max(10, rect.width); WH = Math.max(10, rect.height);
  waveCanvas.width = Math.round(WW * DPR);
  waveCanvas.height = Math.round(WH * DPR);
  wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawWave(t){
  wctx.clearRect(0, 0, WW, WH);
  var mid = WH / 2;
  var tt = reducedMotion ? 0 : t * (1 + voice.level * 1.2);
  var amp = 0.55 + voice.level * 1.5;                       // schlägt beim Sprechen kräftig aus
  wctx.beginPath();
  for (var x = 0; x <= WW; x += 2){
    var u = x / WW;
    var env = Math.sin(u * Math.PI);                       // Hüllkurve: Enden laufen aus
    var y = mid + env * (
      Math.sin(u * 22 + tt * 2.1) * 0.35 +
      Math.sin(u * 9 - tt * 1.3) * 0.3 +
      Math.sin(u * 47 + tt * 3.7) * 0.12
    ) * mid * 0.85 * amp;
    if (x === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
  }
  var wg = wctx.createLinearGradient(0, 0, WW, 0);
  wg.addColorStop(0, "rgba(167,139,250,0)");
  wg.addColorStop(0.25, "rgba(167,139,250,.55)");
  wg.addColorStop(0.5, "rgba(238,240,242,.75)");
  wg.addColorStop(0.75, "rgba(106,163,222,.55)");
  wg.addColorStop(1, "rgba(106,163,222,0)");
  wctx.strokeStyle = wg;
  wctx.lineWidth = 1.4;
  wctx.stroke();
}

/* ════════════════════════════════════════════════════════════
   4) UHR, DATUM & KERNMETRIKEN
   ════════════════════════════════════════════════════════════ */
var clockEl = document.getElementById("clock");
var dateEl = document.getElementById("dateLine");
var mUptime = document.getElementById("mUptime");
var mDay = document.getElementById("mDay");
var mWeek = document.getElementById("mWeek");
var sessionStart = Date.now();

function pad(n){ return n < 10 ? "0" + n : "" + n; }

function isoWeek(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
}

function updateClock(){
  var d = new Date();
  clockEl.innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes()) +
    '<span class="sec">:' + pad(d.getSeconds()) + "</span>";
  dateEl.textContent = d.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  if (mUptime){
    var up = Math.floor((Date.now() - sessionStart) / 1000);
    mUptime.textContent = pad(Math.floor(up / 3600)) + ":" + pad(Math.floor(up / 60) % 60) + ":" + pad(up % 60);
  }
  if (mDay){
    // UTC-Mitternachts-Differenz: immun gegen die DST-Stunde
    var y = d.getFullYear();
    var dayN = Math.floor((Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(y, 0, 1)) / 86400000) + 1;
    mDay.textContent = dayN + " / " + (((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365);
  }
  if (mWeek) mWeek.textContent = "KW " + pad(isoWeek(d));
}
updateClock();
setInterval(updateClock, 1000);

/* Kernmetriken: ruhige, plausible Idle-Werte mit weichen Übergängen */
var mLoad = document.getElementById("mLoad"), mLoadBar = document.getElementById("mLoadBar");
var mMem = document.getElementById("mMem"), mMemBar = document.getElementById("mMemBar");
var mLat = document.getElementById("mLat"), mLatBar = document.getElementById("mLatBar");
var loadVal = 4.2, memVal = 1.26, latVal = 11;
var sparkData = [];
// Sparkline vorbefüllen, damit der Verlauf ab dem ersten Frame sichtbar ist
for (var pf = 0, pv = 4.2; pf < 46; pf++){
  pv = Math.max(2.1, Math.min(9.8, pv + (Math.random() - 0.5) * 1.6));
  sparkData.push(pv);
}

function updateMetrics(){
  loadVal = Math.max(2.1, Math.min(9.8, loadVal + (Math.random() - 0.5) * 1.6));
  memVal = Math.max(1.18, Math.min(1.42, memVal + (Math.random() - 0.5) * 0.02));
  latVal = Math.max(7, Math.min(18, Math.round(latVal + (Math.random() - 0.5) * 3)));
  if (mLoad){ mLoad.textContent = loadVal.toFixed(1) + " %"; mLoadBar.style.width = (loadVal * 6) + "%"; }
  if (mMem){ mMem.textContent = memVal.toFixed(2) + " GB"; mMemBar.style.width = (memVal / 2 * 100) + "%"; }
  if (mLat){ mLat.textContent = latVal + " ms"; mLatBar.style.width = (latVal * 3.6) + "%"; }
  sparkData.push(loadVal);
  if (sparkData.length > 60) sparkData.shift();
  drawSpark();
}

/* Sparkline: Kernlast-Verlauf */
var sparkCanvas = document.getElementById("spark");
var kctx = sparkCanvas.getContext("2d");
var SW = 0, SH = 0;

function sizeSpark(){
  var rect = sparkCanvas.getBoundingClientRect();
  if (!rect.width) return;   // Panel ausgeblendet (schmaler Viewport)
  SW = rect.width; SH = rect.height;
  sparkCanvas.width = Math.round(SW * DPR);
  sparkCanvas.height = Math.round(SH * DPR);
  kctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSpark();
}

function drawSpark(){
  if (!SW) return;
  kctx.clearRect(0, 0, SW, SH);
  if (sparkData.length < 2) return;
  var n = sparkData.length;
  kctx.beginPath();
  for (var i = 0; i < n; i++){
    var x = (i / 59) * SW;
    var y = SH - 4 - (sparkData[i] / 10) * (SH - 8);
    if (i === 0) kctx.moveTo(x, y); else kctx.lineTo(x, y);
  }
  kctx.strokeStyle = "rgba(167,139,250,.75)";
  kctx.lineWidth = 1.3;
  kctx.stroke();
  // Fläche darunter sanft füllen
  kctx.lineTo(((n - 1) / 59) * SW, SH);
  kctx.lineTo(0, SH);
  kctx.closePath();
  var sg = kctx.createLinearGradient(0, 0, 0, SH);
  sg.addColorStop(0, "rgba(167,139,250,.16)");
  sg.addColorStop(1, "rgba(167,139,250,0)");
  kctx.fillStyle = sg;
  kctx.fill();
}
updateMetrics();
setInterval(updateMetrics, 1400);

/* ════════════════════════════════════════════════════════════
   5) SYSTEM-LOG — ruhiger Ereignisstrom
   ════════════════════════════════════════════════════════════ */
var logLines = document.getElementById("logLines");
var LOG_POOL = [
  "Neuronale Matrix synchron",
  "Kontextfenster defragmentiert",
  "Embedding-Cache konsolidiert",
  "Wissensgraph konsistent",
  "Inbox-Watcher im Leerlauf",
  "Sensorik: keine Anomalien",
  "Energieprofil: Ruhezustand",
  "Sync-Kanal stabil",
  "Heuristiken nachjustiert",
  "Speicherpfade verifiziert",
  "Prioritätsqueue leer",
  "Telemetrie nominal"
];
var LOG_HL = [
  "Snapshot gesichert",
  "Tagesindex aktualisiert",
  "Modell-Checkpoint ok"
];
var logTimer = null;

function appendLog(date, msg, hl){
  if (!logLines) return;
  var el = document.createElement("div");
  el.className = "log-line" + (hl ? " hl" : "");
  el.innerHTML = '<span class="lt">' + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()) +
    '</span><span class="lm">' + msg + "</span>";
  logLines.appendChild(el);
  while (logLines.children.length > 8) logLines.removeChild(logLines.firstChild);
}

function addLogLine(){
  var hl = Math.random() < 0.18;
  var pool = hl ? LOG_HL : LOG_POOL;
  appendLog(new Date(), pool[Math.floor(Math.random() * pool.length)], hl);
  logTimer = setTimeout(addLogLine, 2800 + Math.random() * 4200);
}

// Log vorbefüllen (Zeitstempel leicht in der Vergangenheit), damit das
// Panel nicht leer startet — danach normaler Ereignisstrom
(function seedLog(){
  var offsets = [26, 21, 17, 12, 8, 4];
  var used = [];
  for (var i = 0; i < offsets.length; i++){
    var msg;
    do { msg = LOG_POOL[Math.floor(Math.random() * LOG_POOL.length)]; } while (used.indexOf(msg) !== -1);
    used.push(msg);
    appendLog(new Date(Date.now() - offsets[i] * 1000), msg, i === 2);
  }
})();
addLogLine();

/* ════════════════════════════════════════════════════════════
   6) HAUPTSCHLEIFE
   ════════════════════════════════════════════════════════════ */
var lastFrame = performance.now();
var running = true;
var rafId = 0;   // ausstehender rAF — beim Pausieren canceln, sonst
                 // stapeln sich nach Hidden→Visible-Zyklen parallele Loops

function frame(nowMs){
  if (!running) return;
  var dt = Math.min(100, nowMs - lastFrame);
  lastFrame = nowMs;
  var dtNorm = dt / 16.6667;   // 1.0 ≙ 60 fps — geräteunabhängiges Tempo (144 Hz!)
  updateVoice(dt / 1000);      // Sprach-Pegel & Ripples fortschreiben
  drawStars(dtNorm);
  drawHud(nowMs / 1000);
  drawWave(nowMs / 1000);
  rafId = requestAnimationFrame(frame);
}

document.addEventListener("visibilitychange", function(){
  if (document.hidden){
    running = false;
    cancelAnimationFrame(rafId);
  } else if (!running){
    running = true; lastFrame = performance.now(); rafId = requestAnimationFrame(frame);
  }
});

window.addEventListener("resize", resize);
resize();
rafId = requestAnimationFrame(frame);

/* ════════════════════════════════════════════════════════════
   7) BEDIENUNG — Vollbild, Launch-Sequenz, Hint
   ════════════════════════════════════════════════════════════ */
var uiTimeout = null;
function showUi(){
  document.body.classList.add("ui-visible");
  clearTimeout(uiTimeout);
  uiTimeout = setTimeout(function(){ document.body.classList.remove("ui-visible"); }, 3200);
}
window.addEventListener("mousemove", showUi);
window.addEventListener("touchstart", showUi, { passive: true });
window.addEventListener("focusin", showUi);
showUi();   // beim Start kurz zeigen: Hint erklärt Vollbild (F/Klick) und Launch

/* Vollbild: Autostart geht nicht ohne Nutzer-Geste — im Overlay übernimmt
   die Haupt-App das direkt beim Öffnen (Header-Klick). Hier: erster
   Klick/Tap irgendwo oder Taste F schalten um; eingebettet wird die
   Umschaltung an die Haupt-App delegiert (Nutzer-Aktivierung propagiert). */
function toggleFullscreen(){
  if (EMBEDDED){
    try { window.parent.postMessage({ type: "ruhestand:toggleFs" }, location.origin); } catch(e){}
    return;
  }
  if (document.fullscreenElement){
    document.exitFullscreen && document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(function(){});
  }
}
document.getElementById("fsBtn").addEventListener("click", function(e){
  e.stopPropagation();
  toggleFullscreen();
});
window.addEventListener("click", function(e){
  if (e.target.closest && (e.target.closest("#launchBtn") || e.target.closest("#fsBtn") || e.target.closest("#bootOverlay") || e.target.closest("quantus-orb"))) return;
  if (!isFullscreen()) toggleFullscreen();
  showUi();
});

/* Sprach-Orb: an die Sprachsteuerung anbinden, sobald vorhanden —
   bis dahin Klick-Vorschau der „KI spricht"-Wellen */
var orbDemoTimer = null;
document.addEventListener("orb-activate", function(e){
  var orb = e.target;
  if (window.quantusVoice && typeof window.quantusVoice.toggle === "function"){
    window.quantusVoice.toggle(orb);
    return;
  }
  clearTimeout(orbDemoTimer);
  orb.speaking = !orb.speaking;
  if (orb.speaking) orbDemoTimer = setTimeout(function(){ orb.speaking = false; }, 4000);
});

window.addEventListener("keydown", function(e){
  if (e.key === "f" || e.key === "F"){ toggleFullscreen(); return; }
  if (e.key === "Escape"){
    // Im Vollbild fängt der Browser ESC (Vollbild-Ausstieg) — erst der
    // zweite ESC verlässt die Seite.
    if (isFullscreen()) return;
    goBack();
  }
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "launchBtn") return; // Button feuert selbst
});

function goBack(){
  if (EMBEDDED){
    try { window.parent.postMessage({ type: "ruhestand:close" }, location.origin); } catch(e){}
    return;
  }
  window.location.href = "index.html";
}

/* Launch-Sequenz: kurzer Boot im Quantus-Look, dann in die App */
var launching = false;
var BOOT_STEPS = [
  [0,   "Initialisiere Arbeitsbereich…"],
  [420, "Lade Zustand & Einstellungen…"],
  [820, "Synchronisiere Module…"],
  [1150, "Bereit."]
];
document.getElementById("launchBtn").addEventListener("click", function(){
  if (launching) return;
  launching = true;
  clearTimeout(logTimer);
  var overlay = document.getElementById("bootOverlay");
  var bar = document.getElementById("bootBar");
  var status = document.getElementById("bootStatus");
  overlay.classList.add("open");
  document.body.classList.add("ui-visible");
  BOOT_STEPS.forEach(function(step){
    setTimeout(function(){
      status.textContent = step[1];
      bar.style.width = Math.min(100, Math.round((step[0] + 300) / 14.5)) + "%";
    }, step[0]);
  });
  setTimeout(function(){ bar.style.width = "100%"; }, 1200);
  setTimeout(goBack, 1500);
});

})();
