<!DOCTYPE html>
<html lang="de-CH" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171c20">
<title>Quantus · BM-Prüfung</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Theme frueh anwenden (kein FOUC) — gleicher localStorage-Key wie die Quantus-Hauptapp. */
(function(){ try {
  var m = localStorage.getItem("quantus_themeMode") || "dark";
  var light = m==="light" || (m==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  var de = document.documentElement; de.classList.toggle("theme-light", light); de.classList.toggle("theme-dark", !light);
} catch(e){} })();
</script>
<style>
:root{
  /* Design-System „Schiefer" (Dark, Default) — identisch zur Quantus-Hauptapp */
  --surface-base:#171c20; --surface-raised:#212830; --surface-overlay:#2d3640;
  --border:#3b4550; --border2:#4f5a66; --hover:rgba(224,226,232,.08);
  --text-primary:#eef0f2; --text-muted:#929aa4;
  --accent:#45c198; --accent-deep:#2ea27b; --accent-soft:color-mix(in oklab, var(--accent) 24%, transparent);
  --on-accent:#04140d;
  --danger:#e5765a; --warning:#e3b048; --success:#45c198; --info:#6aa3de; --coral:#d96c57;
  --bg:var(--surface-base); --panel:var(--surface-raised); --panel2:var(--surface-overlay);
  --muted:var(--text-muted); --text:var(--text-primary); --text2:#cccfd5;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.26);
  --shadow-lg:0 8px 22px rgba(0,0,0,.36),0 22px 56px rgba(0,0,0,.32);
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --mono:ui-monospace,SF Mono,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,SF Pro Text,Helvetica Neue,Arial,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --transition:all .16s cubic-bezier(.25,.1,.25,1);
}
html.theme-light{
  --surface-base:#cdc6b6; --surface-raised:#e9e3d5; --surface-overlay:#f2ede1;
  --border:#c3bbaa; --border2:#a99f8b; --hover:rgba(30,30,25,.06);
  --text-primary:#232019; --text-muted:#6b6353;
  --accent:#1f8a66; --accent-deep:#166b4f; --on-accent:#f7f5ef;
  --shadow:0 1px 2px rgba(80,70,50,.12),0 6px 18px rgba(80,70,50,.10);
  --shadow-lg:0 10px 26px rgba(80,70,50,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font-family:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ── Topbar ── */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:color-mix(in oklab,var(--surface-raised) 92%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.tb-back{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius-sm);
  color:var(--muted);text-decoration:none;font-size:13px;border:1px solid transparent;white-space:nowrap}
.tb-back:hover{background:var(--hover);color:var(--text)}
.tb-brand{display:flex;align-items:center;gap:9px;font-weight:600}
.tb-brand img{width:19px;height:19px;vertical-align:-3px}
.tb-brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tb-spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:15px;transition:var(--transition)}
.tb-btn:hover{background:var(--hover);border-color:var(--border2)}

/* ── Nav ── */
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--border);
  background:var(--surface-base);position:sticky;top:55px;z-index:35;scrollbar-width:thin}
.nav::-webkit-scrollbar{height:0}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;text-decoration:none;
  color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:var(--transition)}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--text);border-color:color-mix(in oklab,var(--accent) 45%,transparent)}

/* ── Layout ── */
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
.pagehead{margin:2px 0 18px}
.pagehead h1{font-family:var(--serif);font-size:26px;font-weight:700}
.pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px}

/* ── Cards / grid ── */
.grid{display:grid;gap:14px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:var(--transition)}
.card.click:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.stat .n{font-size:27px;font-weight:700;font-family:var(--serif);line-height:1}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:5px}
.stat .n.accent{color:var(--accent)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:15px;font-weight:600}
.section-title .badge{margin-left:auto}
.fach-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.fach-head h2{font-family:var(--serif);font-size:20px}
.fach-head .cnt{color:var(--muted);font-size:13px}

/* ── Badges / chips ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--accent-soft);color:var(--text);border-color:transparent}
.badge.warn{background:color-mix(in oklab,var(--warning) 22%,transparent);color:var(--text)}
.badge.due{background:color-mix(in oklab,var(--danger) 24%,transparent);color:var(--text)}
.chip{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted)}
.chip.leicht{color:var(--success)} .chip.mittel{color:var(--warning)} .chip.schwer{color:var(--danger)}

/* ── Thema card ── */
.tcard{display:flex;flex-direction:column;gap:9px}
.tcard .kap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tcard h3{font-size:15.5px;font-weight:600}
.tcard .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.tcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px}

/* ── Progress ── */
.bar{height:7px;border-radius:999px;background:var(--panel2);overflow:hidden;flex:1;min-width:60px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:999px}
.ring{display:inline-block;vertical-align:middle}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;font-weight:500;
  transition:var(--transition);text-decoration:none}
.btn:hover{background:var(--hover);border-color:var(--border2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ── Inputs ── */
input[type=date],input[type=text],textarea,select{width:100%;padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface-base);color:var(--text);font-family:inherit;font-size:14px}
textarea{resize:vertical;min-height:96px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label.fld{display:block;margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}

/* ── Detail blocks ── */
.prose{white-space:pre-wrap;line-height:1.65;font-size:14.5px}
.list-clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.list-clean li{display:flex;gap:9px;align-items:flex-start}
.list-clean li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.merk{font-family:var(--mono);font-size:13px;background:var(--surface-base);border:1px solid var(--border);
  border-radius:8px;padding:8px 11px}
.beispiel{font-family:var(--mono);font-size:13px;color:var(--text2)}

/* ── Quiz ── */
.quizwrap{max-width:640px;margin:0 auto}
.quizbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.quizbar .bar{height:9px}
.q-frage{font-size:18px;font-weight:500;line-height:1.45;margin:10px 0 18px;font-family:var(--serif)}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin:8px 0;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14.5px;transition:var(--transition)}
.opt:hover{border-color:var(--border2);background:var(--hover)}
.opt.correct{border-color:var(--success);background:color-mix(in oklab,var(--success) 16%,transparent)}
.opt.wrong{border-color:var(--danger);background:color-mix(in oklab,var(--danger) 16%,transparent)}
.opt.chosen{border-width:2px}
.reveal{margin-top:16px;padding:15px;border-radius:var(--radius-sm);background:var(--surface-base);border:1px solid var(--border)}
.reveal .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.reveal .los{font-size:15px;font-weight:600;margin:3px 0 10px}
.selfgrade{display:flex;gap:10px;margin-top:14px}

/* ── Chat ── */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:420px}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid color-mix(in oklab,var(--accent) 40%,transparent)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
.msg.err{align-self:stretch;max-width:100%;background:color-mix(in oklab,var(--danger) 14%,transparent);border:1px solid var(--danger)}
.chatform{display:flex;gap:9px;margin-top:12px;align-items:flex-end}
.chatform textarea{min-height:46px;max-height:150px}

/* ── Book iframe ── */
.bookframe{width:100%;height:calc(100vh - 150px);border:1px solid var(--border);border-radius:var(--radius);background:#fff}

/* ── Toast / modal ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface-overlay);color:var(--text);border:1px solid var(--border2);border-radius:10px;
  padding:10px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.empty{text-align:center;padding:46px 18px;color:var(--muted)}
.empty .ic{font-size:34px;opacity:.7}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){ .wrap{padding:16px 12px 80px} .tb-brand small{display:none} .pagehead h1{font-size:22px} }
</style>
</head>
<body>
<div class="topbar">
  <a class="tb-back" href="index.html" title="Zurück zu Quantus">‹ Quantus</a>
  <div class="tb-brand"><img src="emblem.svg" alt="">BM-Prüfung <small>Quantus · Prüfungsvorbereitung</small></div>
  <div class="tb-spacer"></div>
  <button class="tb-btn" data-action="theme" title="Hell / Dunkel">◐</button>
</div>
<nav class="nav" id="nav"></nav>
<main class="wrap" id="app"><div class="empty"><div class="spin"></div><p>Wissensbasis wird geladen …</p></div></main>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Quantus · BM-Prüfung — statische Lern-App (Single-File, kein Build-Step)
   Datenquelle: /theorie/kompendium.json (aus den 6 Theorie-Lehrbuechern)
   Speicherung: localStorage (Fortschritt, Notizen, Zieldaten, Fehler-Queue)
   Tageslektion: Netlify-Blob (von n8n geschrieben)   KI-Chat: Netlify-Function
   ═══════════════════════════════════════════════════════════════════════ */

var CFG = {
  DATA_URL:   "theorie/kompendium.json",
  BOOK_BASE:  "theorie/",
  LESSON_URL: "/.netlify/functions/quantus-lesson",
  CHAT_URL:   "/.netlify/functions/quantus-chat",
  STORE_KEY:  "quantus_bm_v1",
};
/* Leitner-Intervalle je Box (Tage bis zur naechsten Faelligkeit). Box 0 = morgen. */
var LEITNER = [1, 2, 4, 7, 14, 30];

/* ── Utils ─────────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysISO(iso, n){ var d=iso?new Date(iso+"T00:00:00"):new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; try{ return new Date(iso+"T00:00:00").toLocaleDateString("de-CH",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return iso; } }
function daysUntil(iso){ if(!iso) return null; return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/86400000); }
function toast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.getElementById("toast").appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }
function normAns(s){ return String(s==null?"":s).toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/^\s*(option\s*\d+\s*[:.)-]*|[a-h][.)])\s*/i,"")
  .replace(/[«»"'`]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }

/* ── State ─────────────────────────────────────────────────────────────── */
var DATA = null;                 // { faecher:[...], stats:{...} }
var IDX = { themen:[], byKey:{}, fachByKey:{} };  // Indizes
var U = null;                    // Nutzerdaten (localStorage)
var quiz = null;                 // aktive Quiz-Session
var chatBusy = false;

function loadU(){
  try{ U = JSON.parse(localStorage.getItem(CFG.STORE_KEY)) || null; }catch(e){ U=null; }
  if(!U) U = {};
  U.aufg   = U.aufg   || {};   // aufgabeKey -> {box, due, c, w}
  U.goals  = U.goals  || {};   // themaKey -> ISO
  U.notes  = U.notes  || {};   // themaKey -> text
  U.lesson = U.lesson || {};   // { doneDates:{iso:true} }
  U.chat   = U.chat   || [];   // [{role, content}]
  U.lesson.doneDates = U.lesson.doneDates || {};
}
function saveU(){ try{ localStorage.setItem(CFG.STORE_KEY, JSON.stringify(U)); }catch(e){ toast("Speichern fehlgeschlagen (Speicher voll?)"); } }

/* ── Keys / Index ──────────────────────────────────────────────────────── */
function themaKey(fachKey, themaId){ return fachKey+"/"+themaId; }
function aufgKey(fachKey, themaId, aId){ return fachKey+"/"+themaId+"/"+aId; }

function buildIndex(){
  IDX = { themen:[], byKey:{}, fachByKey:{} };
  DATA.faecher.forEach(function(f){
    (f.themen||[]).forEach(function(t){
      var k = themaKey(f.key, t.id);
      var rec = { key:k, fachKey:f.key, fach:f.fach, file:f.file, thema:t };
      IDX.themen.push(rec); IDX.byKey[k]=rec;
    });
    IDX.fachByKey[f.key]=f;
  });
}

/* ── Fortschritt / Mastery ─────────────────────────────────────────────── */
function aufgState(k){ return U.aufg[k] || null; }
function themaMastery(rec){  // 0..1 ueber alle Aufgaben des Themas
  var as = rec.thema.aufgaben||[]; if(!as.length) return 0;
  var sum=0; as.forEach(function(a){ var st=U.aufg[aufgKey(rec.fachKey, rec.thema.id, a.id)];
    sum += st ? Math.min(st.box,5)/5 : 0; });
  return sum/as.length;
}
function themaSeen(rec){ var as=rec.thema.aufgaben||[],n=0;
  as.forEach(function(a){ if(U.aufg[aufgKey(rec.fachKey,rec.thema.id,a.id)]) n++; }); return n; }
function fachMastery(fachKey){ var recs=IDX.themen.filter(function(r){return r.fachKey===fachKey;});
  if(!recs.length) return 0; var s=0; recs.forEach(function(r){ s+=themaMastery(r); }); return s/recs.length; }
function komAufg(key){ // Aufgabe aus der Wissensbasis (oder null)
  var parts=key.split("/"); if(parts.length<3) return null;
  var aId=parts.pop(), tId=parts.pop(), fKey=parts.join("/");
  var rec=IDX.byKey[fKey+"/"+tId]; if(!rec) return null;
  var a=(rec.thema.aufgaben||[]).filter(function(x){return String(x.id)===aId;})[0];
  return a ? {rec:{fachKey:rec.fachKey, fach:rec.fach, thema:rec.thema}, a:a} : null;
}
function resolveAufg(key){ // aus Wissensbasis, sonst aus gespeichertem Snapshot (z.B. Tageslektion)
  var k=komAufg(key); if(k) return k;
  var st=U.aufg[key];
  if(st && st.snap){ var parts=key.split("/");
    return {rec:{fachKey:parts[0]||"lektion", fach:st.fach||"Tageslektion", thema:{id:parts[1]||"lektion", titel:st.thema||"Tageslektion"}}, a:st.snap}; }
  return null;
}
function dueList(){  // faellige Aufgaben (Fehler-Queue / Spaced Repetition) — aus der Queue
  var t=todayISO(), out=[];
  Object.keys(U.aufg).forEach(function(key){ var st=U.aufg[key];
    if(!(st && st.due && st.due<=t)) return;
    var r=resolveAufg(key); if(r) out.push({rec:r.rec, a:r.a, key:key, st:st});
  });
  out.sort(function(x,y){ return (x.st.due<y.st.due?-1:1); });
  return out;
}
function gradeAufg(key, correct, meta){
  var st = U.aufg[key] || { box:0, due:todayISO(), c:0, w:0 };
  if(correct){ st.c++; st.box=Math.min(st.box+1,5); st.due=addDaysISO(todayISO(), LEITNER[st.box]); }
  else       { st.w++; st.box=0;                     st.due=addDaysISO(todayISO(), 1); } /* morgen erneut */
  st.last=todayISO();
  // Aufgaben ausserhalb der Wissensbasis (Tageslektion) mit Inhalt sichern,
  // damit sie in „Wiederholen" rekonstruiert werden koennen.
  if(meta && meta.a && !komAufg(key)){ st.snap=meta.a; st.fach=meta.fach||st.fach; st.thema=meta.thema||st.thema; }
  U.aufg[key]=st; saveU();
}

/* ── Data load ─────────────────────────────────────────────────────────── */
function boot(){
  loadU();
  fetch(CFG.DATA_URL, {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
  }).then(function(j){
    DATA=j; buildIndex(); renderNav(); route();
  }).catch(function(e){
    document.getElementById("app").innerHTML =
      '<div class="empty"><div class="ic">⚠️</div><p>Wissensbasis konnte nicht geladen werden.<br><span class="muted">'+esc(e.message)+'</span></p></div>';
  });
}

/* ── Navigation ────────────────────────────────────────────────────────── */
var NAV = [
  {h:"#/dashboard",  ic:"◆", l:"Übersicht"},
  {h:"#/themen",     ic:"❏", l:"Themen"},
  {h:"#/wiederholen",ic:"↻", l:"Wiederholen"},
  {h:"#/lektion",    ic:"☀", l:"Tageslektion"},
  {h:"#/buecher",    ic:"▤", l:"Lehrbücher"},
  {h:"#/fortschritt",ic:"▰", l:"Fortschritt"},

/* ── SVG-Grafiken (generiert) ──────────────────────────────────────────── */
function ring(pct, size){
  size=size||46; var r=(size/2)-5, c=2*Math.PI*r, off=c*(1-pct);
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--panel2)" stroke-width="5"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="5" '
    +'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '
    +'transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    +'<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*0.26)+'" '
    +'font-weight="700" fill="var(--text)">'+Math.round(pct*100)+'</text></svg>';
}
function barsSVG(items){ // [{label,value,max,color}]
  var w=100, bh=22, gap=10, h=items.length*(bh+gap);
  var max=Math.max.apply(null, items.map(function(i){return i.max||1;}).concat([1]));
  var y=0, rows=items.map(function(i){
    var bw=(i.max? (i.value/ (max)) :0)*70;
    var row='<g transform="translate(0,'+y+')">'
      +'<text x="0" y="'+(bh*0.7)+'" font-size="9" fill="var(--muted)">'+esc(i.label)+'</text>'
      +'<rect x="0" y="'+(bh-7)+'" width="70" height="6" rx="3" fill="var(--panel2)"/>'
      +'<rect x="0" y="'+(bh-7)+'" width="'+bw.toFixed(1)+'" height="6" rx="3" fill="'+(i.color||"var(--accent)")+'"/>'
      +'<text x="72" y="'+(bh-1)+'" font-size="9" fill="var(--text)">'+i.value+'</text></g>';
    y+=bh+gap; return row;
  }).join("");
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMinYMin meet">'+rows+'</svg>';
}
function schwierChip(s){ var c=s==="leicht"?"leicht":(s==="schwer"?"schwer":"mittel"); return '<span class="chip '+c+'">'+esc(s||"–")+'</span>'; }

/* Ermittelt den Index der korrekten Option. Deckt die uneinheitlichen
   loesung-Formate der Wissensbasis ab: blosser Buchstabe ("B"), "Antwort B.",
   "Option 1", Label-Prefix ("B) James Watt") und exakten/Teil-Text. */
function correctIndex(a){
  var opts=a.optionen||[]; if(!opts.length) return -1;
  var loes=String(a.loesung==null?"":a.loesung).trim();
  function byLetter(L){ L=L.toUpperCase();
    for(var i=0;i<opts.length;i++){ var ml=String(opts[i]).match(/^\s*([A-Ha-h])[).]/); if(ml&&ml[1].toUpperCase()===L) return i; }
    var bi=L.charCodeAt(0)-65; return (bi>=0&&bi<opts.length)?bi:-1; }
  var mLetter=loes.match(/^([A-Ha-h])[).:\s]*$/);                 // "B" / "B)" / "B."
  if(mLetter){ var r=byLetter(mLetter[1]); if(r>=0) return r; }
  var mWord=loes.match(/(?:antwort|option|variante)\s*([A-Ha-h])\b/i); // "Antwort B."
  if(mWord){ var r2=byLetter(mWord[1]); if(r2>=0) return r2; }
  var nl=normAns(loes);
  for(var i=0;i<opts.length;i++){ if(normAns(opts[i])===nl) return i; }   // exakter Text
  var mLead=loes.match(/^\s*([A-Ha-h])[).]/);                     // "B) James Watt"
  if(mLead){ var r3=byLetter(mLead[1]); if(r3>=0) return r3; }
  var mIdx=loes.match(/(?:option|antwort|variante)\s*(\d+)/i);    // "Option 1"
  if(mIdx){ var idx=parseInt(mIdx[1],10)-1; if(idx>=0&&idx<opts.length) return idx; }
  var best=-1,bestLen=0;                                          // spezifischster Teil-Text
  for(var i=0;i<opts.length;i++){ var no=normAns(opts[i]); if(no.length<5) continue;
    if(nl.indexOf(no)>=0||no.indexOf(nl)>=0){ if(no.length>bestLen){bestLen=no.length;best=i;} } }
  return best;
}

  var due=dueList();
  if(!due.length){ app.innerHTML='<div class="pagehead"><h1>Wiederholen</h1></div>'
    +'<div class="empty"><div class="ic">✓</div><p>Nichts fällig. Falsch beantwortete Aufgaben kehren am nächsten Tag hierher zurück (Spaced Repetition).</p>'
    +'<div class="btnrow" style="justify-content:center;margin-top:14px"><a class="btn" href="#/themen">Themen üben</a></div></div>'; return; }
  var html='<div class="pagehead"><h1>Wiederholen</h1><p>'+due.length+' fällige Aufgabe(n) — inkl. deiner früheren Fehler.</p></div>';
  html+='<div class="card" style="text-align:center;padding:26px"><div style="font-size:15px;margin-bottom:14px">Bereit für '+due.length+' Aufgaben?</div>'
    +'<button class="btn primary" data-action="quiz-due">↻ Wiederholung starten</button></div>';
  // Vorschau
  html+='<div class="section-title">Fällig</div><div class="grid g-cards">';
  due.slice(0,9).forEach(function(d){
    html+='<div class="card tcard"><div class="kap">'+esc(d.rec.fach)+'</div><h3 style="font-size:14px">'+esc(d.rec.thema.titel)+'</h3>'
      +'<div class="meta">'+schwierChip(d.a.schwierigkeit)+'<span class="badge due">Box '+d.st.box+'</span></div></div>';
  });
  html+='</div>';
  app.innerHTML=html;

function viewLektion(app){
  app.innerHTML='<div class="pagehead"><h1>Tägliche Lektion</h1></div><div class="empty"><div class="spin"></div><p>Lektion wird geladen …</p></div>';
  fetch(CFG.LESSON_URL, {cache:"no-store"}).then(function(r){
    if(r.status===404) return null; if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
  }).then(function(lesson){
    if(!lesson){ return renderLektionEmpty(app); }
    var html='<div class="pagehead"><h1>'+esc(lesson.titel||"Tageslektion")+'</h1><p>'+esc(fmtDate(lesson.datum||todayISO()))
      +(lesson.fach?' · '+esc(lesson.fach):'')+'</p></div>';
    if(lesson.intro) html+='<div class="card prose" style="margin-bottom:14px">'+esc(lesson.intro)+'</div>';
    var nf=(lesson.fragen||[]).length;
    if(!nf){ html+='<div class="empty"><p>Diese Lektion enthält keine Fragen.</p></div>'; app.innerHTML=html; return; }
    html+='<div class="card" style="text-align:center;padding:26px"><div style="font-size:15px;margin-bottom:6px">'+nf+' Frage(n) für heute</div>'
      +'<p class="muted" style="margin:0 0 14px">Falsch beantwortete Fragen wandern automatisch in die Wiederholungs-Queue.</p>'
      +'<button class="btn primary" data-action="quiz-lesson">Lektion starten</button></div>';
    if(U.lesson.doneDates[todayISO()]) html+='<div class="badge ok" style="margin-top:12px">✓ Heute bereits erledigt</div>';
    app.innerHTML=html;
    window.__lesson=lesson;
  }).catch(function(e){
    app.innerHTML='<div class="pagehead"><h1>Tägliche Lektion</h1></div>'
      +'<div class="empty"><div class="ic">⚠️</div><p>Lektion konnte nicht geladen werden.<br><span class="muted">'+esc(e.message)+'</span></p></div>';
  });
}
function renderLektionEmpty(app){
  app.innerHTML='<div class="pagehead"><h1>Tägliche Lektion</h1></div>'
    +'<div class="empty"><div class="ic">☀</div><p>Für heute liegt noch keine Lektion bereit.</p>'
    +'<p class="muted" style="max-width:520px;margin:10px auto 0;font-size:13px">Der n8n-Workflow „BM Tageslektion" schreibt die Lektion per <span class="mono">PUT</span> nach '
    +'<span class="mono">/.netlify/functions/blob-put?key=quantus-tageslektion</span>. Sobald das geschehen ist, erscheint sie hier.</p></div>';
}

function viewFortschritt(app){
  var totalT=IDX.themen.length;
  var overall=IDX.themen.reduce(function(s,r){return s+themaMastery(r);},0)/(totalT||1);
  var totalA=0,seenA=0,boxSum=0;
  IDX.themen.forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ totalA++;
    var st=U.aufg[aufgKey(r.fachKey,r.thema.id,a.id)]; if(st){seenA++; boxSum+=st.box;} }); });
  var due=dueList().length;
  var html='<div class="pagehead"><h1>Fortschritt</h1><p>Dein Lernstand über alle Fächer.</p></div>';
  html+='<div class="grid g-stats">'
    +statCard(Math.round(overall*100)+'%','Gesamt-Beherrschung',true)
    +statCard(seenA+' / '+totalA,'Aufgaben bearbeitet')
    +statCard(due,'fällig')
    +statCard(IDX.themen.filter(function(r){return themaMastery(r)>=0.8;}).length,'Themen gemeistert (≥80%)')
    +'</div>';
  html+='<div class="section-title">Beherrschung nach Fach</div>';
  html+='<div class="card"><div style="display:flex;flex-direction:column;gap:14px">';
  DATA.faecher.forEach(function(f){ var m=fachMastery(f.key);
    html+='<div style="display:flex;align-items:center;gap:12px">'
      +'<div style="width:150px;font-size:13.5px">'+esc(f.fach)+'</div>'
      +'<div class="bar" style="height:9px"><span style="width:'+(m*100).toFixed(0)+'%"></span></div>'
      +'<div class="mono" style="width:44px;text-align:right;font-size:12.5px">'+Math.round(m*100)+'%</div></div>';
  });
  html+='</div></div>';
  // Themen mit Zieldatum
  var goals=IDX.themen.filter(function(r){return U.goals[r.key];})
    .sort(function(a,b){return (U.goals[a.key]<U.goals[b.key]?-1:1);});
  if(goals.length){
    html+='<div class="section-title">Zieldaten</div><div class="grid g-cards">';
    goals.forEach(function(r){ var d=U.goals[r.key], du=daysUntil(d);
      html+='<div class="card click tcard" data-action="go" data-h="#/thema/'+encodeURIComponent(r.fachKey)+'/'+encodeURIComponent(r.thema.id)+'">'
        +'<div class="kap">'+esc(r.fach)+'</div><h3 style="font-size:14px">'+esc(r.thema.titel)+'</h3>'
        +'<div class="meta"><span class="badge '+(du!=null&&du<0?'due':du!=null&&du<=3?'due':'warn')+'">'+(du<0?'überfällig':du===0?'heute':'in '+du+' T')+'</span>'
        +'<span class="muted" style="font-size:12px">'+fmtDate(d)+'</span></div></div>';
    });
    html+='</div>';
  }
  app.innerHTML=html;
}

/* ── KI-Chat ───────────────────────────────────────────────────────────── */
function viewChat(app){
  var opts='<option value="">Allgemein (BM-Coach)</option>'+IDX.themen.map(function(r){
    return '<option value="'+esc(r.key)+'">'+esc(r.fach)+' · '+esc(r.thema.titel)+'</option>'; }).join("");
  var html='<div class="pagehead"><h1>KI-Chat</h1><p>Fragen zu den Themen — gegründet auf deiner Wissensbasis.</p></div>';
  html+='<div class="card" style="margin-bottom:12px"><label class="fld">Kontext-Thema (optional — die KI antwortet dann gezielt dazu)</label>'
    +'<select id="chat-ctx">'+opts+'</select></div>';
  html+='<div class="chatwrap"><div class="chatlog" id="chatlog"></div>'
    +'<div class="chatform"><textarea id="chat-input" placeholder="Frage zur BM-Prüfung stellen …" data-action="chat-key"></textarea>'
    +'<button class="btn primary" data-action="chat-send">Senden</button></div></div>';
  app.innerHTML=html;
  renderChatLog();
}
function renderChatLog(){
  var log=document.getElementById("chatlog"); if(!log) return;
  if(!U.chat.length){ log.innerHTML='<div class="empty" style="margin:auto"><div class="ic">✦</div><p>Stelle eine Frage zu einem Thema — z.B. „Erkläre mir den Unterschied zwischen OR und ZGB" oder „Gib mir eine Übungsaufgabe zu Zinseszins".</p></div>'; return; }
  log.innerHTML=U.chat.map(function(m){
    var cls=m.role==="user"?"user":(m.role==="error"?"err":"ai");
    return '<div class="msg '+cls+'">'+esc(m.content)+'</div>';
  }).join("");
  log.scrollTop=log.scrollHeight;
}
function chatSend(){
  if(chatBusy) return;
  var inp=document.getElementById("chat-input"); if(!inp) return;
  var text=(inp.value||"").trim(); if(!text) return;
  var ctxKey=(document.getElementById("chat-ctx")||{}).value||"";
  inp.value=""; U.chat.push({role:"user", content:text}); saveU(); renderChatLog();

  var sys="Du bist ein hilfreicher, praeziser Lerncoach fuer die Schweizer Berufsmaturitaets-Pruefung (BM, Ausrichtung Wirtschaft und Dienstleistungen). "
    +"Antworte auf Deutsch in Schweizer Rechtschreibung (kein scharfes s, nutze ss). Sei konkret, strukturiert und pruefungsnah. "
    +"Wenn du eine Uebungsaufgabe gibst, nenne am Ende die Loesung.";
  var rec=IDX.byKey[ctxKey];
  if(rec){ sys+="\n\nKontext-Thema: „"+rec.thema.titel+"\" (Fach "+rec.fach+").\nTheorie dazu:\n"+(rec.thema.theorie||"")
    +((rec.thema.merksaetze||[]).length?"\nMerksaetze: "+rec.thema.merksaetze.join("; "):""); }

  var msgs=U.chat.filter(function(m){return m.role==="user"||m.role==="assistant";})
    .slice(-10).map(function(m){return {role:m.role, content:m.content};});

  chatBusy=true;
  var btn=document.querySelector('[data-action="chat-send"]'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  // Platzhalter „tippt"
  U.chat.push({role:"assistant", content:"…"}); renderChatLog(); U.chat.pop();

  fetch(CFG.CHAT_URL, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ system:sys, messages:msgs, max_tokens:1024 }) })
  .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; }); })
  .then(function(res){
    if(!res.ok){
      var m=res.j&&res.j.message?res.j.message:("Fehler "+res.status);
      if(res.j && res.j.error==="not_configured"){
        m="KI-Chat ist noch nicht konfiguriert. Der Owner muss in Netlify die Umgebungsvariable ANTHROPIC_API_KEY setzen (Site settings → Environment variables) und neu deployen.";
      }
      U.chat.push({role:"error", content:m});
    } else {
      U.chat.push({role:"assistant", content:(res.j.text||"(keine Antwort)")});
    }
    saveU(); renderChatLog();
  })
  .catch(function(e){ U.chat.push({role:"error", content:"Netzwerkfehler: "+e.message}); saveU(); renderChatLog(); })
  .finally(function(){ chatBusy=false; var b=document.querySelector('[data-action="chat-send"]'); if(b){ b.disabled=false; b.textContent="Senden"; } });
}

/* ── Event-Delegation (data-action) ────────────────────────────────────── */
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action");
  var app=document.getElementById("app");
  switch(a){
    case "theme": {
      var light=document.documentElement.classList.toggle("theme-light");
      document.documentElement.classList.toggle("theme-dark",!light);
      try{ localStorage.setItem("quantus_themeMode", light?"light":"dark"); }catch(x){}
      break;
    }
    case "go": location.hash=el.getAttribute("data-h"); break;
    case "goal-save": {
      var k=el.getAttribute("data-key"), v=(document.getElementById("goal-input")||{}).value||"";
      if(v){ U.goals[k]=v; } else { delete U.goals[k]; } saveU(); toast("Zieldatum gespeichert"); route(); break;
    }
    case "goal-clear": { delete U.goals[el.getAttribute("data-key")]; saveU(); toast("Zieldatum entfernt"); route(); break; }
    case "quiz-thema": { quiz=buildQuizFromThema(el.getAttribute("data-key")); if(quiz&&quiz.items.length){ renderQuiz(app); } else { toast("Keine Aufgaben vorhanden"); } break; }
    case "quiz-due":   { quiz=buildQuizFromDue(); if(quiz.items.length) renderQuiz(app); else toast("Nichts fällig"); break; }
    case "quiz-lesson":{ if(window.__lesson){ quiz=buildQuizFromLesson(window.__lesson); U.lesson.doneDates[todayISO()]=true; saveU(); renderQuiz(app); } break; }
    case "quiz-mc": { quiz.chosen=parseInt(el.getAttribute("data-i"),10); quiz.revealed=true; renderQuiz(app); break; }
    case "quiz-reveal": { quiz.revealed=true; renderQuiz(app); break; }
    case "quiz-grade": {
      var ok=el.getAttribute("data-ok")==="1";
      var it=quiz.items[quiz.idx];
      if(it && it.key) gradeAufg(it.key, ok, {a:it.a, fach:(it.rec&&it.rec.fach)||it.fach, thema:(it.rec&&it.rec.thema&&it.rec.thema.titel)});
      if(ok) quiz.results.correct++; else quiz.results.wrong++;
      quiz.idx++; quiz.revealed=false; quiz.chosen=null; renderQuiz(app); break;
    }
    case "quiz-quit": quiz=null; break; // Link navigiert selbst
    case "chat-send": chatSend(); break;
  }
});
/* Notiz-Autosave + Chat-Enter */
var noteTimer=null;
document.addEventListener("input", function(e){
  var el=e.target;
  if(el.getAttribute && el.getAttribute("data-action")==="note-input"){
    var k=el.getAttribute("data-key"), st=document.getElementById("note-status");
    if(st) st.textContent="…";
    clearTimeout(noteTimer);
    noteTimer=setTimeout(function(){ if((el.value||"").trim()){ U.notes[k]=el.value; } else { delete U.notes[k]; }
      saveU(); if(st){ st.textContent="Gespeichert · "+new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}); } }, 500);
  }
});
document.addEventListener("keydown", function(e){
  if(e.target && e.target.id==="chat-input" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); chatSend(); }
});

boot();
