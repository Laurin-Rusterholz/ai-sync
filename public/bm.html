<style>
:root{
  --surface-base:#171c20; --surface-raised:#212830; --surface-overlay:#2d3640;
  --border:#3b4550; --border2:#4f5a66; --hover:rgba(224,226,232,.08);
  --text-primary:#eef0f2; --text-muted:#929aa4;
  --accent:#45c198; --accent-deep:#2ea27b; --accent-soft:color-mix(in oklab, var(--accent) 22%, transparent);
  --on-accent:#04140d;
  --danger:#e5765a; --warning:#e3b048; --success:#45c198; --info:#6aa3de; --violet:#a78bfa; --coral:#d96c57;
  --bg:var(--surface-base); --panel:var(--surface-raised); --panel2:var(--surface-overlay);
  --muted:var(--text-muted); --text:var(--text-primary); --text2:#cccfd5;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.26);
  --shadow-lg:0 8px 22px rgba(0,0,0,.36),0 22px 56px rgba(0,0,0,.32);
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --mono:ui-monospace,SF Mono,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,SF Pro Text,Helvetica Neue,Arial,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --transition:all .16s cubic-bezier(.25,.1,.25,1);
}
html.theme-light{
  --surface-base:#e7e1d4; --surface-raised:#f2ece0; --surface-overlay:#f8f3e9;
  --border:#cdc4b1; --border2:#b3a892; --hover:rgba(30,30,25,.055);
  --text-primary:#232019; --text-muted:#6b6353;
  --accent:#1f8a66; --accent-deep:#166b4f; --on-accent:#f7f5ef; --violet:#7c5cd6;
  --shadow:0 1px 2px rgba(80,70,50,.12),0 6px 18px rgba(80,70,50,.10);
  --shadow-lg:0 10px 26px rgba(80,70,50,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
a{color:inherit;text-decoration:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .hidden{display:none!important}
.accentc{color:var(--accent)} .dangerc{color:var(--danger)} .warnc{color:var(--warning)}

.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:color-mix(in oklab,var(--surface-raised) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tb-back{display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-size:13px}
.tb-back:hover{background:var(--hover);color:var(--text)}
.tb-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.tb-brand img{width:18px;height:18px}
.tb-brand small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.tb-spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 8px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;gap:5px}
.tb-btn:hover{background:var(--hover);border-color:var(--border2)}
.tb-btn.on{border-color:var(--accent);color:var(--accent)}

.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-base);position:sticky;top:51px;z-index:35}
.nav::-webkit-scrollbar{height:0}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--text);border-color:color-mix(in oklab,var(--accent) 45%,transparent)}

.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.pagehead{margin:2px 0 18px}
.pagehead h1{font-family:var(--serif);font-size:25px;font-weight:700}
.pagehead p{margin:5px 0 0;color:var(--muted);font-size:14px}

.grid{display:grid;gap:14px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-charts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.pad-sm{padding:13px}
.card.click{cursor:pointer;transition:var(--transition)}
.card.click:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.stat .n{font-size:26px;font-weight:700;font-family:var(--serif);line-height:1}
.stat .l{color:var(--muted);font-size:12px;margin-top:5px}
.stat .n.accent{color:var(--accent)}
.section-title{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:14px;font-weight:600}
.section-title .sp{flex:1}
.fach-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.fach-head h2{font-family:var(--serif);font-size:19px}
.fach-head .cnt{color:var(--muted);font-size:12.5px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{background:var(--accent-soft);color:var(--text);border-color:transparent}
.badge.warn{background:color-mix(in oklab,var(--warning) 24%,transparent);color:var(--text);border-color:transparent}
.badge.due{background:color-mix(in oklab,var(--danger) 26%,transparent);color:var(--text);border-color:transparent}
.badge.info{background:color-mix(in oklab,var(--info) 22%,transparent);color:var(--text);border-color:transparent}
.chip{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted)}
.chip.leicht{color:var(--success)} .chip.mittel{color:var(--warning)} .chip.schwer{color:var(--danger)}

.tcard{display:flex;flex-direction:column;gap:8px}
.tcard .kap{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tcard h3{font-size:15px;font-weight:600}
.tcard .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}

.bar{height:7px;border-radius:999px;background:var(--panel2);overflow:hidden;flex:1;min-width:50px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:999px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px;font-weight:500;transition:var(--transition);text-decoration:none}
.btn:hover{background:var(--hover);border-color:var(--border2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--accent-deep)}
.btn.violet{background:var(--violet);color:#160c2e;border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input[type=date],input[type=text],input[type=number],textarea,select{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-base);color:var(--text);font-family:inherit;font-size:14px}
textarea{resize:vertical;min-height:90px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label.fld{display:block;margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}

/* Charts */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:64px 1fr 30px;align-items:center;gap:9px;font-size:12px}
.hbar-l{color:var(--muted)}
.hbar-t{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.hbar-f{display:block;height:100%;border-radius:999px}
.hbar-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2)}
.donut{border-radius:50%;-webkit-mask:radial-gradient(circle 10px at center,transparent 98%,#000 100%);mask:radial-gradient(circle at center,transparent 54%,#000 55%)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.boxes{display:flex;gap:5px;flex-wrap:wrap}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:14px;font-weight:700}
.box small{font-size:9px;color:var(--muted);font-weight:500}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--panel2)}
.chart-cap{font-size:11.5px;color:var(--muted);margin-bottom:9px;font-weight:600}

.prose{line-height:1.66;font-size:14.5px}
.prose h3{font-family:var(--serif);font-size:17px;margin:16px 0 6px}
.prose h4{font-size:14.5px;margin:13px 0 5px;color:var(--text)}
.prose p{margin:8px 0}
.prose ul{margin:8px 0;padding-left:20px} .prose li{margin:3px 0}
.prose code{font-family:var(--mono);font-size:.9em;background:var(--surface-base);padding:1px 5px;border-radius:5px}
.prose strong{font-weight:700}
.list-clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.list-clean li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.list-clean li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.merk{font-family:var(--mono);font-size:12.5px;background:var(--surface-base);border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin:6px 0}
.beispiel{font-family:var(--mono);font-size:12.5px;color:var(--text2)}

/* Quiz */
.quizwrap{max-width:660px;margin:0 auto}
.quizbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.q-frage{font-size:18px;font-weight:500;line-height:1.45;margin:10px 0 16px;font-family:var(--serif)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:7px 0;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;transition:var(--transition)}
.opt:hover{border-color:var(--border2);background:var(--hover)}
.opt.correct{border-color:var(--success);background:color-mix(in oklab,var(--success) 16%,transparent)}
.opt.wrong{border-color:var(--danger);background:color-mix(in oklab,var(--danger) 16%,transparent)}
.opt.chosen{border-width:2px}
.reveal{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--surface-base);border:1px solid var(--border)}
.reveal .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.reveal .los{font-size:15px;font-weight:600;margin:3px 0 8px}
.selfgrade{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}

/* Flashcard */
.flip{perspective:1200px;max-width:520px;margin:0 auto}
.flip-inner{position:relative;min-height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);box-shadow:var(--shadow)}
.flip-back{transform:rotateY(180deg);background:var(--surface-overlay)}

/* Chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:400px}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:4px 2px}
.msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55}
.msg .prose{font-size:14px}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid color-mix(in oklab,var(--accent) 40%,transparent);white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
.msg.err{align-self:stretch;max-width:100%;background:color-mix(in oklab,var(--danger) 14%,transparent);border:1px solid var(--danger);white-space:pre-wrap}
.chatform{display:flex;gap:8px;margin-top:11px;align-items:flex-end}
.chatform textarea{min-height:46px;max-height:150px}
.quickrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}

.bookframe{width:100%;height:calc(100vh - 150px);border:1px solid var(--border);border-radius:var(--radius);background:#fff}

/* Modal / toast */
.mask{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal h2{font-family:var(--serif);font-size:20px;margin-bottom:10px}
.modal .x{position:sticky;top:0;float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface-overlay);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .2s ease}
.toast.err{border-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty .ic{font-size:32px;opacity:.7}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tracklane{position:relative;height:12px;border-radius:999px;background:var(--panel2);overflow:hidden}
.tracklane>.fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
.tracklane>.mark{position:absolute;top:-4px;width:2px;height:20px;background:var(--warning)}
@media (max-width:560px){ .wrap{padding:16px 12px 90px} .tb-brand small{display:none} .pagehead h1{font-size:21px} .hbar{grid-template-columns:56px 1fr 26px} }
</style>
</head>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   Quantus · BM-Prüfung — Prüfungscoach (Single-File, kein Build-Step)
   Speicherung: Firebase RTDB (REST, Namespace „bmpruefung", offene Rules)
   Curriculum:  /theorie/kompendium.json
   KI:          in Quantus hinterlegter Anthropic-Key (direkt) oder n8n-Webhook
   Tageslektion: Firebase bmpruefung/lessons/<datum> (vom n8n-Workflow geschrieben)
   ═══════════════════════════════════════════════════════════════════════ */
var CFG = {
  DATA_URL:  "theorie/kompendium.json",

  FB:        "https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app",

  // KI läuft über den in Quantus hinterlegten Anthropic-Key (direkt) ODER über n8n.
  WEBHOOK_BASE: "https://n8n.srv1757990.hstgr.cloud/webhook",
  WEBHOOK_KEY:  "qns_pdf_9f3k2m8x7q1zvb4p",
  WH_CHAT:      "quantus-bm-chat",
  CACHE:     "quantus_bm_cache_v2",
};
var LEITNER=[1,2,4,7,14,30];          // Tage bis naechste Faelligkeit je Box
var MASTER=0.6;                        // Beherrschungs-Schwelle „gemeistert"

/* ── Utils ─────────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysISO(iso,n){ var d=iso?new Date(iso+"T00:00:00"):new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; try{ return new Date(iso+"T00:00:00").toLocaleDateString("de-CH",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return iso; } }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function daysUntil(iso){ return iso?daysBetween(todayISO(),iso):null; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function toast(msg,err){ var t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg; document.getElementById("toast").appendChild(t); setTimeout(function(){t.remove();},2800); }
function fbKey(k){ return String(k).replace(/[.#$\[\]\/]/g,"_"); }
function normAns(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^\s*(option\s*\d+\s*[:.)-]*|[a-h][.)])\s*/i,"").replace(/[«»"'`]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
/* Mini-Markdown (sicher: erst escapen, dann simple Muster) */
function md(text){
  var t=esc(text||"");
  t=t.replace(/^######?\s?/gm,"").replace(/^#{1,5}\s*(.+)$/gm,function(m,x){return "<h4>"+x+"</h4>";});
  t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  var lines=t.split(/\n/), out=[], inList=false;
  lines.forEach(function(ln){
    if(/^\s*[-•]\s+/.test(ln)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+ln.replace(/^\s*[-•]\s+/,"")+"</li>"); }
    else if(/^\s*\d+\.\s+/.test(ln)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+ln.replace(/^\s*\d+\.\s+/,"")+"</li>"); }
    else { if(inList){out.push("</ul>");inList=false;} if(/^<h4>/.test(ln)) out.push(ln); else if(ln.trim()==="") out.push(""); else out.push("<p>"+ln+"</p>"); }
  });
  if(inList) out.push("</ul>");
  return out.join("");
}

function fbDelete(p){ return fetch(fbUrl(p),{method:"DELETE"}).then(function(r){ if(!r.ok) throw new Error("RTDB DEL "+r.status); return true; }); }

/* Persistenz: Speicher in Firebase + lokalem Cache (fire-and-forget) */
function persist(sub, data, key){
  cacheSave();
  var path = key!=null ? nsp(sub)+"/"+fbKey(key) : nsp(sub);
  var p = (data===null) ? fbDelete(path) : fbPut(path, data);

function themaKey(f,t){ return f+"/"+t; }

function buildIndex(){

/* ── Fortschritt / Mastery ─────────────────────────────────────────────── */
function themaMastery(rec){ var as=rec.thema.aufgaben||[]; if(!as.length) return 0; var s=0;
  as.forEach(function(a){ var st=U.aufg[aufgKey(rec.fachKey,rec.thema.id,a.id)]; s+= st?Math.min(st.box,5)/5:0; }); return s/as.length; }
function themaSeen(rec){ var n=0; (rec.thema.aufgaben||[]).forEach(function(a){ if(U.aufg[aufgKey(rec.fachKey,rec.thema.id,a.id)]) n++; }); return n; }
function themaBoxes(rec){ var b=[0,0,0,0,0,0]; (rec.thema.aufgaben||[]).forEach(function(a){ var st=U.aufg[aufgKey(rec.fachKey,rec.thema.id,a.id)]; b[st?Math.min(st.box,5):0]++; }); return b; }
function fachMastery(fk){ var r=IDX.themen.filter(function(x){return x.fachKey===fk;}); if(!r.length) return 0; var s=0; r.forEach(function(x){s+=themaMastery(x);}); return s/r.length; }
function masteredCount(){ return IDX.themen.filter(function(r){return themaMastery(r)>=MASTER;}).length; }

/* ── Lernplan / Pacing ─────────────────────────────────────────────────── */
function plan(){
  var ex=U.config.examDate, total=IDX.themen.length, done=masteredCount();
  if(!ex){ return {set:false, total:total, done:done}; }
  var start=U.config.planStart||todayISO();
  var daysLeft=Math.max(0, daysUntil(ex));
  var span=Math.max(1, daysBetween(start,ex));
  var elapsed=clamp(daysBetween(start,todayISO())/span,0,1);
  var shouldMaster=Math.round(total*elapsed);
  var perDay=daysLeft>0?Math.ceil((total-done)/daysLeft):(total-done);
  // heutige Themen: naechste unmasterte in Curriculum-Reihenfolge
  var todayTopics=IDX.order.filter(function(r){return themaMastery(r)<MASTER;}).slice(0, Math.max(1,perDay));
  // Projektion: Tempo aus Aktivitaet (gemeisterte/Tag grob) — hier einfache Prognose
  var behind=done-shouldMaster;
  return {set:true, examDate:ex, total:total, done:done, daysLeft:daysLeft, shouldMaster:shouldMaster,
    delta:behind, onTrack:behind>=0, perDay:perDay, todayTopics:todayTopics, remaining:total-done};
}

/* ── Spaced Repetition ─────────────────────────────────────────────────── */
function komAufg(key){ var p=key.split("/"); if(p.length<3) return null; var a=p.pop(),t=p.pop(),f=p.join("/");
  var rec=IDX.byKey[f+"/"+t]; if(!rec) return null; var x=(rec.thema.aufgaben||[]).filter(function(z){return String(z.id)===a;})[0];
  return x?{rec:{fachKey:rec.fachKey,fach:rec.fach,thema:rec.thema},a:x}:null; }
function resolveAufg(key){ var k=komAufg(key); if(k) return k; var st=U.aufg[key];
  if(st&&st.snap){ var p=key.split("/"); return {rec:{fachKey:p[0]||"lektion",fach:st.fach||"Tageslektion",thema:{id:p[1]||"lektion",titel:st.thema||"Tageslektion"}},a:st.snap}; } return null; }
function dueList(){ var t=todayISO(),out=[]; Object.keys(U.aufg).forEach(function(key){ var st=U.aufg[key];
  if(!(st&&st.due&&st.due<=t)) return; var r=resolveAufg(key); if(r) out.push({rec:r.rec,a:r.a,key:key,st:st}); });
  out.sort(function(x,y){return x.st.due<y.st.due?-1:1;}); return out; }
function gradeAufg(key,correct,meta){
  var st=U.aufg[key]||{box:0,due:todayISO(),c:0,w:0};
  if(correct){ st.c++; st.box=Math.min(st.box+1,5); st.due=addDaysISO(todayISO(),LEITNER[st.box]); }
  else       { st.w++; st.box=0;                     st.due=addDaysISO(todayISO(),1); }  /* falsch → morgen erneut */
  st.last=todayISO();
  if(meta&&meta.a&&!komAufg(key)){ st.snap=meta.a; st.fach=meta.fach||st.fach; st.thema=meta.thema||st.thema; }
  U.aufg[key]=st; saveAufg(key); recordActivity(correct);
}
function correctIndex(a){
  var opts=a.optionen||[]; if(!opts.length) return -1;
  var loes=String(a.loesung==null?"":a.loesung).trim();
  function byLetter(L){ L=L.toUpperCase(); for(var i=0;i<opts.length;i++){ var ml=String(opts[i]).match(/^\s*([A-Ha-h])[).]/); if(ml&&ml[1].toUpperCase()===L) return i; } var bi=L.charCodeAt(0)-65; return (bi>=0&&bi<opts.length)?bi:-1; }
  var mL=loes.match(/^([A-Ha-h])[).:\s]*$/); if(mL){ var r=byLetter(mL[1]); if(r>=0) return r; }
  var mW=loes.match(/(?:antwort|option|variante)\s*([A-Ha-h])\b/i); if(mW){ var r2=byLetter(mW[1]); if(r2>=0) return r2; }
  var nl=normAns(loes); for(var i=0;i<opts.length;i++){ if(normAns(opts[i])===nl) return i; }
  var mLd=loes.match(/^\s*([A-Ha-h])[).]/); if(mLd){ var r3=byLetter(mLd[1]); if(r3>=0) return r3; }
  var mI=loes.match(/(?:option|antwort|variante)\s*(\d+)/i); if(mI){ var idx=parseInt(mI[1],10)-1; if(idx>=0&&idx<opts.length) return idx; }
  var best=-1,bl=0; for(var i=0;i<opts.length;i++){ var no=normAns(opts[i]); if(no.length<5) continue; if(nl.indexOf(no)>=0||no.indexOf(nl)>=0){ if(no.length>bl){bl=no.length;best=i;} } }
  return best;
}

/* ── KI ─────────────────────────────────────────────────────────────────
   Transport: 1) der in Quantus (gleiche Origin) hinterlegte Anthropic-Key →
   direkter Aufruf der Anthropic API; 2) sonst der n8n-Webhook (x-quantus-key,
   Key liegt serverseitig im n8n-Credential). Kein Key im Code, kein Netlify-Env. */
function storedAnthropicKey(){
  function pick(o){ if(!o||typeof o!=="object") return ""; return o.anthropicApiKey||o.claudeApiKey||(o._settings&&(o._settings.anthropicApiKey||o._settings.claudeApiKey))||(o.settings&&(o.settings.anthropicApiKey||o.settings.claudeApiKey))||""; }
  var k="";
  try{ k=pick(JSON.parse(localStorage.getItem("mgmt-v4-settings")||"null")); }catch(e){}
  if(!k){ try{ k=pick(JSON.parse(localStorage.getItem("mgmt-v4-data")||"null")); }catch(e){} }
  return String(k||"").replace(/[\s ​-‍﻿]/g,"");
}
function aiModel(){ return U.config.aiModel || "claude-opus-4-8"; }
function callAnthropicDirect(system,messages,mt,key){
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:aiModel(),max_tokens:mt,system:system,messages:messages})})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error((j&&j.error&&j.error.message)||("Anthropic HTTP "+r.status));
      return Array.isArray(j.content)?j.content.filter(function(b){return b&&b.type==="text";}).map(function(b){return b.text;}).join("").trim():""; }); });
}
function callAIviaN8n(system,messages,mt){
  return fetch(CFG.WEBHOOK_BASE+"/"+CFG.WH_CHAT,{method:"POST",headers:{"content-type":"application/json","x-quantus-key":CFG.WEBHOOK_KEY},
    body:JSON.stringify({system:system,messages:messages,max_tokens:mt})})
    .then(function(r){ if(!r.ok) throw new Error("n8n-Webhook HTTP "+r.status); return r.text(); })
    .then(function(txt){ try{ var j=JSON.parse(txt); return j.text||j.output||j.answer||(Array.isArray(j.content)?j.content.map(function(b){return b.text||"";}).join(""):txt); }catch(e){ return txt; } });
}
function callAI(system, messages, maxTokens){
  var mt=maxTokens||1024, key=storedAnthropicKey();
  if(key) return callAnthropicDirect(system,messages,mt,key).catch(function(){ return callAIviaN8n(system,messages,mt); });
  return callAIviaN8n(system,messages,mt).catch(function(){
    throw new Error("Keine KI verfügbar. Trage in Quantus (Einstellungen → API-Keys) deinen Anthropic-Key ein — die BM-App nutzt ihn automatisch — oder richte den n8n-Webhook quantus-bm-chat ein."); });
}

function ring(pct,size){ size=size||64; var r=(size/2)-6,c=2*Math.PI*r,off=c*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block">'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--panel2)" stroke-width="6"/>'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
   +'<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*0.28)+'" font-weight="700" fill="var(--text)">'+Math.round(pct*100)+'</text></svg>'; }
function hbars(items){ var max=Math.max.apply(null,[1].concat(items.map(function(i){return i.max||i.value||0;})));
  return '<div class="hbars">'+items.map(function(i){ return '<div class="hbar"><span class="hbar-l">'+esc(i.label)+'</span>'
    +'<span class="hbar-t"><span class="hbar-f" style="width:'+(100*((i.value||0)/max)).toFixed(0)+'%;background:'+(i.color||"var(--accent)")+'"></span></span>'
    +'<span class="hbar-v">'+(i.value||0)+'</span></div>'; }).join("")+'</div>'; }
function donut(segs,size){ size=size||96; var tot=segs.reduce(function(s,x){return s+x.value;},0);
  if(!tot) return '<div class="donut" style="width:'+size+'px;height:'+size+'px;background:var(--panel2)"></div>';
  var acc=0,stops=segs.map(function(s){ var a=acc/tot*360; acc+=s.value; return s.color+" "+a.toFixed(1)+"deg "+(acc/tot*360).toFixed(1)+"deg"; }).join(",");
  return '<div class="donut" style="width:'+size+'px;height:'+size+'px;background:conic-gradient('+stops+')"></div>'; }
function legend(items){ return '<div class="legend">'+items.filter(function(i){return i.value;}).map(function(i){return '<span><i style="background:'+i.color+'"></i>'+esc(i.label)+' '+i.value+'</span>';}).join("")+'</div>'; }
function boxesViz(b){ return '<div class="boxes">'+b.map(function(n,i){ return '<div class="box" title="Box '+i+'">'+n+'<small>B'+i+'</small></div>'; }).join("")+'</div>'; }
function heatmap(days){ // letzte ~84 Tage

    out+='<i title="'+d+': '+(a?a.a+" Aufgaben":"–")+'" style="background:'+col+'"></i>'; }
  return out+'</div>'; }

function makeItem(rec,a){ return {rec:rec,a:a,key:aufgKey(rec.fachKey,rec.thema.id,a.id)}; }
function buildQuizFromThema(key){ var rec=IDX.byKey[key]; if(!rec) return null;
  return {title:rec.thema.titel,items:(rec.thema.aufgaben||[]).map(function(a){return makeItem(rec,a);}),idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/thema/"+encodeURIComponent(rec.fachKey)+"/"+encodeURIComponent(rec.thema.id)}; }
function buildQuizFromDue(){ var d=dueList(); return {title:"Fällige Wiederholungen",items:d.map(function(x){return {rec:x.rec,a:x.a,key:x.key};}),idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/wiederholen"}; }
function buildQuizWeak(){ var items=[]; IDX.themen.filter(function(r){return themaSeen(r)>0&&themaMastery(r)<MASTER;}).forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ items.push(makeItem(r,a)); }); });
  return {title:"Schwache Themen üben",items:shuffle(items).slice(0,25),idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/wiederholen"}; }
function buildQuizDifficulty(level){ var items=[]; IDX.themen.forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ if(a.schwierigkeit===level) items.push(makeItem(r,a)); }); });
  return {title:"Übung: "+level,items:shuffle(items).slice(0,20),idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/wiederholen"}; }
function buildQuizSim(n){ var items=[]; IDX.themen.forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ items.push(makeItem(r,a)); }); });
  return {title:"Prüfungssimulation",items:shuffle(items).slice(0,n||25),idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/simulation",sim:true,started:Date.now()}; }
function buildQuizFromLesson(lesson){ var items=(lesson.fragen||[]).map(function(a,i){ var fk=a.fach||"lektion",tid=a.themaId||("frage"+i),id=a.id||("f"+i);
  var kr=IDX.byKey[themaKey(fk,tid)]; var rec=kr?{fachKey:kr.fachKey,fach:kr.fach,thema:kr.thema}:{fachKey:fk,fach:(IDX.fachByKey[fk]?IDX.fachByKey[fk].fach:"Tageslektion"),thema:{id:tid,titel:a.titel||lesson.titel||"Tageslektion"}};
  return {rec:rec,a:a,key:aufgKey(fk,tid,id)}; });
  return {title:lesson.titel||"Tageslektion",items:items,idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/lektion"}; }
function buildQuizTopics(recs){ var items=[]; recs.forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ items.push(makeItem(r,a)); }); });
  return {title:"Heutige Lektion",items:items,idx:0,revealed:false,chosen:null,results:{correct:0,wrong:0},backHash:"#/lektion"}; }

function renderQuiz(app){
  if(!quiz){ app.innerHTML='<div class="empty">Keine Session.</div>'; return; }
  if(quiz.idx>=quiz.items.length) return renderQuizDone(app);
  var it=quiz.items[quiz.idx],a=it.a,n=quiz.items.length,pct=(quiz.idx/n)*100;
  var isMC=a.typ==="mc"&&Array.isArray(a.optionen)&&a.optionen.length, ci=isMC?correctIndex(a):-1;
  var html='<a class="btn ghost sm" href="'+quiz.backHash+'" data-action="quiz-quit" style="margin-bottom:12px">‹ Beenden</a>';
  html+='<div class="quizwrap"><div class="quizbar"><span class="muted" style="font-size:12px">'+(quiz.idx+1)+' / '+n+'</span><div class="bar"><span style="width:'+pct+'%"></span></div><span class="chip '+(a.schwierigkeit==="leicht"?"leicht":a.schwierigkeit==="schwer"?"schwer":"mittel")+'">'+esc(a.schwierigkeit||"")+'</span></div>';
  html+='<div class="muted" style="font-size:12px">'+esc(it.rec.fach||"")+'</div><div class="q-frage">'+esc(a.frage)+'</div>';
  if(!quiz.revealed) html+='<div class="btnrow" style="margin:-4px 0 8px"><button class="btn sm" data-action="ai-hint">✦ Tipp</button></div>';
  if(isMC){ html+='<div>'+a.optionen.map(function(o,i){ var cls="opt"; if(quiz.revealed){ if(i===ci)cls+=" correct"; if(quiz.chosen===i&&i!==ci)cls+=" wrong"; if(quiz.chosen===i)cls+=" chosen"; }
      return '<button class="'+cls+'" '+(quiz.revealed?'disabled':'data-action="quiz-mc" data-i="'+i+'"')+'>'+esc(o)+'</button>'; }).join("")+'</div>'; }
  else { if(!quiz.revealed) html+='<textarea id="open-answer" placeholder="Deine Antwort (optional — für KI-Feedback) …" style="margin:6px 0"></textarea>'
      +'<div class="btnrow"><button class="btn primary" data-action="quiz-reveal">Lösung anzeigen</button><button class="btn violet" data-action="ai-grade">✦ KI bewertet meine Antwort</button></div>'; }
  if(quiz.revealed){
    html+='<div class="reveal"><div class="lbl">Lösung</div><div class="los">'+esc(a.loesung)+'</div>'+(a.erklaerung?'<div class="lbl">Erklärung</div><div class="prose" style="font-size:13.5px">'+md(a.erklaerung)+'</div>':'')+'</div>';
    if(isMC){ var auto=quiz.chosen!=null&&quiz.chosen===ci;
      html+='<div class="selfgrade"><div class="muted" style="font-size:13px;flex:1;align-self:center">'+(quiz.chosen==null?"Nicht beantwortet":(auto?"✓ Richtig gewählt":"✗ Falsch gewählt"))+'</div><button class="btn sm" data-action="quiz-grade" data-ok="1">Richtig</button><button class="btn sm" data-action="quiz-grade" data-ok="0">Falsch</button></div>'; }
    else html+='<div class="selfgrade"><button class="btn primary" style="flex:1" data-action="quiz-grade" data-ok="1">✓ Gewusst</button><button class="btn" style="flex:1" data-action="quiz-grade" data-ok="0">✗ Nicht gewusst</button></div>';
  }
  html+='</div>'; app.innerHTML=html;
}
function renderQuizDone(app){ var r=quiz.results,tot=r.correct+r.wrong,pct=tot?Math.round(r.correct/tot*100):0;
  var extra=quiz.sim?'<p class="muted">Dauer: '+Math.round((Date.now()-quiz.started)/60000)+' min · Note (grob): '+(1+5*pct/100).toFixed(1)+'</p>':'';

function viewMerksaetze(app){
  var html='<div class="pagehead"><h1>Merksätze & Formeln</h1><p>Deine kompakte Formelsammlung — alle Merksätze an einem Ort.</p></div>';
  DATA.faecher.forEach(function(f){ var any=(f.themen||[]).some(function(t){return (t.merksaetze||[]).length;}); if(!any) return;
    html+='<div class="fach-head"><h2>'+esc(f.fach)+'</h2></div>';
    (f.themen||[]).forEach(function(t){ if(!(t.merksaetze||[]).length) return;
      html+='<div class="card pad-sm" style="margin-bottom:10px"><div class="chart-cap">'+esc(t.titel)+'</div>'+t.merksaetze.map(function(x){return '<div class="merk">'+esc(x)+'</div>';}).join("")+'</div>'; });
  });
  app.innerHTML=html;
}

function viewSuche(app){
  var q=(app.getAttribute("data-q")||"");
  var html='<div class="pagehead"><h1>Suche</h1></div><div class="card" style="margin-bottom:14px"><input type="text" id="search-in" data-action="search-live" placeholder="Themen, Theorie, Aufgaben durchsuchen …" value="'+esc(q)+'" autofocus></div><div id="search-res"></div>';
  app.innerHTML=html; if(q) runSearch(q);
}
function runSearch(q){ var res=document.getElementById("search-res"); if(!res) return; q=q.trim().toLowerCase();
  if(q.length<2){ res.innerHTML='<div class="empty muted">Mindestens 2 Zeichen …</div>'; return; }
  var hits=[]; IDX.themen.forEach(function(r){ var t=r.thema; var hay=(t.titel+" "+(t.theorie||"")+" "+(t.lernziele||[]).join(" ")+" "+(t.merksaetze||[]).join(" ")).toLowerCase();
    var aufHit=(t.aufgaben||[]).filter(function(a){return (a.frage+" "+a.loesung).toLowerCase().indexOf(q)>=0;}).length;
    if(hay.indexOf(q)>=0||aufHit) hits.push({r:r,aufHit:aufHit}); });
  if(!hits.length){ res.innerHTML='<div class="empty muted">Keine Treffer.</div>'; return; }
  res.innerHTML='<div class="muted" style="font-size:12px;margin-bottom:8px">'+hits.length+' Themen</div><div class="grid g-cards">'+hits.slice(0,40).map(function(h){ return '<a class="card click tcard" href="'+themaLink(h.r)+'" style="text-decoration:none"><div class="kap">'+esc(h.r.fach)+'</div><h3 style="font-size:14px">'+esc(h.r.thema.titel)+'</h3>'+(h.aufHit?'<div class="meta"><span class="badge info">'+h.aufHit+' Aufgabe(n)</span></div>':'')+'</a>'; }).join("")+'</div>';
}

function viewFortschritt(app){
  var overall=IDX.themen.reduce(function(s,r){return s+themaMastery(r);},0)/(IDX.themen.length||1);
  var totalA=0,seenA=0; IDX.themen.forEach(function(r){ (r.thema.aufgaben||[]).forEach(function(a){ totalA++; if(U.aufg[aufgKey(r.fachKey,r.thema.id,a.id)]) seenA++; }); });
  var html='<div class="pagehead"><h1>Fortschritt</h1></div>';
  html+='<div class="grid g-stats">'+statCard(Math.round(overall*100)+"%","Beherrschung",true)+statCard(seenA+" / "+totalA,"Aufgaben bearbeitet")+statCard(dueList().length,"fällig")+statCard((U.config.streak||0)+"🔥","Streak")+'</div>';
  html+='<div class="card" style="margin-top:14px"><div class="chart-cap">Aktivität (letzte 12 Wochen)</div>'+heatmap()+'</div>';
  html+='<div class="card" style="margin-top:14px"><div class="chart-cap">Beherrschung nach Fach</div>'+hbars(DATA.faecher.map(function(f){return {label:f.fach.split(" ")[0],value:Math.round(fachMastery(f.key)*100),max:100,color:"var(--accent)"};}))+'</div>';
  app.innerHTML=html;
}

function viewChat(app){
  var opts='<option value="">Allgemein (BM-Coach)</option>'+IDX.themen.map(function(r){return '<option value="'+esc(r.key)+'">'+esc(r.fach)+' · '+esc(r.thema.titel)+'</option>';}).join("");
  app.innerHTML='<div class="pagehead"><h1>KI-Chat</h1><p>Fragen zu den Themen — gegründet auf deiner Wissensbasis.</p></div>'
    +'<div class="card" style="margin-bottom:10px"><label class="fld">Kontext-Thema (optional)</label><select id="chat-ctx">'+opts+'</select></div>'
    +'<div class="quickrow"><button class="btn sm" data-action="chat-quick" data-q="Gib mir eine Übungsaufgabe mit Lösung.">Übungsaufgabe</button><button class="btn sm" data-action="chat-quick" data-q="Erkläre das Thema in 3 Sätzen.">Kurz erklären</button><button class="btn sm" data-action="chat-quick" data-q="Was sind typische Prüfungsfragen dazu?">Prüfungsfragen</button><button class="btn sm ghost" data-action="chat-clear">Verlauf löschen</button></div>'
    +'<div class="chatwrap"><div class="chatlog" id="chatlog"></div><div class="chatform"><textarea id="chat-input" placeholder="Frage stellen …" data-action="chat-key"></textarea><button class="btn primary" data-action="chat-send">Senden</button></div></div>';
  renderChatLog();
}
function renderChatLog(){ var log=document.getElementById("chatlog"); if(!log) return;
  if(!U.chat.length){ log.innerHTML='<div class="empty" style="margin:auto"><div class="ic">✧</div><p>Stelle eine Frage — z.B. „Erkläre den Unterschied zwischen OR und ZGB".</p></div>'; return; }
  log.innerHTML=U.chat.map(function(m){ var cls=m.role==="user"?"user":(m.role==="error"?"err":"ai"); return '<div class="msg '+cls+'">'+(cls==="ai"?md(m.content):esc(m.content))+'</div>'; }).join("");
  log.scrollTop=log.scrollHeight;
}
function chatSend(text){ if(chatBusy) return; var inp=document.getElementById("chat-input"); text=text||(inp?inp.value:""); text=(text||"").trim(); if(!text) return; if(inp) inp.value="";
  var ctx=IDX.byKey[(document.getElementById("chat-ctx")||{}).value||""];
  U.chat.push({role:"user",content:text}); saveChat(); renderChatLog();
  var msgs=U.chat.filter(function(m){return m.role==="user"||m.role==="assistant";}).slice(-10).map(function(m){return {role:m.role,content:m.content};});
  chatBusy=true; var b=document.querySelector('[data-action="chat-send"]'); if(b){b.disabled=true;b.innerHTML='<span class="spin"></span>';}
  callAI(AI_SYS+themaContext(ctx), msgs, 1024).then(function(t){ U.chat.push({role:"assistant",content:t||"(keine Antwort)"}); })
    .catch(function(e){ U.chat.push({role:"error",content:e.message}); })
    .finally(function(){ chatBusy=false; saveChat(); renderChatLog(); var x=document.querySelector('[data-action="chat-send"]'); if(x){x.disabled=false;x.textContent="Senden";} });
}

/* ── Tageslektion (Lehrer) ─────────────────────────────────────────────── */
function viewLektion(app){
  app.innerHTML='<div class="pagehead"><h1>Tageslektion</h1></div><div class="empty"><div class="spin"></div><p>Lektion wird geladen …</p></div>';
  var pl=plan();
  fbGet(nsp("lessons/"+todayISO())).then(function(lesson){
    var html='<div class="pagehead"><h1>Tageslektion</h1><p>'+esc(fmtDate(todayISO()))+(pl.set?' · Prüfung in '+pl.daysLeft+' Tagen':'')+'</p></div>';
    // Von n8n gelieferte Lektion (Lehrer-Text + Fragen)
    if(lesson){
      if(lesson.titel) html+='<div class="pagehead" style="margin:0 0 10px"><h1 style="font-size:20px">'+esc(lesson.titel)+'</h1></div>';
      if(lesson.text||lesson.intro) html+='<div class="card prose" style="margin-bottom:14px">'+md(lesson.text||lesson.intro)+'</div>';
      var nf=(lesson.fragen||[]).length;
      html+='<div class="card" style="text-align:center;padding:22px"><div style="font-size:15px;margin-bottom:6px">'+(nf?nf+' Frage(n) von deinem Lehrer':'Lektion')+'</div>'+(nf?'<button class="btn primary" data-action="quiz-lesson">Fragen starten</button>':'')+'</div>';
      window.__lesson=lesson;
    } else {
      // Kein n8n-Text → eigener Plan-basierter Unterricht
      html+='<div class="card" style="margin-bottom:14px"><div class="section-title" style="margin:0 0 8px">Heute dran</div>';
      if(pl.set&&pl.todayTopics.length){ html+='<p class="muted" style="font-size:13px;margin:0 0 10px">Dein Plan sieht heute diese Themen vor:</p><div class="grid g-cards">';
        pl.todayTopics.forEach(function(r){ html+='<a class="card click tcard" href="'+themaLink(r)+'" style="text-decoration:none"><div class="kap">'+esc(r.fach)+'</div><h3 style="font-size:14px">'+esc(r.thema.titel)+'</h3><div class="foot">'+ring(themaMastery(r),32)+'<span class="btn sm">Lernen →</span></div></a>'; });
        html+='</div><div class="btnrow" style="margin-top:12px"><button class="btn primary" data-action="quiz-today">Fragen zu heutigen Themen</button><button class="btn violet" data-action="ai-lesson">✦ KI-Lektion generieren</button></div>';
      } else if(!pl.set){ html+='<p class="muted">Setze zuerst dein Prüfungsdatum.</p><button class="btn primary" data-action="exam-ask">Prüfungsdatum setzen</button>'; }
      else html+='<p>🎉 Alle Themen gemeistert! Wiederhole zur Sicherung.</p>';
      html+='</div>';
      var due=dueList(); if(due.length) html+='<div class="card" style="text-align:center"><div style="margin-bottom:8px">Ausserdem '+due.length+' fällige Wiederholung(en).</div><button class="btn" data-action="quiz-due">↻ Wiederholen</button></div>';
      html+='<p class="muted" style="font-size:12px;margin-top:12px">Tipp: Der n8n-Workflow „BM Tageslektion" kann täglich einen Lehrer-Text + Fragen nach <span class="mono">'+CFG.NS+'/lessons/'+todayISO()+'</span> in Firebase schreiben — dann erscheint er hier oben.</p>';
    }
    app.innerHTML=html;
  }).catch(function(e){ app.innerHTML='<div class="pagehead"><h1>Tageslektion</h1></div><div class="empty"><div class="ic">⚠️</div><p>'+esc(e.message)+'</p></div>'; });
}

    +'<div class="card" style="margin-bottom:12px"><label class="fld">Beherrschungs-Schwelle „gemeistert"</label><div class="muted" style="font-size:13px">Ein Thema gilt ab '+(MASTER*100)+'% als gemeistert (aus dem Leitner-Lernstand der Aufgaben).</div></div>'
    +'<div class="card" style="margin-bottom:12px"><h3>KI-Quelle</h3><p class="muted" style="font-size:13px">Die KI nutzt automatisch den <strong>in Quantus hinterlegten Anthropic-Key</strong> (Quantus → Einstellungen → API-Keys, gleiche Browser-Origin) und ruft die Anthropic-API direkt auf. Ohne hinterlegten Key läuft es über den n8n-Webhook <span class="mono">'+CFG.WH_CHAT+'</span> (Key serverseitig im n8n-Credential). Kein Key im Code.</p><div style="margin-top:8px">'+(storedAnthropicKey()?'<span class="badge ok">✓ Anthropic-Key aus Quantus erkannt</span>':'<span class="badge warn">Kein Quantus-Key auf diesem Gerät → n8n-Webhook wird genutzt</span>')+'</div></div>'
    +'<div class="card"><h3>Speicherung</h3><p class="muted" style="font-size:13px">Alle Daten (Fortschritt, Notizen, Fehler-Queue, Zieldatum, Chat) liegen in Firebase RTDB unter <span class="mono">'+CFG.NS+'/</span>. Lokaler Cache für schnelles Laden/Offline.</p><div class="btnrow" style="margin-top:8px"><button class="btn sm" data-action="reload-fb">Neu von Firebase laden</button></div></div>';
}

/* ── Pomodoro ──────────────────────────────────────────────────────────── */
function togglePomodoro(){ var el=document.getElementById("pomo"),tt=document.getElementById("pomo-t");
  if(timer){ clearInterval(timer); timer=null; el.classList.remove("on"); tt.textContent="25:00"; return; }
  var end=Date.now()+25*60000; el.classList.add("on");
  timer=setInterval(function(){ var left=Math.max(0,end-Date.now()); var m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    tt.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    if(left<=0){ clearInterval(timer); timer=null; el.classList.remove("on"); toast("Pomodoro fertig — kurze Pause!"); } }, 500);
}
function speak(text){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.slice(0,4000)); u.lang="de-CH"; speechSynthesis.speak(u); toast("Vorlesen … (nochmal tippen zum Stoppen)"); }catch(e){ toast("Vorlesen nicht verfügbar",true); } }

/* ── Event-Delegation ──────────────────────────────────────────────────── */
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-action]"); if(!el) return; var a=el.getAttribute("data-action"); var app=document.getElementById("app");
  switch(a){
    case "theme": { var light=document.documentElement.classList.toggle("theme-light"); document.documentElement.classList.toggle("theme-dark",!light); try{localStorage.setItem("quantus_themeMode",light?"light":"dark");}catch(x){} break; }
    case "nav-search": location.hash="#/suche"; break;
    case "nav-settings": location.hash="#/settings"; break;
    case "pomodoro": togglePomodoro(); break;
    case "modal-close": closeModal(); break;
    case "modal-bg": if(e.target===el) closeModal(); break;
    case "exam-ask": askExamDate(); break;
    case "exam-save": { var v=(document.getElementById("ex-date")||{}).value; if(v){ U.config.examDate=v; U.config.planStart=todayISO(); saveConfig(); closeModal(); toast("Lernplan erstellt"); route(); } break; }
    case "set-exam-save": { var v2=(document.getElementById("set-exam")||{}).value; U.config.examDate=v2||null; if(v2&&!U.config.planStart) U.config.planStart=todayISO(); saveConfig(); toast("Gespeichert"); route(); break; }
    case "reload-fb": { fbGet(CFG.NS).then(function(d){ d=d||{}; U.aufg=d.aufg||{};U.notes=d.notes||{};U.config=d.config||{};U.chat=d.chat||[];U.activity=d.activity||{}; cacheSave(); toast("Neu geladen"); route(); }).catch(function(x){toast(x.message,true);}); break; }
    case "goto": location.hash=el.getAttribute("data-h"); break;
    /* Quiz */
    case "quiz-thema": quiz=buildQuizFromThema(el.getAttribute("data-key")); quiz&&quiz.items.length?renderQuiz(app):toast("Keine Aufgaben"); break;
    case "quiz-due": quiz=buildQuizFromDue(); quiz.items.length?renderQuiz(app):toast("Nichts fällig"); break;
    case "quiz-weak": quiz=buildQuizWeak(); quiz.items.length?renderQuiz(app):toast("Keine schwachen Themen"); break;
    case "quiz-diff": quiz=buildQuizDifficulty(el.getAttribute("data-l")); quiz.items.length?renderQuiz(app):toast("Keine Aufgaben"); break;
    case "quiz-sim": quiz=buildQuizSim(parseInt(el.getAttribute("data-n"),10)); renderQuiz(app); break;
    case "quiz-today": { var pl=plan(); quiz=buildQuizTopics(pl.todayTopics); quiz.items.length?renderQuiz(app):toast("Keine Themen"); break; }
    case "quiz-lesson": if(window.__lesson){ quiz=buildQuizFromLesson(window.__lesson); renderQuiz(app); } break;
    case "quiz-mc": quiz.chosen=parseInt(el.getAttribute("data-i"),10); quiz.revealed=true; renderQuiz(app); break;
    case "quiz-reveal": quiz.revealed=true; renderQuiz(app); break;
    case "quiz-grade": { var ok=el.getAttribute("data-ok")==="1"; var it=quiz.items[quiz.idx]; if(it&&it.key) gradeAufg(it.key,ok,{a:it.a,fach:(it.rec&&it.rec.fach),thema:(it.rec&&it.rec.thema&&it.rec.thema.titel)}); if(ok)quiz.results.correct++;else quiz.results.wrong++; quiz.idx++; quiz.revealed=false; quiz.chosen=null; renderQuiz(app); break; }
    case "quiz-quit": quiz=null; break;
    /* Karteikarten */
    case "card-flip": app.__flip=!app.__flip; app.querySelector(".flip").classList.toggle("flipped",app.__flip); break;
    case "card-next": app.__i=(app.__i+1)%app.__deck.length; app.__flip=false; viewKarteikarten(app); break;
    case "card-prev": app.__i=(app.__i-1+app.__deck.length)%app.__deck.length; app.__flip=false; viewKarteikarten(app); break;
    case "card-shuffle": app.__deck=shuffle(app.__deck); app.__i=0; app.__flip=false; viewKarteikarten(app); break;
    /* Chat */
    case "chat-send": chatSend(); break;
    case "chat-quick": chatSend(el.getAttribute("data-q")); break;
    case "chat-clear": U.chat=[]; saveChat(); renderChatLog(); break;
    /* AI */
    case "ai-explain": { var r=IDX.byKey[el.getAttribute("data-key")]; aiModal("Erklärung: "+r.thema.titel, function(){ return callAI(AI_SYS, [{role:"user",content:"Erklaere das Thema verstaendlich und pruefungsnah, mit einem Beispiel."+themaContext(r)}], 1200); }); break; }
    case "ai-simplify": { var r2=IDX.byKey[el.getAttribute("data-key")]; aiModal("Einfach erklärt: "+r2.thema.titel, function(){ return callAI(AI_SYS, [{role:"user",content:"Erklaere das Thema so einfach wie moeglich, wie fuer eine 12-jaehrige Person, mit einer Alltags-Analogie."+themaContext(r2)}], 900); }); break; }
    case "ai-summary": { var r3=IDX.byKey[el.getAttribute("data-key")]; aiModal("Zusammenfassung: "+r3.thema.titel, function(){ return callAI(AI_SYS, [{role:"user",content:"Fasse das Thema in maximal 5 Bullet-Points zusammen (das Pruefungsrelevante)."+themaContext(r3)}], 700); }); break; }
    case "ai-more": { var r4=IDX.byKey[el.getAttribute("data-key")]; aiModal("Zusätzliche Aufgaben: "+r4.thema.titel, function(){ return callAI(AI_SYS, [{role:"user",content:"Erstelle 3 neue Uebungsaufgaben zu diesem Thema (Mix aus Multiple-Choice und offen), jeweils mit Loesung und kurzer Erklaerung."+themaContext(r4)}], 1200); }); break; }
    case "ai-hint": { var it2=quiz.items[quiz.idx]; aiModal("Tipp", function(){ return callAI(AI_SYS, [{role:"user",content:"Gib einen kurzen Hinweis (KEINE Loesung nennen!) zu dieser Aufgabe: „"+it2.a.frage+"\""}], 300); }); break; }
    case "ai-grade": { var it3=quiz.items[quiz.idx]; var ua=(document.getElementById("open-answer")||{}).value||""; if(!ua.trim()){ toast("Erst eine Antwort eingeben"); break; }
      aiModal("KI-Feedback", function(){ return callAI(AI_SYS, [{role:"user",content:"Frage: „"+it3.a.frage+"\"\nMusterloesung: „"+it3.a.loesung+"\"\nMeine Antwort: „"+ua+"\"\n\nBewerte meine Antwort (richtig/teilweise/falsch), sage warum und was fehlt. Kurz."}], 600); }); break; }
    case "ai-lesson": { var pl2=plan(); var names=pl2.todayTopics.map(function(r){return r.thema.titel+" ("+r.fach+")";}).join(", ");
      aiModal("KI-Tageslektion", function(){ return callAI(AI_SYS, [{role:"user",content:"Halte eine kurze, motivierende Tageslektion (wie ein Lehrer) zu diesen Themen fuer heute: "+names+". Erklaere die Kernidee jedes Themas in 2-3 Saetzen und gib am Ende einen Lerntipp."}], 1400); }); break; }
    case "tts": { var rr=IDX.byKey[el.getAttribute("data-key")]; if(window.__speaking){ speechSynthesis.cancel(); window.__speaking=false; } else { speak(rr.thema.titel+". "+(rr.thema.theorie||"")); window.__speaking=true; } break; }
  }
});
var noteTimer=null;
document.addEventListener("input", function(e){ var el=e.target;
  if(el.getAttribute&&el.getAttribute("data-action")==="note-input"){ var k=el.getAttribute("data-key"),st=document.getElementById("note-status"); if(st)st.textContent="…";
    clearTimeout(noteTimer); noteTimer=setTimeout(function(){ var fk=fbKey(k); if((el.value||"").trim()) U.notes[fk]=el.value; else delete U.notes[fk]; saveNote(k); if(st)st.textContent="✓ gespeichert"; }, 600); }
  if(el.getAttribute&&el.getAttribute("data-action")==="search-live"){ runSearch(el.value); }
});
document.addEventListener("keydown", function(e){
  if(e.target&&e.target.id==="chat-input"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); chatSend(); }
  if(quiz&&!quiz.revealed){ var it=quiz.items[quiz.idx]; if(it&&it.a.typ==="mc"&&/^[1-9]$/.test(e.key)){ var i=parseInt(e.key,10)-1; if(i<(it.a.optionen||[]).length){ quiz.chosen=i; quiz.revealed=true; renderQuiz(document.getElementById("app")); } } }
});

boot();
